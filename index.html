c networks, never copper"],"e":"Because the monitoring port's bandwidth might not keep up with combined traffic from multiple high-speed sources, a physical tap can be the better choice for very high-bandwidth monitoring needs.","h":"This limitation specifically concerns a potential mismatch between combined source traffic volume and the single monitoring port's capacity."},{"q":"What does SPAN stand for, as used in the context of port mirroring?","a":"Switched Port Analyzer","w":["Signal Processing Analysis Network","System Performance Audit Node","Secure Protocol Access Node"],"e":"This is the specific expansion of the SPAN acronym as referenced in the context of switch-based traffic mirroring.","h":"This specific acronym expansion was given directly in the video in relation to this switch feature."},{"q":"What is a wireless survey tool used for, and what more advanced hardware might be needed for very detailed wireless analysis?","a":"A wireless survey tool gathers information about wireless coverage and potential interference; a dedicated Wi-Fi analyzer (possibly with a spectrum analyzer) may be needed for more detailed information","w":["Wireless survey tools can only be used to configure DHCP settings on an access point","A wireless survey tool requires no specialized hardware and works through any standard ethernet cable","Detailed wireless analysis can only be performed using a basic cable tester"],"e":"While basic survey tools (sometimes built into an OS or access point) handle general coverage checks, dedicated analyzer hardware provides much deeper RF-level detail.","h":"Consider the progression from basic built-in tools to specialized, dedicated hardware for increasingly detailed wireless analysis."},{"q":"What is a spectrum analyzer capable of showing that a basic Wi-Fi analyzer might not, and what example interference source was given in the video?","a":"A spectrum analyzer can show an entire range of frequencies and every signal being broadcast on them, including non-802.11 sources; a microwave oven was given as an example interference source","w":["A spectrum analyzer can only detect interference from other Wi-Fi access points, nothing else","Spectrum analyzers are incapable of detecting any interference sources at all","A microwave oven was specifically stated to have no effect on wireless frequencies"],"e":"This broader frequency visibility helps identify interference sources beyond just competing Wi-Fi networks, including non-wireless-network equipment.","h":"This specific example appliance was named in the video as a potential source of interference detectable by this type of tool."},{"q":"What is a visual fault locator, and how does it help identify problems with fiber optic cable?","a":"A device that shines light down a fiber (like a specialized flashlight) to identify breaks, which become visible as light leaking out around the break point","w":["A visual fault locator is a type of software used to analyze packet capture files","This device works exclusively on copper cabling and has no fiber optic application","Visual fault locators require the fiber to be submerged in water to detect breaks"],"e":"This simple but effective tool reveals physical breaks in fiber by visually showing where light escapes the cable rather than continuing through it.","h":"This relatively simple tool relies on a very visual and intuitive principle: light escaping at the exact point of a physical break."}]},{"id":"basic-network-device-commands","section":"Troubleshooting Tools","title":"Basic Network Device Commands","blurb":"show mac-address-table, show route, show interface, show config, show arp, show vlan, and show power","cards":[{"q":"Why can learning one manufacturer's network device commands help you work with equipment from a different manufacturer?","a":"Command syntax and output tend to be very similar across manufacturers, even though they're not exactly identical, making the underlying concepts transferable","w":["Every manufacturer uses the exact same command syntax with zero differences at all","Commands are completely unrelated between manufacturers and must be learned entirely from scratch each time","Only a single manufacturer's equipment is used in professional networking environments"],"e":"Understanding the underlying technology and concepts makes it much easier to adapt to the specific syntax differences of a new manufacturer's equipment.","h":"The transferable value here comes from conceptual similarity across manufacturers, even without identical syntax."},{"q":"What does the show mac-address-table command display, and why is it useful for troubleshooting?","a":"It lists all MAC addresses the switch has learned and which ports they were learned on, useful for troubleshooting issues like traffic being sent out every interface or a full MAC address table","w":["It displays only the total number of VLANs configured on the switch","This command shows information exclusively about PoE power usage on the switch","Show mac-address-table can only be used to change network IP addressing"],"e":"This command gives direct visibility into the switch's forwarding decisions, which is essential when diagnosing unexpected flooding or table capacity issues.","h":"This command specifically exposes the switch's internal MAC-to-port mapping table that drives its forwarding decisions."},{"q":"What does the show route command display, and how can you use it to trace traffic across multiple routers?","a":"It displays the routes in a router's routing table; by checking this command on each router in sequence, you can trace the specific path traffic would take across the network","w":["Show route can only display the very first route in the table, nothing else","This command exclusively shows wireless channel configuration, unrelated to routing","Show route is only usable on switches and has no application on routers"],"e":"Walking through this command on successive routers along a path lets you verify and trace the actual forwarding decisions being made end to end.","h":"This command's output, when checked sequentially across multiple devices, can reconstruct the complete routing path for a given destination."},{"q":"In the example show route output from the video, what did the abbreviations R and C represent in the routing table?","a":"R represented a route learned via RIP, and C represented a directly connected route","w":["R represented a router reboot event, and C represented a configuration change log","R represented a remote VPN connection, and C represented a cached DNS entry","Both R and C represented identical, interchangeable route types with no distinction"],"e":"These specific abbreviations identify how each route in the table was learned or established, which is important context when troubleshooting.","h":"These two specific letter abbreviations each indicate a different method by which that particular route became known to the router."},{"q":"What kinds of information can the show interface command reveal about a specific network interface?","a":"Whether it's up, down, or administratively disabled; its speed, duplex, and MTU; and any errors like CRC errors, dropped frames, or input/output errors","w":["Show interface can only display the interface's physical color-coding scheme","This command exclusively shows the total number of VLANs on the entire switch","Show interface only works for wireless interfaces, not wired ethernet ports"],"e":"This comprehensive interface-level view combines status, configuration, and error statistics into a single useful troubleshooting command.","h":"This command's output spans multiple categories: basic status, configuration details, and various error/performance counters."},{"q":"In the show interface example from the video, what speed and duplex setting was shown for the FastEthernet 0/0 interface?","a":"Full duplex at 100 megabits per second","w":["Half duplex at 10 megabits per second","Full duplex at 1,000 megabits per second (1 gigabit)","Half duplex at 100 megabits per second"],"e":"The 'Fast' in FastEthernet corresponds to the 100-megabit speed shown, running in full duplex mode in this particular example.","h":"The interface naming convention itself gives a strong hint about the specific speed shown in this example output."},{"q":"What does the show config (or show running-config) command display, and why might its syntax vary between devices?","a":"It displays the device's current active configuration as text; syntax and formatting vary because each manufacturer uses a different format for storing and presenting configuration information","w":["Show config can only display configuration in a universally identical format across every manufacturer","This command exclusively displays hardware temperature and fan speed information","Show config is only available through a graphical web interface, never the command line"],"e":"Because each manufacturer has its own configuration file format and conventions, administrators need some familiarity with each specific platform's syntax.","h":"This variability in format and syntax directly reflects differing conventions used by different equipment manufacturers."},{"q":"What does the show arp command display on a switch or router, and how is it similar to something covered in an earlier video?","a":"It displays the ARP cache stored on that device (IP address, MAC address, and interface); this is similar to viewing the ARP cache on a workstation's own operating system using arp -a","w":["Show arp displays only wireless signal strength information, unrelated to ARP caching","This command can only be used to manually add new static ARP entries, not view existing ones","Show arp exclusively shows information about DNS server configuration"],"e":"This parallel between device-level and OS-level ARP cache viewing highlights that the same underlying ARP caching concept applies at both levels.","h":"This device-level command serves essentially the same viewing purpose as a command covered earlier for individual operating systems."},{"q":"What does the show vlan command display, and what specific VLAN-related details can it reveal about a switch?","a":"It lists all VLANs configured on the device, which interfaces are assigned to each VLAN, and what the default VLAN is for the switch","w":["Show vlan only displays the total bandwidth usage across the entire switch","This command exclusively shows PoE power consumption, unrelated to VLAN configuration","Show vlan can only be used to physically relabel switch ports with new VLAN names"],"e":"This command gives administrators a clear view of how VLAN assignments are currently configured across all of a switch's interfaces.","h":"This command's output specifically maps VLAN IDs to their assigned interfaces, including identifying the switch's default VLAN."},{"q":"What does the show power command display on a PoE-capable switch, and why is it useful for capacity planning?","a":"It shows PoE status (on/off) for each interface and how much power is being used by connected devices, helping determine if additional PoE devices can be added without exceeding capacity","w":["Show power only displays the switch's total electrical bill for the billing period","This command exclusively shows wireless signal power output, unrelated to PoE","Show power can only be used to physically power off the entire switch chassis"],"e":"In the example given (370 watts total, 40 watts used, 330 watts remaining), this command directly informs decisions about adding more PoE-powered devices.","h":"This command specifically helps answer a capacity-planning question: how much additional PoE power headroom remains available."}]}]</script>
<script>
(function(){
'use strict';
var KEY='netplus-study-bench-v1';
var DECKS=JSON.parse(document.getElementById('deck-data').textContent);
var SECTIONS=[];DECKS.forEach(function(d){if(SECTIONS.indexOf(d.section)<0)SECTIONS.push(d.section)});
var CARDS=[];
DECKS.forEach(function(d){d.list=[];d.cards.forEach(function(c,i){var o={id:d.id+':'+i,deck:d,sec:d.section,i:i,q:c.q,a:c.a,w:c.w,e:c.e,h:c.h||''};d.list.push(o);CARDS.push(o)})});
var BY={};CARDS.forEach(function(c){BY[c.id]=c});
var $app=document.getElementById('app');

/* ---------- utils ---------- */
var esc=function(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};
var dayNum=function(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
var secColor=function(sec){return 'var(--s'+(SECTIONS.indexOf(sec)%4)+')'};
var LETTERS=['A','B','C','D'];

/* ---------- persistence (per-browser convenience; works without it) ---------- */
function load(){var v=null;try{v=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  v=v&&typeof v==='object'?v:{};
  return {cards:v.cards||{},days:v.days||{},exams:v.exams||[],theme:v.theme||'system',goal:v.goal||20}}
var P=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
function applyTheme(){var r=document.documentElement;if(P.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',P.theme)}
applyTheme();

/* ---------- spaced repetition (Leitner boxes) ---------- */
var INT=[0,1,3,7,14,30];
var rec=function(c){return P.cards[c.id]};
function level(c){var r=rec(c);if(!r)return 'new';if(r.b===0)return 'weak';if(r.b>=4)return 'mast';return 'learn'}
var isDue=function(c){var r=rec(c);return !!r&&r.d<=dayNum()};
var isWeak=function(c){var r=rec(c);return !!r&&(r.b===0||(r.x>0&&r.b<=2))};
function nextBox(c,rating){var r=rec(c);var b=r?r.b:0;
  if(rating===0)return 0;if(rating===1)return Math.max(1,b);if(rating===2)return Math.min(5,b+1);return Math.min(5,b+2)}
function grade(c,rating){var t=dayNum();var r=P.cards[c.id]||{b:0,d:t,s:0,c:0,x:0};
  r.b=nextBox(c,rating);r.d=t+INT[r.b];r.s++;if(rating===0)r.x++;else r.c++;P.cards[c.id]=r;
  var dd=P.days[t]||(P.days[t]={n:0,c:0});dd.n++;if(rating>0)dd.c++;
  var keys=Object.keys(P.days);if(keys.length>120){keys.sort(function(a,b){return a-b}).slice(0,keys.length-100).forEach(function(k){delete P.days[k]})}
  save()}
var lbl=function(d){return d===0?'today':d===1?'1 day':d+' days'};
function counts(list){var o={new:0,weak:0,learn:0,mast:0,due:0};list.forEach(function(c){o[level(c)]++;if(isDue(c))o.due++});return o}
function streak(){var t=dayNum(),n=0;if(!(P.days[t]&&P.days[t].n))t--;while(P.days[t]&&P.days[t].n){n++;t--}return n}

function pool(src){
  if(src==='smart')return shuffle(CARDS.filter(isDue)).concat(shuffle(CARDS.filter(function(c){return !rec(c)})));
  if(src==='due')return shuffle(CARDS.filter(isDue));
  if(src==='weak')return shuffle(CARDS.filter(isWeak));
  if(src==='new')return shuffle(CARDS.filter(function(c){return !rec(c)}));
  if(src==='all')return shuffle(CARDS);
  if(src.indexOf('deck:')===0)return shuffle(CARDS.filter(function(c){return c.deck.id===src.slice(5)}));
  if(src.indexOf('sec:')===0)return shuffle(CARDS.filter(function(c){return c.sec===src.slice(4)}));
  return []}

/* ---------- state ---------- */
var V='home',S=null,X=null,R=null,RESET=false;
var PF={mode:'cards',src:'smart',n:20};
var EF={n:60};
var BF={q:'',deck:'',lvl:''};
var examTimer=null;
function go(v){V=v;if(v!=='examrun'&&examTimer){clearInterval(examTimer);examTimer=null}render();window.scrollTo(0,0)}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2600)}

/* ---------- shared pieces ---------- */
function header(){
  var th={system:'Theme: auto',light:'Theme: light',dark:'Theme: dark'}[P.theme];
  return '<header class="top"><div class="brand"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><b>Network+ Study Bench</b><span>CompTIA Network+ · fundamentals and devices</span></div></div>'+
  '<button class="btn ghost sm" data-act="theme">'+th+'</button></header>'+
  '<nav class="tabs" aria-label="Sections">'+[['home','Home'],['practice','Practice'],['exam','Exam'],['browse','Browse']].map(function(t){
    var cur=(V===t[0]||(V==='examres'&&t[0]==='exam'))?' aria-current="page"':'';return '<button class="tab" data-act="nav" data-v="'+t[0]+'"'+cur+'>'+t[1]+'</button>'}).join('')+'</nav>'}
function ports(list){return '<div class="ports" aria-hidden="true">'+list.map(function(c){return '<i class="port p-'+level(c)+'"></i>'}).join('')+'</div>'}
function legend(){return '<div class="legend"><span><i class="port"></i>New</span><span><i class="port p-weak"></i>Weak</span><span><i class="port p-learn"></i>Learning</span><span><i class="port p-mast"></i>Mastered</span></div>'}
function pct(a,b){return b?Math.round(a/b*100):0}
function barRow(name,a,b){var p=pct(a,b);var cl=p>=75?'':p>=60?'mid':'low';return '<div class="bar"><span>'+esc(name)+'</span><div class="meter"><i class="'+cl+'" style="width:'+p+'%"></i></div><span class="num">'+p+'%</span></div>'}

/* ---------- HOME ---------- */
function deckCard(d){
  var c=counts(d.list);
  return '<article class="deck" style="--sc:'+secColor(d.section)+'"><h3>'+esc(d.title)+'</h3><p>'+esc(d.blurb)+'</p>'+ports(d.list)+
  '<div class="meta"><span class="num">'+c.mast+'/'+d.list.length+' mastered</span><span class="num">'+(c.due?c.due+' due':'')+'</span></div>'+
  '<div class="btns"><button class="btn sm" data-act="start" data-mode="cards" data-src="deck:'+d.id+'" data-n="0">Cards</button><button class="btn sm" data-act="start" data-mode="quiz" data-src="deck:'+d.id+'" data-n="0">Quiz</button></div></article>'}
function home(){
  var all=counts(CARDS),t=dayNum(),td=P.days[t]||{n:0,c:0};
  var smartN=Math.min(P.goal,all.due+all.new),weakN=CARDS.filter(isWeak).length,mp=pct(all.mast,CARDS.length);
  var C=2*Math.PI*38,dash=(mp/100*C).toFixed(1);
  var wk='';var mx=Math.max(P.goal,1);for(var k=13;k>=0;k--){var dd=P.days[t-k];if(dd&&dd.n>mx)mx=dd.n}
  for(var k2=13;k2>=0;k2--){var d2=P.days[t-k2],n=d2?d2.n:0;var dt=new Date(Date.now()-k2*864e5);
    wk+='<div title="'+n+' answered"><i class="'+(n?'on':'')+'" style="height:'+Math.max(3,Math.round(n/mx*34))+'px"></i><small aria-hidden="true">'+'SMTWTFS'.charAt(dt.getDay())+'</small></div>'}
  var h=header();
  h+='<section class="stats" aria-label="Overview"><div class="stat"><span class="eyebrow">Cards</span><b>'+CARDS.length+'</b><small>'+DECKS.length+' decks</small></div>'+
    '<div class="stat"><span class="eyebrow">Due now</span><b>'+all.due+'</b><small>'+all.new+' still new</small></div>'+

/* ---------- PRACTICE ---------- */

function practice(){

/* ---------- SESSION ---------- */
function startSession(mode,src,n){
  var q=pool(src);if(n>0)q=q.slice(0,n);
  if(!q.length){toast('Nothing to practice in that set right now.');return}
  S={mode:mode,src:src,queue:q,idx:0,total:q.length,done:{},doneN:0,flipped:false,hint:false,chosen:null,opts:null,log:[]};
  if(mode==='quiz')S.opts=shuffle([q[0].a].concat(q[0].w));
  go('session')}
function sbar(){var p=pct(S.doneN,S.total);return '<div class="sbar"><button class="btn ghost sm" data-act="exit">Exit</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><i style="width:'+p+'%"></i></div><span class="num muted">'+Math.min(S.doneN+1,S.total)+' / '+S.total+'</span></div>'}
function sessionView(){
  var c=S.queue[S.idx];if(!c)return finishSession();
  var st='--sc:'+secColor(c.sec);
  var hint=c.h?'<div class="hintbox">'+(S.hint?'<div class="hint">'+esc(c.h)+'</div>':'<button class="btn ghost sm" data-act="hint">Need a nudge? <kbd>H</kbd></button>')+'</div>':'';
  if(S.mode==='cards'){
    var ratings=[['Missed it',0],['Hard',1],['Got it',2],['Easy',3]];
    return '<div class="sess" style="'+st+'">'+sbar()+'<div class="deckline">'+esc(c.deck.title)+'</div>'+
    '<div class="flip'+(S.flipped?' flipped':'')+'" data-act="flip"><div class="flip-in">'+
      '<div class="face front" aria-hidden="'+S.flipped+'"><span class="eyebrow">Question</span><div class="qt">'+esc(c.q)+'</div>'+hint+'</div>'+
      '<div class="face back" aria-hidden="'+!S.flipped+'"><span class="eyebrow">Answer</span><div class="ans">'+esc(c.a)+'</div><p class="why">'+esc(c.e)+'</p>'+
      '<div><span class="eyebrow">Easy to confuse with</span><div class="alts" style="margin-top:8px">'+c.w.map(function(w){return '<span>'+esc(w)+'</span>'}).join('')+'</div></div></div>'+
    '</div></div>'+
    (S.flipped?'<div class="rate" role="group" aria-label="How well did you know it?">'+ratings.map(function(r){return '<button class="r'+r[1]+'" data-act="rate" data-r="'+r[1]+'"><b>'+(r[1]+1)+' · '+r[0]+'</b><small>back in '+lbl(INT[nextBox(c,r[1])])+'</small></button>'}).join('')+'</div>':
     '<div class="actions" style="justify-content:center"><button class="btn primary big" data-act="flip" data-autofocus>Show answer</button></div>')+
    '<p class="keys"><kbd>Space</kbd> flip · <kbd>1</kbd>-<kbd>4</kbd> rate · <kbd>H</kbd> hint</p></div>'}
  /* quiz */
  var ans=S.chosen!==null;var ok=ans&&S.opts[S.chosen]===c.a;
  var optsH=S.opts.map(function(o,i){var cl='opt';if(ans){if(o===c.a)cl+=' ok';else if(i===S.chosen)cl+=' no'}
    return '<button class="'+cl+'" data-act="pick" data-i="'+i+'"'+(ans?' disabled':'')+'><span class="k">'+LETTERS[i]+'</span><span>'+esc(o)+'</span></button>'}).join('');
  var fb='';
  if(ans)fb='<div class="fb '+(ok?'ok':'no')+'" role="status"><b>'+(ok?'Correct.':'Not quite.')+'</b> '+(ok?'':'The answer is <b>'+esc(c.a)+'</b>. ')+esc(c.e)+'</div>'+
    '<div class="actions"><span class="muted num" style="align-self:center">'+(ok?'Moves up a box':'Back to box 0')+'</span><button class="btn primary" data-act="next" data-autofocus>Next <kbd>Enter</kbd></button></div>';
  return '<div class="sess" style="'+st+'">'+sbar()+'<div class="deckline">'+esc(c.deck.title)+'</div><div class="qbox"><div class="qt">'+esc(c.q)+'</div><div class="opts" role="group" aria-label="Answer choices">'+optsH+'</div>'+
    (ans?'':hint)+fb+'</div>'+(ans?'':'<p class="keys"><kbd>1</kbd>-<kbd>4</kbd> or <kbd>A</kbd>-<kbd>D</kbd> to answer · <kbd>H</kbd> hint</p>')+'</div>'}
function advance(requeueCard){
  if(requeueCard){var at=Math.min(S.queue.length,S.idx+5);S.queue.splice(at,0,requeueCard)}
  S.idx++;S.flipped=false;S.hint=false;S.chosen=null;
  if(S.mode==='quiz'&&S.queue[S.idx])S.opts=shuffle([S.queue[S.idx].a].concat(S.queue[S.idx].w));
  render()}
function markDone(c){if(!S.done[c.id]){S.done[c.id]=1;S.doneN++}}
function doRate(r){var c=S.queue[S.idx];if(!c)return;grade(c,r);S.log.push({c:c,r:r});
  if(r===0){advance(c)}else{markDone(c);advance()}}
function doPick(i){if(S.chosen!==null)return;var c=S.queue[S.idx];S.chosen=i;var ok=S.opts[i]===c.a;
  grade(c,ok?2:0);S.log.push({c:c,r:ok?2:0,pick:S.opts[i]});if(ok)markDone(c);render()}
function doNext(){var c=S.queue[S.idx];var ok=S.opts[S.chosen]===c.a;if(ok)advance();else advance(c)}
function finishSession(){
  var first={};S.log.forEach(function(l){if(first[l.c.id]===undefined)first[l.c.id]=l.r});
  var ids=Object.keys(first),again=ids.filter(function(i){return first[i]===0}),good=ids.length-again.length;
  var rc={0:0,1:0,2:0,3:0};S.log.forEach(function(l){rc[l.r]++});
  var p=pct(good,ids.length);
  var h='<div class="sess"><div class="panel"><span class="eyebrow">Session complete</span><div class="score" style="margin-top:10px"><b class="'+(p>=75?'pass':'fail')+'">'+p+'%</b><span class="muted">'+good+' of '+ids.length+' right on the first try</span></div>';
  if(S.mode==='cards')h+='<p class="muted num" style="margin-top:8px">Missed '+rc[0]+' · Hard '+rc[1]+' · Got it '+rc[2]+' · Easy '+rc[3]+'</p>';
  h+='<div class="actions" style="justify-content:flex-start"><button class="btn primary" data-act="again">Another round</button>'+(again.length?'<button class="btn" data-act="retrymissed">Practice the '+again.length+' I missed</button>':'')+'<button class="btn ghost" data-act="nav" data-v="home">Back home</button></div></div>';
  if(again.length){h+='<h3 style="margin:22px 0 4px">Review these</h3>'+again.map(function(id){var c=BY[id];return reviewItem(c,'no','Missed',null)}).join('')}
  return h+'</div>'}
function reviewItem(c,cls,tag,your){
  return '<details class="rv" style="--sc:'+secColor(c.sec)+'"><summary><span class="tag '+cls+'">'+tag+'</span><span><b style="font-weight:500">'+esc(c.q)+'</b><small class="muted" style="display:block;font-size:12px">'+esc(c.deck.title)+'</small></span></summary><div class="in">'+
    (your!==null&&your!==undefined?'<div class="bad">Your answer: '+esc(your)+'</div>':'')+'<div class="good">'+esc(c.a)+'</div><div>'+esc(c.e)+'</div></div></details>'}

/* ---------- EXAM ---------- */
function exam(){
  var h=header();
  h+='<div class="two"><section class="panel"><h2 style="margin-bottom:6px">Exam simulator</h2><p class="muted" style="margin-bottom:16px">Mixed questions from every deck, one minute each, no feedback until you submit. The real Network+ passes around 75%, so that is the line used here.</p>'+
  '<fieldset class="field"><legend>Questions</legend><div class="seg">'+[30,60,90,CARDS.length].map(function(n){var nn=Math.min(n,CARDS.length);return '<input type="radio" name="en" id="e'+n+'" value="'+nn+'" data-chg="en"'+(EF.n===nn?' checked':'')+'><label for="e'+n+'">'+(n===CARDS.length?'All '+nn:nn)+'</label>'}).join('')+'</div></fieldset>'+
  '<p class="muted num" style="margin-bottom:16px">Time limit: '+EF.n+' minutes</p><button class="btn primary big" data-act="startexam">Begin exam</button></section>'+
  '<section class="panel"><h3 style="margin-bottom:10px">Recent attempts</h3>'+
  (P.exams.length?P.exams.slice().reverse().map(function(x){var d=new Date(x.t);return '<div class="row"><span class="muted">'+d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+x.n+' questions · '+Math.floor(x.secs/60)+'m '+(x.secs%60)+'s</span><b class="num '+(x.pct>=75?'pass':'fail')+'">'+x.pct+'%</b></div>'}).join(''):'<p class="muted">No attempts yet. Your first one is a baseline, not a verdict.</p>')+'</section></div>';
  return h}
function buildExam(n){
  var per={};shuffle(CARDS).forEach(function(c){(per[c.deck.id]=per[c.deck.id]||[]).push(c)});
  var lists=shuffle(Object.keys(per)).map(function(k){return per[k]}),out=[],i=0;
  while(out.length<n&&lists.some(function(l){return l.length})){var l=lists[i%lists.length];if(l.length)out.push(l.shift());i++}
  return shuffle(out).map(function(c){return {c:c,opts:shuffle([c.a].concat(c.w)),ans:null,flag:false}})}
function startExam(){
  X={qs:buildExam(EF.n),i:0,total:EF.n*60,left:EF.n*60,confirm:false};
  examTimer=setInterval(function(){X.left--;var t=document.getElementById('timer');if(t){t.textContent=fmt(X.left);t.className='timer'+(X.left<=60?' low':'')}if(X.left<=0)finishExam()},1000);
  go('examrun')}
var fmt=function(s){s=Math.max(0,s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
function examRun(){
  var q=X.qs[X.i],c=q.c,answered=X.qs.filter(function(z){return z.ans!==null}).length,flagged=X.qs.filter(function(z){return z.flag}).length;
  var h='<div class="sess" style="--sc:'+secColor(c.sec)+'"><div class="etop"><b class="num">Question '+(X.i+1)+' of '+X.qs.length+'</b><span class="muted num">'+answered+' answered</span><span id="timer" class="timer'+(X.left<=60?' low':'')+'">'+fmt(X.left)+'</span></div>'+
  '<div class="qbox" style="margin-top:14px"><div class="qt">'+esc(c.q)+'</div><div class="opts" role="group" aria-label="Answer choices">'+
  q.opts.map(function(o,i){return '<button class="opt'+(q.ans===i?' sel':'')+'" data-act="xpick" data-i="'+i+'" aria-pressed="'+(q.ans===i)+'"><span class="k">'+LETTERS[i]+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div></div>'+
  '<div class="actions"><button class="btn" data-act="xprev"'+(X.i?'':' disabled')+'>Previous</button><button class="btn'+(q.flag?' primary':'')+'" data-act="xflag" aria-pressed="'+q.flag+'">'+(q.flag?'Flagged':'Flag for review')+' <kbd>F</kbd></button><button class="btn" data-act="xnext"'+(X.i<X.qs.length-1?'':' disabled')+'>Next</button></div>'+
  '<div class="nav" aria-label="Question navigator">'+X.qs.map(function(z,i){return '<button data-act="xgo" data-i="'+i+'" class="'+(z.ans!==null?'done ':'')+(z.flag?'flag ':'')+(i===X.i?'cur':'')+'" aria-label="Question '+(i+1)+(z.ans!==null?', answered':'')+(z.flag?', flagged':'')+'">'+(i+1)+'</button>'}).join('')+'</div>';
  if(X.confirm)h+='<div class="confirm" role="alert"><div><b>Finish the exam?</b><div class="muted">'+(X.qs.length-answered)+' unanswered · '+flagged+' flagged</div></div><div class="acts"><button class="btn primary" data-act="xsubmit">Submit and score</button><button class="btn" data-act="xkeep">Keep going</button><button class="btn danger" data-act="xquit">Quit without scoring</button></div></div>';
  else h+='<div class="actions" style="justify-content:flex-end"><button class="btn" data-act="xfinish">Finish exam</button></div>';
  return h+'</div>'}
function finishExam(){
  if(examTimer){clearInterval(examTimer);examTimer=null}
  var okN=0,per={},sec={};
  X.qs.forEach(function(z){var ok=z.ans!==null&&z.opts[z.ans]===z.c.a;z.ok=ok;if(ok)okN++;
    if(z.ans!==null)grade(z.c,ok?2:0);
    var d=per[z.c.deck.title]=per[z.c.deck.title]||[0,0];d[1]++;if(ok)d[0]++;
    var s=sec[z.c.sec]=sec[z.c.sec]||[0,0];s[1]++;if(ok)s[0]++});
  var p=pct(okN,X.qs.length),secs=X.total-Math.max(0,X.left);
  P.exams.push({t:Date.now(),n:X.qs.length,pct:p,secs:secs});P.exams=P.exams.slice(-10);save();
  R={qs:X.qs,ok:okN,pct:p,secs:secs,per:per,sec:sec,f:'all'};X=null;go('examres')}
function examRes(){
  var h=header();
  h+='<section class="panel" style="margin-top:16px"><span class="eyebrow">Exam result</span><div class="score" style="margin-top:10px"><b class="'+(R.pct>=75?'pass':'fail')+'">'+R.pct+'%</b><span class="muted">'+R.ok+' of '+R.qs.length+' correct · '+(R.pct>=75?'above':'below')+' the 75% line · '+Math.floor(R.secs/60)+'m '+(R.secs%60)+'s</span></div>'+
  '<div class="actions" style="justify-content:flex-start"><button class="btn primary" data-act="startexam">Retake a new mix</button><button class="btn" data-act="start" data-mode="quiz" data-src="weak" data-n="20">Quiz my weak spots</button></section>';
  h+='<div class="two"><section class="panel"><h3>By section</h3><div class="bars">'+Object.keys(R.sec).map(function(k){return barRow(k,R.sec[k][0],R.sec[k][1])}).join('')+'</div></section>'+
  '<section class="panel"><h3>Weakest decks</h3><div class="bars">'+Object.keys(R.per).sort(function(a,b){return R.per[a][0]/R.per[a][1]-R.per[b][0]/R.per[b][1]}).slice(0,6).map(function(k){return barRow(k,R.per[k][0],R.per[k][1])}).join('')+'</div></section></div>';
  h+='<h3 style="margin:24px 0 8px">Review</h3><div class="seg" role="group" aria-label="Filter review">'+[['all','All'],['wrong','Wrong'],['flag','Flagged']].map(function(f){return '<input type="radio" name="rf" id="rf'+f[0]+'" value="'+f[0]+'" data-chg="rf"'+(R.f===f[0]?' checked':'')+'><label for="rf'+f[0]+'">'+f[1]+'</label>'}).join('')+'</div>';

  return h}

/* ---------- render ---------- */
function render(){
  var h='';
  if(V==='home')h=home();else if(V==='practice')h=practice();else if(V==='exam')h=exam();else if(V==='browse')h=browse();
  else if(V==='session')h=sessionView();else if(V==='examrun')h=examRun();else if(V==='examres')h=examRes();
  $app.innerHTML=h;
  var af=$app.querySelector('[data-autofocus]');if(af)af.focus({preventScroll:false});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.dataset.act;
  if(a==='nav'){if(el.dataset.v==='home')V='home';go(el.dataset.v)}
  else if(a==='theme'){P.theme={system:'light',light:'dark',dark:'system'}[P.theme];save();applyTheme();render()}
  else if(a==='start')startSession(el.dataset.mode,el.dataset.src,+el.dataset.n);
  else if(a==='startpf')startSession(PF.mode,PF.src,PF.n);
  else if(a==='exit')go('home');
  else if(a==='flip'){S.flipped=!S.flipped?true:S.flipped;render()}
  else if(a==='hint'){S.hint=true;render()}
  else if(a==='rate')doRate(+el.dataset.r);
  else if(a==='pick')doPick(+el.dataset.i);
  else if(a==='next')doNext();
  else if(a==='again')startSession(S.mode,S.src,S.total);
  else if(a==='retrymissed'){var first={};S.log.forEach(function(l){if(first[l.c.id]===undefined)first[l.c.id]=l.r});
    var ms=Object.keys(first).filter(function(i){return first[i]===0}).map(function(i){return BY[i]});var m=S.mode;
    S={mode:m,src:'missed',queue:shuffle(ms),idx:0,total:ms.length,done:{},doneN:0,flipped:false,hint:false,chosen:null,opts:null,log:[]};
    if(m==='quiz')S.opts=shuffle([S.queue[0].a].concat(S.queue[0].w));render();window.scrollTo(0,0)}
  else if(a==='startexam')startExam();
  else if(a==='xpick'){X.qs[X.i].ans=+el.dataset.i;render()}
  else if(a==='xprev'){X.i=Math.max(0,X.i-1);render()}
  else if(a==='xnext'){X.i=Math.min(X.qs.length-1,X.i+1);render()}
  else if(a==='xgo'){X.i=+el.dataset.i;render()}
  else if(a==='xflag'){X.qs[X.i].flag=!X.qs[X.i].flag;render()}
  else if(a==='xfinish'){X.confirm=true;render()}
  else if(a==='xkeep'){X.confirm=false;render()}
  else if(a==='xsubmit')finishExam();
  else if(a==='xquit'){X=null;go('exam')}
  else if(a==='reset')resetAsk(true);
  else if(a==='resetno')resetAsk(false);
  else if(a==='reset2'){P=load();P.cards={};P.days={};P.exams=[];save();resetAsk(false);toast('Progress erased.')}
  else if(a==='bkmake'){var ta=document.getElementById('bk');ta.value=btoa(unescape(encodeURIComponent(JSON.stringify(P))));ta.select()}
  else if(a==='bkcopy'){var t2=document.getElementById('bk');if(!t2.value)t2.value=btoa(unescape(encodeURIComponent(JSON.stringify(P))));t2.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t2.value).then(function(){toast('Backup code copied.')},function(){toast('Select the text and copy it.')})}else toast('Select the text and copy it.')}
  else if(a==='bkload'){var v=document.getElementById('bk').value.trim();try{var o=JSON.parse(decodeURIComponent(escape(atob(v))));
    if(!o||typeof o.cards!=='object')throw 0;P={cards:o.cards||{},days:o.days||{},exams:o.exams||[],theme:o.theme||P.theme,goal:o.goal||20};save();applyTheme();render();toast('Progress restored.')}catch(x){toast('That code did not look right.')}}
});
function resetAsk(on){var d=document.querySelector('.foot details');var open=d&&d.open;RESET=on;render();var d2=document.querySelector('.foot details');if(d2&&open)d2.open=true}
document.addEventListener('change',function(e){
  var el=e.target;if(!el.dataset.chg)return;var k=el.dataset.chg;
  if(k==='src')PF.src=el.value;else if(k==='mode')PF.mode=el.value;else if(k==='len')PF.n=+el.value;
  else if(k==='en')EF.n=+el.value;else if(k==='bd')BF.deck=el.value;else if(k==='bl')BF.lvl=el.value;else if(k==='rf'){R.f=el.value}
  if(k==='bd'||k==='bl'){document.getElementById('blist').innerHTML=browseList()}else render()});
document.addEventListener('input',function(e){if(e.target.id==='bq'){BF.q=e.target.value;document.getElementById('blist').innerHTML=browseList()}});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var tag=e.target.tagName;if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
  var onBtn=/BUTTON|SUMMARY|A/.test(tag),k=e.key,lk=k.toLowerCase();
  if(V==='session'&&S){
    if(k==='Escape'){go('home');return}
    if(S.mode==='cards'){
      if((k===' '||k==='Enter')&&!onBtn){e.preventDefault();if(!S.flipped){S.flipped=true;render()}}
      else if(S.flipped&&'1234'.indexOf(k)>=0&&k){doRate(+k-1)}
      else if(lk==='h'&&!S.flipped&&S.queue[S.idx]&&S.queue[S.idx].h){S.hint=true;render()}
    }else{
      if(S.chosen===null){var i=LETTERS.indexOf(k.toUpperCase());if(i<0&&'1234'.indexOf(k)>=0&&k)i=+k-1;
        if(i>=0&&i<S.opts.length)doPick(i);else if(lk==='h'&&S.queue[S.idx].h){S.hint=true;render()}}
      else if((k==='Enter'||k===' '||k==='ArrowRight')&&!onBtn){e.preventDefault();doNext()}
    }
  }else if(V==='examrun'&&X){
    var j=LETTERS.indexOf(k.toUpperCase());if(j<0&&'1234'.indexOf(k)>=0&&k)j=+k-1;
    if(j>=0&&j<4){X.qs[X.i].ans=j;render()}
    else if(k==='ArrowRight'&&X.i<X.qs.length-1){X.i++;render()}
    else if(k==='ArrowLeft'&&X.i>0){X.i--;render()}
    else if(lk==='f'){X.qs[X.i].flag=!X.qs[X.i].flag;render()}
  }
});
render();
})();
</script>
</body></html>
