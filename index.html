<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Network+ Study Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#edf0f3; --surface:#fafbfc; --surface2:#e2e7ec; --fg:#121c26; --muted:#566676; --line:#c9d2db;
  --accent:#1952b8; --accent-fg:#ffffff; --accent-soft:#dbe6fa;
  --good:#17824a; --good-soft:#d8f0e2; --bad:#c13a2b; --bad-soft:#f8ddd8; --warn:#b07a08; --warn-soft:#f6e8c4;
  --s0:#d9741a; --s1:#2a9a58; --s2:#2d6bd1; --s3:#8b5a3a;
  --shadow:0 1px 0 rgba(18,28,38,.06),0 10px 26px -14px rgba(18,28,38,.3);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151c; --surface:#16202a; --surface2:#202c38; --fg:#e7edf3; --muted:#93a3b2; --line:#2b3947;
    --accent:#7aa8ff; --accent-fg:#0b1522; --accent-soft:#1c2e4f;
    --good:#4cc27d; --good-soft:#15341f; --bad:#ff8272; --bad-soft:#3d1f1b; --warn:#e6b84d; --warn-soft:#3a2f12;
    --s0:#f09a4a; --s1:#55c283; --s2:#6c9cf0; --s3:#c49168;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16202a; --surface2:#202c38; --fg:#e7edf3; --muted:#93a3b2; --line:#2b3947;
  --accent:#7aa8ff; --accent-fg:#0b1522; --accent-soft:#1c2e4f;
  --good:#4cc27d; --good-soft:#15341f; --bad:#ff8272; --bad-soft:#3d1f1b; --warn:#e6b84d; --warn-soft:#3a2f12;
  --s0:#f09a4a; --s1:#55c283; --s2:#6c9cf0; --s3:#c49168;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:940px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--cond);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11.5px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header + nav */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:grid;grid-template-columns:repeat(4,7px);gap:3px;padding:7px;background:var(--fg);border-radius:6px}
.logo i{height:16px;border-radius:1px;background:var(--s0)} .logo i:nth-child(2){background:var(--s1)} .logo i:nth-child(3){background:var(--s2)} .logo i:nth-child(4){background:var(--s3)}
.brand b{display:block;font:600 21px/1.1 var(--cond)} .brand span{display:block;font-size:12.5px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px;padding:4px;background:var(--surface2);border-radius:10px}
.tab{border:0;background:transparent;padding:9px 6px;border-radius:7px;font:500 14px var(--sans);color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab:hover{color:var(--fg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface2)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{padding:13px 20px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.stat b{display:block;font:500 26px/1.1 var(--mono);font-variant-numeric:tabular-nums;margin-top:8px}
.stat small{color:var(--muted);font-size:12px}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-top:14px}
.hero h2{margin-bottom:6px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface2)} .ring .fgc{stroke:var(--good);stroke-linecap:butt}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:500 20px/1 var(--mono)} .ring small{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.goal{margin-top:16px}
.goal .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.week{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:12px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.week i{display:block;width:100%;min-height:3px;background:var(--surface2);border-radius:2px}
.week i.on{background:var(--accent)}
.week small{font-size:10px;color:var(--muted);line-height:1}

.sec{margin-top:30px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sechead::before{content:"";width:34px;height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sc) 0 7px,var(--surface) 7px 9px);border:1px solid var(--sc)}
.sechead small{color:var(--muted);margin-left:auto}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.deck{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--sc);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.deck h3{font-size:18px}
.deck p{font-size:13px;color:var(--muted);min-height:2.7em}
.ports{display:flex;gap:4px;flex-wrap:wrap}
.port{width:13px;height:13px;border-radius:2px;border:1.5px solid var(--line);display:block}
.p-weak{background:var(--bad);border-color:var(--bad)} .p-learn{background:var(--warn);border-color:var(--warn)} .p-mast{background:var(--good);border-color:var(--good)}
.deck .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.deck .btns{display:flex;gap:8px;margin-top:auto}
.deck .btns .btn{flex:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* forms */
.field{display:grid;gap:6px;margin-bottom:16px}
.field label,.field legend{font:500 12px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0}
select,input[type=search],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{font:500 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer}
.seg input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:16px}
.tips{display:grid;gap:12px;font-size:14px}
.tips li{margin:0;padding-left:0}
.tips ol{margin:0;padding-left:20px;display:grid;gap:10px}

/* session */
.sess{max-width:720px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.deckline{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:13px;color:var(--muted)}
.deckline::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--sc)}
.flip{perspective:1400px;cursor:pointer}
.flip-in{display:grid;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--sc);border-radius:14px;padding:26px 24px;box-shadow:var(--shadow);min-height:280px;display:flex;flex-direction:column;gap:14px}
.face.back{transform:rotateY(180deg)}
.face .qt{font:600 24px/1.3 var(--cond);text-wrap:balance}
.face .ans{font:600 24px/1.3 var(--cond);color:var(--good)}
.face .why{font-size:15px}
.hintbox{margin-top:auto;font-size:14px;color:var(--muted)}
.hintbox .hint{background:var(--warn-soft);color:var(--fg);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 6px 6px 0}
.alts{display:flex;gap:6px;flex-wrap:wrap}
.alts span{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:3px 8px;text-decoration:line-through;text-decoration-color:var(--bad)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate button{display:grid;gap:3px;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:center}
.rate button b{font-weight:600}
.rate button small{font:500 11.5px var(--mono);color:var(--muted)}
.rate .r0{border-bottom:3px solid var(--bad)} .rate .r1{border-bottom:3px solid var(--warn)} .rate .r2{border-bottom:3px solid var(--good)} .rate .r3{border-bottom:3px solid var(--accent)}
.rate button:hover{background:var(--surface2)}
.keys{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center}
kbd{font:500 11.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface)}
.qbox{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--sc);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qbox .qt{font:600 23px/1.3 var(--cond);text-wrap:balance}
.opts{display:grid;gap:9px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--muted);background:var(--surface2)}
.opt .k{flex:none;font:500 12px var(--mono);width:24px;height:24px;border-radius:5px;background:var(--surface2);display:grid;place-content:center;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .k{background:var(--good);color:var(--bg)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .k{background:var(--bad);color:var(--bg)}
.opt[disabled]{cursor:default;color:inherit}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.fb.ok{border-color:var(--good);background:var(--good-soft)} .fb.no{border-color:var(--bad);background:var(--bad-soft)}
.fb b{font-family:var(--cond);font-size:17px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}

/* results */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font:500 56px/1 var(--mono)}
.pass{color:var(--good)} .fail{color:var(--bad)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) 1fr 52px;gap:10px;align-items:center;font-size:13.5px}
.bar .meter{height:10px} .bar .meter i{background:var(--good)} .bar .meter i.low{background:var(--bad)} .bar .meter i.mid{background:var(--warn)}
.bar span:last-child{text-align:right}
.rv{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
.rv summary{list-style:none;cursor:pointer;display:flex;gap:10px;padding:11px 14px;align-items:flex-start}
.rv summary::-webkit-details-marker{display:none}
.tag{flex:none;font:500 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;margin-top:2px}
.tag.ok{background:var(--good-soft);color:var(--good)} .tag.no{background:var(--bad-soft);color:var(--bad)} .tag.sk{background:var(--warn-soft);color:var(--warn)} .tag.nw{background:var(--surface2);color:var(--muted)}
.rv .in{padding:0 14px 14px 14px;display:grid;gap:8px;font-size:14px}
.rv .in .good{color:var(--good);font-weight:500} .rv .in .bad{color:var(--bad)}

/* exam */
.etop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer{margin-left:auto;font:500 20px var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:18px}
.nav button{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font:500 12px var(--mono);cursor:pointer;padding:0}
.nav .done{background:var(--accent-soft);border-color:var(--accent)}
.nav .flag{box-shadow:inset 0 -4px 0 var(--warn)}
.nav .cur{outline:2px solid var(--fg);outline-offset:1px}
.confirm{margin-top:16px;padding:14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;display:grid;gap:10px}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}

/* browse */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.list{margin-top:14px}
.list .rv summary b{font-weight:500}
.list .rv summary small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.foot{margin-top:34px;display:grid;gap:12px}
.foot details{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.foot summary{cursor:pointer;font-weight:500}
.foot textarea{min-height:90px;font:12px var(--mono);margin-top:10px}
.foot .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.danger{color:var(--bad)}

@media (max-width:680px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr}
  .bar{grid-template-columns:1fr 52px} .bar .meter{grid-column:1/-1;order:3}
  .face,.qbox{padding:20px 16px} .face .qt,.qbox .qt{font-size:21px}
  .rate{grid-template-columns:repeat(2,1fr)}
  .score b{font-size:44px}
  .ring{justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  .flip-in,.meter i,.prog i{transition:none}
}
</style>

<script type="application/json" id="deck-data">[{"id":"osi-model","section":"Networking Fundamentals","title":"Understanding the OSI Model","blurb":"The 7 layers, mnemonics, and mapping real traffic to each layer","cards":[{"q":"What does OSI stand for?","a":"Open Systems Interconnection","w":["Operating System Interface","Optimal Service Integration","Open Standard Internet"],"e":"OSI stands for Open Systems Interconnection Reference model, used to describe the broad process data takes as it traverses a network, regardless of protocol suite.","h":"Think about what the model standardizes between different vendors and systems."},{"q":"What mnemonic helps remember the OSI layers from layer 7 down to layer 1?","a":"All People Seem To Need Data Processing","w":["Please Do Not Throw Sausage Pizza Away","Big Data Never Sleeps Peacefully","All Systems Process Network Traffic Directly"],"e":"\"All People Seem To Need Data Processing\" maps to Application, Presentation, Session, Transport, Network, Data Link, Physical, from layer 7 down to layer 1.","h":"The other common mnemonic goes bottom to top instead of top to bottom."},{"q":"A bad cable, damaged fiber, or wireless interference is a problem at which OSI layer?","a":"Layer 1, the Physical layer","w":["Layer 2, the Data Link layer","Layer 3, the Network layer","Layer 4, the Transport layer"],"e":"Layer 1 deals with the actual electrical, light, or radio signal traveling across the medium, with almost no protocols involved at this layer.","h":"This is the lowest layer, dealing with raw signals, not addressing."},{"q":"Why is OSI layer 2 often called the switching layer?","a":"Because switches forward traffic based on destination MAC address","w":["Because it only handles fiber connections","Because it encrypts all traffic","Because it assigns IP addresses"],"e":"Layer 2, the Data Link layer, is the MAC address layer. Switches use the destination MAC address to decide how to forward Ethernet frames.","h":"MAC stands for Media Access Control, the hardware address burned into the network adapter."},{"q":"What does a router use at OSI layer 3 to determine the next hop for traffic?","a":"The destination IP address","w":["The destination MAC address","The TCP port number","The application protocol"],"e":"Layer 3, the Network layer, is the routing layer. Routers examine the destination IP address to determine where to forward a packet next, and this layer can also fragment frames into smaller pieces.","h":"This is also the layer associated with subnet masks."},{"q":"Why is OSI layer 4 nicknamed the 'post office layer'?","a":"Because TCP and UDP are responsible for getting information from one device to another","w":["Because it assigns physical mailing addresses to devices","Because it only handles encrypted mail traffic","Because it stores data permanently on disk"],"e":"Layer 4, the Transport layer, uses TCP and UDP to transport information end to end, often breaking data into pieces and reassembling it, much like mail being delivered and pieced together.","h":"Think about what gets your letter from one side of the network to the other."},{"q":"What kind of activity happens at OSI layer 5, the Session layer?","a":"Starting, stopping, or restarting a communication session, and tunneling","w":["Encrypting application data with SSL or TLS","Assigning IP addresses to new devices","Forwarding frames based on MAC address"],"e":"Layer 5 provides communication management between two devices, handling session initiation, control, and termination, and tunneling protocols often operate here too.","h":"This layer is about managing the conversation itself, not the data inside it."},{"q":"What kind of processing happens at OSI layer 6, the Presentation layer?","a":"Character encoding and application encryption/decryption, like SSL/TLS","w":["Routing packets between subnets","Assigning MAC addresses to network cards","Running loopback tests on cables"],"e":"Layer 6 puts data into a format we eventually see with our eyes, including character encoding and encryption/decryption, often discussed alongside the application layer just above it.","h":"This is the layer just below what you actually interact with on screen."},{"q":"Which OSI layer do protocols like HTTP, HTTPS, FTP, DNS, and POP3 operate at?","a":"Layer 7, the Application layer","w":["Layer 6, the Presentation layer","Layer 5, the Session layer","Layer 3, the Network layer"],"e":"Layer 7 is the topmost layer, where we interact directly with applications, and it includes thousands of application protocols like HTTP, HTTPS, FTP, DNS, and POP3.","h":"This is the layer you actually see and interact with on screen."},{"q":"In a Wireshark capture of HTTPS traffic to Gmail, what does the TCP header with port numbers correspond to in the OSI model?","a":"Layer 4, the Transport layer","w":["Layer 3, the Network layer","Layer 2, the Data Link layer","Layer 7, the Application layer"],"e":"TCP encapsulation, including source and destination port numbers like destination port 443, maps to OSI layer 4. SSL/TLS below it encapsulates layers 5 through 7.","h":"This is the same layer associated with TCP and UDP port numbers in general."}]},{"id":"networking-devices","section":"Networking Fundamentals","title":"Networking Devices","blurb":"Routers, switches, firewalls, IDS/IPS, load balancers, proxies, NAS/SAN, APs","cards":[{"q":"Why is a router classified as an OSI layer 3 device?","a":"Because it routes traffic between IP subnets using the destination IP address","w":["Because it forwards traffic using MAC addresses","Because it inspects application-layer data","Because it manages physical signaling only"],"e":"Routers determine the next hop for traffic by examining IP addresses, which is layer 3 network-layer functionality, whether the device connects LANs, WANs, or both.","h":"This is the same OSI layer associated with IP addresses and subnet masks."},{"q":"What is a layer 3 switch?","a":"A switch that also has built-in routing functionality","w":["A switch that only works with fiber connections","A switch dedicated solely to wireless traffic","A switch that filters traffic by application"],"e":"A layer 3 switch isn't a switch operating at a new OSI layer; it's a device that combines an OSI layer 2 switch and an OSI layer 3 router inside one physical box.","h":"It's really two functions bundled into one piece of equipment."},{"q":"What type of hardware do network switches commonly rely on to forward traffic quickly?","a":"ASIC (Application-Specific Integrated Circuit)","w":["CPU (Central Processing Unit)","GPU (Graphics Processing Unit)","FPGA (Field-Programmable Gate Array) only"],"e":"Switches operate mostly in hardware, using ASICs designed specifically for the task of forwarding frames based on MAC address at very high speed.","h":"This hardware is purpose-built for one repetitive task rather than general computing."},{"q":"How does a Next-Generation Firewall (NGFW) differ from a traditional firewall?","a":"It can identify the specific application traversing the network, not just the port number","w":["It only filters traffic by MAC address","It assigns IP addresses automatically like DHCP","It only works with fiber connections"],"e":"A traditional firewall filters by TCP/UDP port number, while an NGFW can identify applications themselves and decide whether that application should be allowed on the network.","h":"Traditional firewalls look at ports; this newer type looks deeper."},{"q":"What is the key functional difference between an IDS and an IPS?","a":"An IPS can block an attack; an IDS can only alert or alarm","w":["An IDS can block an attack; an IPS can only alert or alarm","Both can block attacks equally well","Neither can block attacks, only report them"],"e":"Both IDS and IPS look for known attack types like buffer overflows or cross-site scripting, but only an Intrusion Prevention System can actually stop the traffic before it gets in; an IDS can only alert.","h":"One system actively stops traffic, the other just reports on it."},{"q":"What does a load balancer do, and what are some of its added capabilities?","a":"Distributes traffic across multiple servers, removes failed servers from rotation, and can do SSL offload, TCP offload, caching, and QoS","w":["It only encrypts traffic between client and server","It only assigns IP addresses to new devices","It only filters spam before it reaches an inbox"],"e":"A load balancer spreads requests across a server farm for uptime and availability, automatically detects and removes failed servers, and can optimize traffic through SSL/TCP offload, caching, and prioritization via QoS.","h":"Think about how a site handling millions of users every day stays up without downtime."},{"q":"What is the purpose of a proxy server sitting in the middle of a conversation?","a":"It performs requests on the user's behalf, checks responses for malicious content, and can cache, filter, and authenticate","w":["It distributes requests across multiple backend servers","It stores files using block-level access","It bridges wireless and wired network segments"],"e":"A proxy takes a user's request, performs it on their behalf, checks the response for malicious content, and returns it to the user, and can also provide caching, access control, and URL filtering.","h":"This device acts as a middleman that makes the request for you."},{"q":"What is the key difference between NAS and SAN storage?","a":"NAS provides file-level access; SAN provides block-level access","w":["NAS provides block-level access; SAN provides file-level access","Both provide identical file-level access","Both provide identical block-level access"],"e":"With NAS you must pull and rewrite an entire file to make a change, while a SAN allows modifying just the changed blocks within a file, which is far more efficient for large files.","h":"One requires moving the whole file; the other lets you touch just the changed pieces."},{"q":"Why is a wireless access point considered an OSI layer 2 device?","a":"Because it bridges wireless (802.11) and wired Ethernet (802.3) traffic based on MAC address","w":["Because it routes traffic between IP subnets","Because it manages TCP sessions","Because it interprets application-layer data"],"e":"An access point bridges communication between the wireless network and the wired Ethernet network, operating at the data link layer rather than performing any IP routing.","h":"It's making a translation between two media types, not routing between subnets."},{"q":"What is the purpose of a wireless LAN controller?","a":"It provides centralized management of many access points from one place","w":["It distributes traffic across multiple physical servers","It encrypts traffic between two firewalls","It acts as a proxy for outbound web requests"],"e":"Rather than configuring every access point individually, a wireless LAN controller gives administrators a single pane of glass to deploy, monitor, and update access points and manage seamless roaming between them.","h":"Think of this as the single centralized management tool for many access points at once."}]},{"id":"networking-functions","section":"Networking Fundamentals","title":"Networking Functions","blurb":"CDN, VPN concentrators, QoS, and Time to Live in IP and DNS","cards":[{"q":"What is a Content Delivery Network (CDN) designed to do?","a":"Cache and distribute data from geographically distributed servers close to end users","w":["Encrypt all traffic between a remote worker and the corporate network","Prioritize real-time applications over file transfers","Drop packets that loop endlessly between routers"],"e":"A CDN caches data at servers spread across geographic regions, such as North America, South America, Africa, and Asia, so users connect to a nearby cache instead of a single centralized server far away, making delivery faster and more efficient.","h":"Think about why a video site feels fast no matter where in the world you are."},{"q":"What is the main purpose of a VPN?","a":"To connect to a remote network while encrypting all data sent across the network","w":["To cache web content closer to end users","To prioritize certain applications over others on the network","To decrease a packet's time to live with each hop"],"e":"A VPN, or virtual private network, allows secure, encrypted data transfer across networks that are otherwise insecure, such as the public internet, which is especially useful for remote workers.","h":"This is about securing a connection over an inherently insecure network like the internet."},{"q":"What is the role of a VPN concentrator (head-end device)?","a":"It acts as the central connection point that performs high-speed encryption and decryption for many simultaneous VPN users","w":["It caches website content for faster delivery to nearby users","It assigns time to live values to outgoing IP packets","It balances traffic across multiple physical web servers"],"e":"A VPN concentrator, often a purpose-built appliance or integrated into a next-generation firewall, handles the real-time encryption and decryption needed to support many simultaneous secure VPN connections, though smaller networks may use software-based concentrators instead.","h":"This device is often purpose-built for high throughput, supporting hundreds or thousands of users at once."},{"q":"What is Quality of Service (QoS) used for?","a":"Prioritizing certain applications or traffic types over others on the network, based on bandwidth usage or data rate","w":["Encrypting traffic between two remote sites","Caching web content at geographically distributed servers","Decrementing a packet's time to live at every router hop"],"e":"QoS, also called traffic shaping or packet shaping, lets administrators prioritize applications like real-time audio or video over lower-priority traffic such as file transfers, often configured within a firewall, router, or switch.","h":"This is also known as traffic shaping or packet shaping."},{"q":"What problem is Time to Live (TTL) in IP designed to solve?","a":"It stops packets that are stuck looping endlessly between routers","w":["It encrypts packets traveling across the public internet","It caches DNS responses for a fixed number of seconds","It prioritizes real-time traffic over file transfers"],"e":"TTL is a counter in the IP header that decreases by one each time a router processes the packet; when it reaches zero, the router discards the packet, which prevents routing loops from consuming network resources indefinitely.","h":"Think about what happens if Router A thinks the next hop is Router B, and Router B thinks the next hop is Router A."},{"q":"In IP, what does the Time to Live (TTL) field actually measure?","a":"The number of router hops the packet is allowed to pass through before being discarded","w":["The number of seconds the packet may remain in a switch's buffer","The number of retransmissions allowed for a lost packet","The number of VPN tunnels the packet may traverse"],"e":"Each router that processes an IP packet decreases its TTL value by one; when the TTL reaches zero, the packet is discarded. This is measured in hops, not time.","h":"Every router along the path decreases this value by exactly one."},{"q":"What are the default TTL values for MacOS/Linux versus Windows?","a":"64 hops for MacOS and Linux; 128 hops for Windows","w":["128 hops for MacOS and Linux; 64 hops for Windows","32 hops for MacOS and Linux; 64 hops for Windows","255 hops for both MacOS/Linux and Windows"],"e":"MacOS and Linux typically default to a TTL of 64 hops, while Windows defaults to 128 hops. Since most internet paths are only around 12 to 16 hops, there is plenty of margin before TTL reaches zero.","h":"One of these two operating system families defaults to double the other's hop count."},{"q":"In DNS, what does Time to Live (TTL) measure, and how does it differ from TTL in routing?","a":"The number of seconds a resolved record should be cached locally, rather than the number of router hops","w":["The number of router hops before a DNS query is discarded","The number of simultaneous DNS queries allowed per client","The number of CDN servers that may cache the same record"],"e":"While a router's TTL is measured in hops, a DNS record's TTL is measured in seconds, telling resolvers how long to cache a resolved IP address before querying the DNS server again.","h":"A DNS TTL of 300 corresponds to five minutes, not 300 router hops."},{"q":"If a dig query shows a TTL of 300 for a DNS A record, what does that mean?","a":"The resolved IP address should be cached locally for 300 seconds (5 minutes) before being looked up again","w":["The packet can pass through 300 routers before being dropped","The DNS server will retry the query up to 300 times","The CDN will cache the content for 300 separate regions"],"e":"A TTL of 300 in a DNS response tells the querying system to cache that resolution for 300 seconds. After that time elapses, a new DNS query is required to get the current IP address.","h":"This TTL is measured in seconds, the same unit used for the 5-minute example in the lesson."},{"q":"Why might a web administrator want a relatively short DNS TTL, such as 300 seconds?","a":"So that changes to the server's IP address propagate to most users within a few minutes","w":["So that the CDN can distribute content to more regions","So that routers can detect loops more quickly","So that VPN concentrators can decrypt traffic faster"],"e":"A short DNS TTL means cached resolutions expire quickly, so if the administrator changes the IP address in DNS, most users will pick up the new address within about five minutes rather than being stuck with a stale cached entry.","h":"Think about how quickly you want the rest of the internet to notice if you change your server's address."}]},{"id":"designing-the-cloud","section":"Networking Fundamentals","title":"Designing the Cloud","blurb":"NFV, VPCs, transit/internet/NAT gateways, VPC endpoints, and security lists vs groups","cards":[{"q":"What is Network Function Virtualization (NFV)?","a":"Replacing physical routers, switches, and other network devices with virtual versions running in a virtualized environment","w":["Translating private IP addresses to public IP addresses for outbound traffic","Connecting multiple VPCs together through a central cloud router","Caching content at geographically distributed edge servers"],"e":"When physical infrastructure migrates to the cloud, the networking devices like routers, switches, and firewalls are virtualized too, keeping the same functionality but running as virtual appliances managed through a hypervisor instead of physical hardware.","h":"Think about what happens to your routers and switches when 100 physical servers become 100 virtual servers on one big host."},{"q":"What is a Virtual Private Cloud (VPC)?","a":"An isolated virtual network environment containing an application instance's servers, switches, routers, and firewalls","w":["A physical data center with redundant power and cooling","A security rule set applied to a single network interface card","A cached copy of content stored at a regional edge server"],"e":"A VPC bundles together virtual appliances like web servers, database servers, load balancers, virtual switches and routers, and virtual firewalls into one application instance, letting organizations keep separate VPCs isolated for different applications or teams while still managing each one individually.","h":"This is the cloud equivalent of a private, self-contained network segment for one application or team."},{"q":"What is the purpose of a transit gateway?","a":"It acts as a cloud router connecting multiple separate VPCs so devices in different VPCs can communicate","w":["It translates private IP addresses to a public IP address for outbound internet access","It filters inbound and outbound traffic based on port number and protocol","It caches static content closer to end users around the world"],"e":"A transit gateway sits in the middle of multiple VPCs and functions like a cloud router, enabling communication between application instances that would otherwise be isolated from each other.","h":"Think of this as the device in the middle that links otherwise-separate VPCs together."},{"q":"What is the difference between a VPC internet gateway and a VPC NAT gateway?","a":"An internet gateway allows inbound access from anyone on the internet; a NAT gateway allows outbound-only access by translating private addresses to a public one","w":["An internet gateway encrypts traffic between VPCs; a NAT gateway caches content for nearby users","An internet gateway connects two different cloud providers; a NAT gateway connects two subnets in the same VPC","An internet gateway assigns security groups; a NAT gateway assigns network security lists"],"e":"An internet gateway, also called a VPC gateway, makes application instances reachable by anyone on the internet, while a NAT gateway lets devices inside a VPC initiate outbound connections to the internet using Network Address Translation, without allowing unsolicited inbound access.","h":"One opens the door inward, the other only lets traffic go out."},{"q":"When would you use a VPC endpoint?","a":"To create a direct connection between a VPC on one cloud provider and a VPC (or resource) on another cloud provider, without using the internet gateway","w":["To cache content at the server closest to each user","To decrease a packet's time to live at every hop","To filter traffic by TCP or UDP port number on a single interface"],"e":"A VPC endpoint provides direct connectivity between resources on different cloud providers, useful when, for example, a private subnet's virtual machine needs to reach an external storage network without being exposed to the public internet.","h":"This is especially useful for reaching a private subnet that has no internet gateway of its own."},{"q":"What do network security lists and network security groups have in common?","a":"Both act like a cloud-based firewall, filtering traffic using TCP/UDP port numbers and IP addresses or CIDR blocks","w":["Both encrypt all traffic between VPCs automatically","Both are used only to connect separate cloud providers together","Both replace the need for a transit gateway"],"e":"Security lists and security groups both function as firewalls for cloud resources, letting administrators define inbound and outbound rules based on port numbers, protocols, and IP address ranges or CIDR blocks, similar to a traditional firewall.","h":"Both are rule sets built around ports, protocols, and addresses, just applied at different scopes."},{"q":"What is the key difference between a network security list and a network security group?","a":"A security list applies broadly to all virtual cloud networks at once; a security group can be assigned individually to specific virtual network interface cards (VNICs)","w":["A security list only filters outbound traffic; a security group only filters inbound traffic","A security list works only with IPv6; a security group works only with IPv4","A security list is for VPC endpoints; a security group is for transit gateways"],"e":"A network security list is automatically applied across all VPCs it's attached to, offering less granularity, while a network security group can be assigned to individual VNICs, allowing different rules for different interfaces even within the same subnet.","h":"One is broad and automatic; the other lets you target rules down to a single network interface."},{"q":"What is a key tradeoff of using network security groups instead of network security lists?","a":"Greater granularity down to individual interfaces, at the cost of more administrative overhead","w":["Lower security but easier management","Faster performance but no support for CIDR blocks","Automatic application to all VPCs but no support for TCP/UDP filtering"],"e":"Network security groups let you assign different rules to individual VNICs for fine-grained control, but managing many separate group assignments across interfaces takes more administrative effort than one broad security list.","h":"More granularity usually means more rules to keep track of."},{"q":"In cloud computing, what does multitenancy mean?","a":"Many different customers share and use the same underlying cloud infrastructure","w":["Each customer gets a dedicated physical server with no sharing","Every VPC must have its own dedicated transit gateway","Only one application instance can run per cloud account"],"e":"Multitenancy lets many different customers use the same shared cloud infrastructure, which improves efficiency and reduces cost compared to each customer needing fully dedicated physical hardware.","h":"Think about how cloud providers keep costs down by sharing hardware across many customers."},{"q":"What cloud characteristic allows an application to scale up during high demand and scale back down afterward?","a":"Elasticity","w":["Multitenancy","Network Function Virtualization","Transit gateway routing"],"e":"Elasticity is the cloud's ability to scale resources up when demand increases and scale them back down once demand subsides, letting organizations pay for and use only what they currently need.","h":"This is the property that makes cloud resources feel like they expand and shrink on demand."}]},{"id":"cloud-models","section":"Networking Fundamentals","title":"Cloud Models","blurb":"SaaS, PaaS, and IaaS, and who is responsible for what","cards":[{"q":"What is Software as a Service (SaaS)?","a":"A complete application you log into and use, with the provider managing the software and infrastructure","w":["A set of tools for building and customizing your own application","Raw computing hardware you install your own software on","A private data center you manage entirely yourself"],"e":"With SaaS, someone else writes, manages, and upgrades the application, and your data lives in that third-party platform. You simply log in and use it, like Google Mail or Office 365.","h":"Think about logging into Gmail. You never install or upgrade anything yourself."},{"q":"What is Infrastructure as a Service (IaaS)?","a":"Cloud computing resources (hardware) that you use to run and manage your own software and data","w":["A complete, ready-to-use application you log into","A set of development tools for building a custom app","A fully managed service where the provider handles your data"],"e":"IaaS, sometimes called Hardware as a Service (HaaS), gives you computing resources in the cloud, but you're responsible for installing, managing, and upgrading your own software and data on top of it.","h":"This is also sometimes called HaaS, Hardware as a Service."},{"q":"What is Platform as a Service (PaaS)?","a":"A set of development building blocks and tools provided by the cloud provider, used to build and customize your own application","w":["A complete application with no development required","Raw hardware with no software or tools included","A private on-premises data center"],"e":"PaaS sits between SaaS and IaaS. The provider manages the underlying engine that runs the application, while you build and maintain the app itself, similar to building a custom app on the salesforce.com platform.","h":"Think of building blocks provided by the platform, which you assemble into your own app."},{"q":"Why might an organization use a hybrid cloud configuration?","a":"To combine a public cloud for internet-facing applications with a private cloud for internal-only applications","w":["To avoid ever using a public cloud for any application","To eliminate the need for Infrastructure as a Service entirely","To guarantee every application is accessible from the internet"],"e":"Many organizations need both: a public cloud so anyone on the internet can access certain applications, and a private cloud (often their own virtualized local data center) for internal-only applications, combined into a hybrid model.","h":"This is about mixing public access needs with internal-only needs."},{"q":"In an on-premises (on-prem) deployment, who is responsible for the physical data center, network, and hosts?","a":"The customer, since everything from the data to the physical data center is their responsibility","w":["The cloud provider, since on-prem still relies on cloud infrastructure","Shared equally between the customer and the cloud provider","No one, since on-prem requires no physical infrastructure"],"e":"With on-prem, the customer owns every layer, from the physical data center and network up through the applications and data, unlike any cloud model where the provider takes on at least some of that responsibility.","h":"On-prem is the one model with no cloud provider in the responsibility matrix at all."},{"q":"In the IaaS responsibility matrix, what does the cloud provider typically manage?","a":"The physical data center, physical network, and physical host","w":["The applications and the data within them","The user accounts and devices","The identity and directory infrastructure"],"e":"With IaaS, the cloud provider handles the physical infrastructure layer (data center, network, and host), while the customer takes on responsibility for everything built on top of that, including the operating system, applications, and data.","h":"IaaS hands you the lowest layers of infrastructure and leaves the rest to you."},{"q":"In the SaaS responsibility matrix, what is clearly the provider's responsibility that is not the provider's responsibility under PaaS or IaaS?","a":"The application itself","w":["The physical data center only","The user's own devices","Regulatory compliance for the customer's industry"],"e":"With SaaS, the provider is responsible for the application itself, in addition to the infrastructure beneath it, which is more responsibility than they take on in PaaS (where the customer builds the app) or IaaS (where the customer manages the software).","h":"Think about how much more the provider does for you when you simply log in and use the app."},{"q":"A company wants to buy time on a web server where they install and manage their own software. Which cloud model fits best?","a":"Infrastructure as a Service (IaaS)","w":["Software as a Service (SaaS)","Platform as a Service (PaaS)","Network Function Virtualization (NFV)"],"e":"Buying server time and then installing and managing your own software and data on top of it is a classic example of IaaS, since the provider only supplies the underlying computing resources.","h":"The web service provider is just selling you computing resources, not a finished app or dev platform."},{"q":"A company wants to build a custom application using tools and building blocks supplied by the provider, without managing the underlying engine. Which cloud model fits best?","a":"Platform as a Service (PaaS)","w":["Software as a Service (SaaS)","Infrastructure as a Service (IaaS)","Network Address Translation (NAT)"],"e":"PaaS is the middle ground: the provider manages the underlying engine that runs the application, while the customer uses the provided building blocks to develop and customize their own app, similar to building on the salesforce.com platform.","h":"This is the model where you build the app using the provider's tools, but don't manage the engine underneath."},{"q":"Why is Infrastructure as a Service also sometimes called Hardware as a Service (HaaS)?","a":"Because you're effectively using hardware in the cloud and running your own software on top of it","w":["Because the provider only sells physical hardware for on-prem installation","Because HaaS refers only to cloud-based hardware security modules","Because HaaS is an older, deprecated term no longer related to IaaS"],"e":"IaaS is sometimes called HaaS because the core offering is computing hardware in the cloud, with the customer bringing and managing their own software and data on top of that hardware.","h":"The name describes what's actually being rented: hardware, not a finished app or dev platform."}]},{"id":"introduction-to-ip","section":"Ports and Protocols","title":"Introduction to IP","blurb":"The moving-truck analogy, TCP vs UDP, encapsulation, and port numbers","cards":[{"q":"In the moving-truck analogy for data transfer, what does the Internet Protocol (IP) represent?","a":"The moving truck, which does the heavy lifting of moving data across the network","w":["The road the truck drives on","The boxes loaded inside the truck","The individual rooms in the destination house"],"e":"IP is the truck doing the heavy lifting of moving data, the network itself (wired, wireless, WAN) is the road, and TCP/UDP are the boxes carrying the actual application data inside the truck.","h":"The network connections are the road; this is the vehicle driving on it."},{"q":"In the encapsulation order of a typical Ethernet frame, which is innermost?","a":"The TCP or UDP payload, inside the TCP/UDP header, inside the IP header, inside the Ethernet header and trailer","w":["The Ethernet header, inside the IP header, inside the TCP/UDP header","The IP header, inside the Ethernet header, inside the TCP/UDP payload","The Ethernet trailer, inside the TCP/UDP header, inside the IP payload"],"e":"A frame is built from the outside in: Ethernet header, then IP header, then TCP or UDP header, then the actual application payload, and finally the Ethernet trailer at the very end.","h":"Think of encapsulation like nested boxes; the application data is the innermost box."},{"q":"Why are TCP and UDP described as operating at OSI layer 4, enabling multiplexing?","a":"Because they let many different applications be sent simultaneously between the same two devices","w":["Because they assign MAC addresses to each application","Because they determine the physical cabling used for transmission","Because they encrypt data by default before transmission"],"e":"Layer 4 multiplexing means multiple applications (like web browsing and email) can be transferred simultaneously between the same two devices, each distinguished by its own port number.","h":"This is the same OSI layer where TCP and UDP port numbers are used."},{"q":"What makes TCP a \"connection-oriented\" and \"reliable\" protocol?","a":"It has a formal setup and teardown process, and the receiver acknowledges data so lost packets can be resent","w":["It never requires any setup process before sending data","It only works over encrypted VPN tunnels","It guarantees lower latency than UDP in all cases"],"e":"TCP formally establishes and tears down a session, and because the receiver acknowledges every segment, the sender knows if data was lost and can retransmit it, and the receiver can also configure flow control.","h":"Contrast this with UDP, which has none of this formal setup or acknowledgment process."},{"q":"Why is UDP described as \"connectionless\" and \"unreliable\"?","a":"There's no formal session setup/teardown and no acknowledgment, so there's no way to confirm delivery or control flow","w":["Because UDP has a much higher chance of failing to deliver data than TCP","Because UDP always encrypts data before sending it","Because UDP cannot be used for any real-time applications"],"e":"UDP sends packet after packet with no acknowledgment, no error recovery, and no flow control. \"Unreliable\" here is not about a higher failure rate; it just means there's no delivery confirmation process.","h":"UDP and TCP have the same actual chance of successful delivery; the difference is purely the acknowledgment process."},{"q":"In the house-delivery analogy, what do TCP and UDP port numbers represent?","a":"The specific room inside the house that a box of data should be delivered to","w":["The street address of the destination house itself","The size of the moving truck used for delivery","The company that manufactured the moving truck"],"e":"While the destination IP address gets the truck to the right house, the TCP or UDP port number tells it which specific \"room\" (application) the data should be delivered to, such as port 80 for a web server.","h":"The IP address gets you to the house; the port number gets you to the right room."},{"q":"What is the range of nonephemeral (well-known) ports, and what are they typically used for?","a":"Ports 0 through 1023, typically used by server-side applications like web servers on port 80 or 443","w":["Ports 1024 through 65535, used only by client applications","Ports 0 through 65535, used exclusively for UDP traffic","Ports 49152 through 65535, reserved for dynamic allocation only"],"e":"Nonephemeral ports (0-1023) are permanent, well-known port numbers commonly used by server applications, while ephemeral ports (1024-65535) are temporary ports typically used by clients, though this is a convention rather than a strict rule.","h":"These are the permanent port numbers you'd expect a web server to always use."},{"q":"Is changing a server's port number (for example, moving a web server off port 80) a valid security mechanism?","a":"No, changing a port number is only for communication purposes; a firewall is still needed to actually allow or block traffic","w":["Yes, changing the port number alone fully secures the server from unauthorized access","Yes, but only if you are also using UDP instead of TCP","No, because port numbers cannot be changed on any server"],"e":"A port number just designates which application should receive the data, similar to a room number. It is not a security control. You still need a firewall to determine whether traffic is actually allowed through the network.","h":"Remember, port numbers are about delivery, not about permission to deliver."},{"q":"Are TCP port 80 and UDP port 80 the same port?","a":"No, TCP and UDP port numbers are independent, so TCP port 80 and UDP port 80 can be used by two completely different applications at the same time","w":["Yes, they always refer to the exact same application","No, because UDP cannot use port numbers below 1024","Yes, but only when IPv6 is in use"],"e":"Even though both can range from 0 to 65535, a TCP port number and a UDP port number with the same value are entirely independent from each other and could be assigned to two different applications simultaneously.","h":"TCP and UDP maintain two completely separate sets of port assignments."},{"q":"In a packet decode, a client at 10.0.0.1 uses source port 3000 to reach a server at 10.0.0.2 on port 80. When the server replies, what happens to these port numbers?","a":"The source and destination ports (and IP addresses) are reversed so the reply reaches the originating client application","w":["The server generates a brand new random port for both source and destination","The port numbers stay exactly the same in both directions with no reversal","The server always replies using port 443 regardless of the original request"],"e":"To send a reply, the server swaps the source and destination port numbers (and IP addresses) from the original request, ensuring the response is delivered back to the exact application and device that made the request.","h":"Think about how a letter's return address lets a reply find its way back to the original sender."}]},{"id":"common-ports","section":"Ports and Protocols","title":"Common Ports","blurb":"Well-known TCP/UDP port numbers for FTP, SSH, DNS, HTTP/S, DHCP, SNMP, and more","cards":[{"q":"What two TCP ports does FTP use by default, and what is each for?","a":"TCP port 20 for the actual file transfer, and TCP port 21 for control information","w":["TCP port 21 for file transfer and TCP port 20 for control information","A single port, TCP 21, for both control and file transfer","UDP port 20 for file transfer and UDP port 21 for control information"],"e":"FTP is unusual in using two ports: TCP port 20 handles the actual file transfer process, while TCP port 21 carries control information like login and directory commands.","h":"One port carries the data itself; the other carries the commands managing that transfer."},{"q":"What port does SSH use, and why is SFTP often described as \"built on SSH\"?","a":"TCP port 22; SFTP uses the SSH protocol itself to encrypt file transfers, so they share the same port","w":["TCP port 23; SFTP is a completely separate protocol unrelated to SSH","UDP port 22; SFTP only works over UDP","TCP port 443; SFTP uses the same port as HTTPS"],"e":"SSH (secure shell) and SFTP (secure FTP) both use TCP port 22 because SFTP actually relies on the SSH protocol to provide its encryption, giving you both encrypted remote terminal access and encrypted file transfer.","h":"The 'S' in SFTP comes from the same underlying protocol used for secure shell access."},{"q":"Why is Telnet (TCP port 23) rarely used on modern networks?","a":"It sends all communication, including login credentials, in plain text with no encryption","w":["It requires specialized hardware not found on most networks","It only supports IPv6 and not IPv4","It uses UDP, which most firewalls block by default"],"e":"Telnet looks similar to SSH but sends everything in the clear, meaning anyone capturing packets could see login credentials and all other traffic, which is why SSH has largely replaced it.","h":"Visually it resembles SSH, but it is missing one critical feature: encryption."},{"q":"What port does SMTP use by default, and what is the encrypted alternative port?","a":"TCP port 25 by default (plain text); TCP port 587 for SMTP with TLS encryption","w":["TCP port 587 by default (plain text); TCP port 25 for encrypted SMTP","UDP port 25 by default; TCP port 587 only for receiving mail","TCP port 110 by default; TCP port 25 for encrypted SMTP"],"e":"SMTP traditionally uses TCP port 25 for server-to-server and client-to-server mail transfer, sent in the clear by default, so many servers instead use TCP port 587, which adds TLS encryption.","h":"The encrypted alternative port number is higher than the original unencrypted one."},{"q":"How does DNS typically use UDP port 53 versus TCP port 53?","a":"UDP port 53 for small, quick name queries; TCP port 53 for larger transfers like zone transfers between DNS servers","w":["UDP port 53 for zone transfers; TCP port 53 for small queries","Only UDP port 53 is ever used by DNS, regardless of transfer size","Only TCP port 53 is ever used by DNS, regardless of transfer size"],"e":"DNS commonly uses UDP port 53 for everyday lightweight queries (like resolving a domain name), but switches to TCP port 53 when larger amounts of data need to move between DNS servers, such as zone transfers.","h":"The lightweight, connectionless protocol handles the everyday lookups; the other handles bulk data moves."},{"q":"What ports does DHCP use, and what is its basic function?","a":"UDP ports 67 and 68, used to automatically assign IP address settings to devices joining the network","w":["TCP ports 67 and 68, used to manually configure static IP addresses","UDP port 53, used to resolve domain names to IP addresses","TCP port 443, used to securely encrypt all client traffic"],"e":"DHCP automatically configures IP address settings (like address, subnet mask, and gateway) for devices connecting to the network, using UDP ports 67 and 68, and can also issue the same address every time via a DHCP reservation.","h":"This is the automatic process that lets you join a network without manually typing in an IP address."},{"q":"What makes TFTP (UDP port 69) different from standard FTP?","a":"TFTP is a trivial, lightweight protocol with no authentication, used for quick simple transfers like configuration files","w":["TFTP requires a username and password for every transfer, unlike FTP","TFTP uses two separate ports like FTP, while FTP uses only one","TFTP is only used for encrypted file transfers between servers"],"e":"Unlike FTP's full-featured file management with authentication, TFTP is a simple, fast protocol with no login process, commonly used for small tasks like a VoIP phone downloading its configuration file.","h":"Think about a device with no configuration at all needing to grab one small file quickly after booting."},{"q":"What is the difference between HTTP (port 80) and HTTPS (port 443)?","a":"HTTP sends browser-to-server data in the clear; HTTPS encrypts that data using SSL/TLS","w":["HTTP is encrypted and HTTPS is not","Both are encrypted equally, the only difference is the port number","HTTPS is used only for internal networks, never on the public internet"],"e":"HTTP (TCP port 80) is unencrypted browser communication, while HTTPS (TCP port 443) adds SSL or the newer TLS encryption, which is the default for most websites today.","h":"The 'S' stands for secure, provided by SSL or its newer replacement, TLS."},{"q":"What protocol and port keep device clocks synchronized across a network, and why does this matter?","a":"NTP (Network Time Protocol) using UDP port 123; it's critical for correlating log files across different devices","w":["SNMP using UDP port 161; it's used only for monitoring bandwidth","SIP using TCP port 5060; it's used only for voice call timing","Syslog using UDP port 514; it's used only for storing log files"],"e":"NTP keeps clocks synchronized to about a millisecond across devices using UDP port 123, which is essential for piecing together events from logs on different devices that occurred at nearly the same time.","h":"This is about keeping every device's clock accurate enough to make log correlation possible."},{"q":"What is the difference between SNMP's UDP port 161 and UDP port 162?","a":"Port 161 is used for the management station to query a device; port 162 is used for a device to proactively send an SNMP trap","w":["Port 161 is for traps sent by the device; port 162 is for management station queries","Both ports are used interchangeably for queries and traps with no distinction","Port 161 is TCP only; port 162 is UDP only"],"e":"Normal SNMP communication uses UDP port 161 for the management station's interactive queries, while UDP port 162 is reserved for SNMP traps, which let a device proactively notify the management station of a problem.","h":"One port is for asking; the other is for a device raising its hand on its own."},{"q":"Which SNMP version added authentication, encryption, and message integrity?","a":"SNMP version 3","w":["SNMP version 1","SNMP version 2","All versions of SNMP include this by default"],"e":"SNMPv1 sent single queries/responses in the clear, SNMPv2 added bulk transfers but still no encryption, and SNMPv3 introduced message integrity, authentication, and encryption, making it the more secure modern standard.","h":"This is the newest of the three versions, and the only one built with security in mind."},{"q":"What port does LDAP use by default, and what is its secure version?","a":"TCP port 389 for LDAP; TCP port 636 for LDAP Secure (LDAPS)","w":["TCP port 636 for LDAP; TCP port 389 for LDAP Secure","UDP port 389 for LDAP; UDP port 636 for LDAP Secure","TCP port 389 for both LDAP and LDAPS"],"e":"LDAP (Lightweight Directory Access Protocol) organizes and queries directories of devices and users using TCP port 389, with an encrypted version, LDAP Secure, running on TCP port 636.","h":"The secure version's port number is noticeably higher than the standard one."},{"q":"What protocol does Windows use for file sharing, printer sharing, and authentication, and what port does it typically use?","a":"SMB (Server Message Block), typically using TCP port 445","w":["RDP (Remote Desktop Protocol), typically using TCP port 3389","SIP (Session Initiation Protocol), typically using TCP port 5060","LDAP, typically using TCP port 389"],"e":"SMB, also known as CIFS, is built into Windows and handles file shares, printer sharing, and authentication without needing separate software, using TCP port 445 in modern versions (older versions used NetBIOS).","h":"This protocol is built directly into Windows Explorer/File Explorer, not a separate app you install."},{"q":"What protocol commonly consolidates log files from routers, switches, firewalls, and servers into one location, and what port does it use?","a":"Syslog, using UDP port 514","w":["SNMP, using UDP port 161","NTP, using UDP port 123","SMB, using TCP port 445"],"e":"Syslog is the standardized protocol for sending log data (commonly to a SIEM) to a central location for storage and analysis, using UDP port 514.","h":"This protocol is often paired with a SIEM to consolidate logs in one place."}]},{"id":"other-useful-protocols","section":"Ports and Protocols","title":"Other Useful Protocols","blurb":"ICMP, GRE tunneling, and IPsec (AH, ESP, IKE, transport vs. tunnel mode)","cards":[{"q":"What is ICMP primarily used for, and does it use TCP or UDP?","a":"Checking if a device is alive and reachable (as with ping); it does not use TCP or UDP, it's its own protocol","w":["Encrypting data sent between two VPN endpoints; it uses TCP port 500","Automatically assigning IP addresses to new devices; it uses UDP ports 67/68","Transferring large files between servers; it uses TCP ports 20 and 21"],"e":"ICMP (Internet Control Message Protocol) is carried by IP but is its own protocol, not using TCP or UDP. It's most commonly used by the ping command to check if a device is reachable, and can report conditions like 'network unreachable' or 'time exceeded.'","h":"This is the protocol behind the ping command."},{"q":"What does GRE (Generic Routing Encapsulation) do, and what is a key limitation of GRE on its own?","a":"It encapsulates data inside an IP packet to create a tunnel, but it does not provide encryption on its own","w":["It encrypts all data sent through a VPN tunnel by default","It assigns IP addresses to devices joining a VPN","It replaces the need for a VPN concentrator entirely"],"e":"GRE creates a tunnel by encapsulating data within an IP packet and decapsulating it on the other end, but it provides no encryption itself, so additional VPN protocols like IPsec are needed to actually protect the data.","h":"This protocol builds the tunnel structure, but something else needs to lock the door."},{"q":"What is the difference between IPsec's Authentication Header (AH) and Encapsulation Security Payload (ESP)?","a":"AH validates data integrity but sends it in the clear; ESP encrypts the data and also provides authentication","w":["AH encrypts the data; ESP only validates integrity without encryption","Both AH and ESP provide identical encryption and authentication","AH is used only in transport mode; ESP is used only in tunnel mode"],"e":"AH adds hashing to verify the data's integrity but does not encrypt it, sending the data in the clear. ESP encrypts the original data and trailer and also provides authentication, which is why ESP is used when encryption is required.","h":"Only one of these two protocols actually hides the contents of the data from eavesdroppers."},{"q":"What happens during Internet Key Exchange (IKE) phase 1?","a":"Both sides use a method like Diffie-Hellman to create a shared secret key, commonly over UDP port 500 using ISAKMP","w":["Both sides finish encrypting and sending all application data","The VPN concentrator is physically installed and configured","The Encapsulation Security Payload (ESP) tunnel carries encrypted user data"],"e":"IKE phase 1 establishes a shared secret key between both VPN endpoints, typically using Diffie-Hellman over UDP port 500, a process referred to as ISAKMP (Internet Security Association and Key Management Protocol).","h":"This is the key-agreement phase that happens over UDP port 500 before any encrypted data flows."},{"q":"What is a Security Association (SA) in the context of IPsec?","a":"The agreement both sides make on which encryption and decryption keys will be used for the VPN tunnel's duration","w":["A physical device used to encrypt and decrypt VPN traffic","A government regulation governing international VPN use","A backup connection used only if the primary VPN tunnel fails"],"e":"A Security Association is the negotiated agreement between both ends of an IPsec tunnel about which keys and ciphers will be used for the duration of that VPN connection, established during the IKE process.","h":"This is the result of the key exchange process, not a physical device."},{"q":"What is the key difference between IPsec transport mode and tunnel mode?","a":"Transport mode leaves the original IP header unencrypted; tunnel mode encrypts the entire original packet, including its IP header","w":["Transport mode encrypts everything including the IP header; tunnel mode leaves the IP header in the clear","Both modes encrypt the IP header identically, only the trailer differs","Tunnel mode does not support encryption at all, only authentication"],"e":"In transport mode, only the data is encrypted while the original IP header stays visible, revealing where the traffic is headed. Tunnel mode encrypts the entire original packet and adds a new IP header, hiding the true destination, which is why most implementations use tunnel mode.","h":"One mode reveals the original destination even to someone capturing the encrypted traffic; the other hides it completely."},{"q":"Why can IPsec be used between firewalls from two completely different manufacturers?","a":"Because IPsec is a widely adopted standard protocol that any compliant device can implement, regardless of vendor","w":["Because IPsec only works between identical firewall models from the same vendor","Because IPsec requires a cloud-based broker service to translate between vendors","Because IPsec is proprietary to a single manufacturer and licensed to others"],"e":"IPsec's standardization means devices from different manufacturers, each simply implementing the same published protocol, can establish a secure tunnel with each other without needing matching hardware.","h":"Think about why two firewalls from different companies can still build a working VPN tunnel together."},{"q":"What role does a VPN concentrator play in a site-to-site VPN?","a":"It serves as the central point performing high-speed encryption and decryption for the tunnel, often built into a firewall or router","w":["It assigns dynamic IP addresses to devices on the local network","It caches website content to speed up delivery to remote users","It converts between IPv4 and IPv6 addressing for VPN traffic"],"e":"A VPN concentrator (often integrated into a firewall) is the central device responsible for encrypting and decrypting VPN traffic between two connected sites, commonly using specialized hardware for efficiency.","h":"This is the device handling the heavy lifting of encryption and decryption at each end of the tunnel."},{"q":"During IKE phase 2, what gets negotiated?","a":"The ciphers and key sizes to use, along with the inbound and outbound security associations for the IPsec tunnel","w":["The physical cabling standard used to connect the two VPN endpoints","The initial Diffie-Hellman shared secret used to start the tunnel","The IP addresses assigned to clients joining the corporate network"],"e":"Phase 2 builds on phase 1's shared secret by negotiating which ciphers and key sizes to use, and establishing the inbound and outbound security associations needed for the actual IPsec (ESP) tunnel.","h":"Phase 1 creates the shared secret; this phase decides exactly how the real encrypted tunnel will operate."},{"q":"If someone captures encrypted IPsec traffic using tunnel mode, what can they typically determine?","a":"Very little; the original IP header and data are both encrypted, hiding the true source and destination","w":["The original source and destination IP addresses, since only the data is encrypted","The full plaintext contents of the original packet","Nothing at all, including whether IPsec is even in use"],"e":"Tunnel mode encrypts the entire original packet, including its IP header, and adds a new outer IP header addressed to the IPsec concentrator, so a captured packet reveals almost nothing about the original communication.","h":"Tunnel mode is the more secure of the two modes precisely because it hides this information."}]},{"id":"network-communication","section":"Ports and Protocols","title":"Network Communication","blurb":"Unicast, multicast, anycast, and broadcast communication patterns","cards":[{"q":"What is a unicast communication?","a":"A one-to-one communication between exactly two devices, with no other device involved","w":["A one-to-many communication where multiple devices all receive the same data","A one-to-one-of-many communication where the nearest device responds","A one-to-all communication where every device on the network receives the data"],"e":"Unicast is the most common form of communication, such as browsing a website or checking email: a direct one-to-one exchange between exactly two devices.","h":"This is the everyday case of visiting a website or sending an email to one person."},{"q":"What is a disadvantage of unicast when sending the same information to many recipients?","a":"You must build a separate one-to-one connection and send separate data for each individual recipient","w":["Unicast cannot be used over IPv6 networks at all","Unicast requires specialized multicast-aware equipment","Unicast is limited to a single local broadcast domain"],"e":"Because unicast is strictly one-to-one, reaching many recipients simultaneously means creating and sending data over many separate individual connections, which is inefficient compared to multicast.","h":"Think about what you'd have to do to send the same video stream to a thousand separate people using only one-to-one connections."},{"q":"What is multicast communication, and what is required to use it effectively?","a":"One-to-many communication to a group of subscribed recipients, requiring equipment that understands multicast addressing","w":["One-to-one communication between exactly two devices, requiring no special equipment","One-to-all communication limited strictly to the local broadcast domain","One-to-one-of-many communication where only the closest device replies"],"e":"Multicast sends data simultaneously to multiple subscribed recipients, such as a stock feed or routing updates, but it requires networking equipment that specifically recognizes and supports multicast addressing.","h":"Recipients typically subscribe to this kind of feed, like a streaming or routing-update service."},{"q":"What is anycast communication, and what is a common real-world use case?","a":"One device sends to a single destination address that may be answered by the closest of many similarly configured devices, such as anycast DNS","w":["One device broadcasts identical data to every device on the local network","One device sends data to a specific group of subscribed recipients","Two devices tear down a formal session after each exchange of data"],"e":"In anycast, the destination address may be reached by any of several identically configured devices, with the closest one responding, commonly used for anycast DNS so queries are answered by the nearest data center.","h":"Think about how a DNS query seems to always get answered by whichever data center is geographically closest."},{"q":"What is broadcast communication, and what limits its reach?","a":"A one-to-all communication where every device receives the packet, limited to the local broadcast domain","w":["A one-to-one communication limited to devices on the same VLAN only","A one-to-many communication limited to subscribed multicast recipients","A one-to-one-of-many communication answered by the nearest device"],"e":"Broadcast sends a single packet to every device on the network, but its scope never extends past the local broadcast domain, meaning it can never reach devices across the internet or even many other networks.","h":"A broadcast frame can never leave your own local broadcast domain to reach the rest of the internet."},{"q":"Which communication types are commonly used for ARP requests and routing updates, respectively?","a":"Broadcast is commonly used for ARP requests; multicast or broadcast can be used for routing updates","w":["Unicast is used for both ARP requests and routing updates exclusively","Anycast is used for both ARP requests and routing updates exclusively","Multicast is used exclusively for ARP requests, never for routing updates"],"e":"ARP requests are a classic example of broadcast traffic, since the sender doesn't know which device has the target IP address, while routing updates are often sent via broadcast or multicast depending on the protocol and IP version.","h":"Think about why a device sending an ARP request has to ask everyone on the local network at once."},{"q":"Why does IPv6 eliminate broadcast communication entirely?","a":"IPv6 replaces broadcast with multicast as the preferred method for one-to-many style communication","w":["IPv6 has no concept of one-to-many communication at all","IPv6 replaces broadcast with unicast for all group communication","IPv6 removed multicast and relies solely on broadcast instead"],"e":"IPv6 was designed to remove broadcast traffic entirely and instead relies on multicast for any communication that needs to reach multiple devices, which is more efficient and selective than a true broadcast.","h":"IPv6 didn't remove the ability to reach many devices at once, it just changed which mechanism handles it."},{"q":"How does anycast differ from multicast in terms of how many devices respond to a single request?","a":"With anycast, only the single closest device responds; with multicast, multiple subscribed devices can all receive the same transmission","w":["With anycast, every device on the network responds; with multicast, no devices respond","Anycast and multicast behave identically in every respect","With anycast, no devices respond; with multicast, only the closest device responds"],"e":"Anycast is one-to-one-of-many: the request effectively goes to whicheve
