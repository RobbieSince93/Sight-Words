<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>A+ Study Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#edf0f3; --surface:#fafbfc; --surface2:#e2e7ec; --fg:#121c26; --muted:#566676; --line:#c9d2db;
  --accent:#1952b8; --accent-fg:#ffffff; --accent-soft:#dbe6fa;
  --good:#17824a; --good-soft:#d8f0e2; --bad:#c13a2b; --bad-soft:#f8ddd8; --warn:#b07a08; --warn-soft:#f6e8c4;
  --s0:#d9741a; --s1:#2a9a58; --s2:#2d6bd1; --s3:#8b5a3a;
  --shadow:0 1px 0 rgba(18,28,38,.06),0 10px 26px -14px rgba(18,28,38,.3);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151c; --surface:#16202a; --surface2:#202c38; --fg:#e7edf3; --muted:#93a3b2; --line:#2b3947;
    --accent:#7aa8ff; --accent-fg:#0b1522; --accent-soft:#1c2e4f;
    --good:#4cc27d; --good-soft:#15341f; --bad:#ff8272; --bad-soft:#3d1f1b; --warn:#e6b84d; --warn-soft:#3a2f12;
    --s0:#f09a4a; --s1:#55c283; --s2:#6c9cf0; --s3:#c49168;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16202a; --surface2:#202c38; --fg:#e7edf3; --muted:#93a3b2; --line:#2b3947;
  --accent:#7aa8ff; --accent-fg:#0b1522; --accent-soft:#1c2e4f;
  --good:#4cc27d; --good-soft:#15341f; --bad:#ff8272; --bad-soft:#3d1f1b; --warn:#e6b84d; --warn-soft:#3a2f12;
  --s0:#f09a4a; --s1:#55c283; --s2:#6c9cf0; --s3:#c49168;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:940px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--cond);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11.5px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header + nav */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:grid;grid-template-columns:repeat(4,7px);gap:3px;padding:7px;background:var(--fg);border-radius:6px}
.logo i{height:16px;border-radius:1px;background:var(--s0)} .logo i:nth-child(2){background:var(--s1)} .logo i:nth-child(3){background:var(--s2)} .logo i:nth-child(4){background:var(--s3)}
.brand b{display:block;font:600 21px/1.1 var(--cond)} .brand span{display:block;font-size:12.5px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:16px;padding:4px;background:var(--surface2);border-radius:10px}
.tab{border:0;background:transparent;padding:9px 6px;border-radius:7px;font:500 14px var(--sans);color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab:hover{color:var(--fg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface2)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{padding:13px 20px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.stat b{display:block;font:500 26px/1.1 var(--mono);font-variant-numeric:tabular-nums;margin-top:8px}
.stat small{color:var(--muted);font-size:12px}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-top:14px}
.hero h2{margin-bottom:6px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface2)} .ring .fgc{stroke:var(--good);stroke-linecap:butt}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:500 20px/1 var(--mono)} .ring small{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.goal{margin-top:16px}
.goal .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.week{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:12px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.week i{display:block;width:100%;min-height:3px;background:var(--surface2);border-radius:2px}
.week i.on{background:var(--accent)}
.week small{font-size:10px;color:var(--muted);line-height:1}

.sec{margin-top:30px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sechead::before{content:"";width:34px;height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sc) 0 7px,var(--surface) 7px 9px);border:1px solid var(--sc)}
.sechead small{color:var(--muted);margin-left:auto}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.deck{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--sc);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.deck h3{font-size:18px}
.deck p{font-size:13px;color:var(--muted);min-height:2.7em}
.ports{display:flex;gap:4px;flex-wrap:wrap}
.port{width:13px;height:13px;border-radius:2px;border:1.5px solid var(--line);display:block}
.p-weak{background:var(--bad);border-color:var(--bad)} .p-learn{background:var(--warn);border-color:var(--warn)} .p-mast{background:var(--good);border-color:var(--good)}
.deck .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.deck .btns{display:flex;gap:8px;margin-top:auto}
.deck .btns .btn{flex:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* forms */
.field{display:grid;gap:6px;margin-bottom:16px}
.field label,.field legend{font:500 12px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0}
select,input[type=search],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{font:500 14px var(--sans);letter-spacing:0;text-transform:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer}
.seg input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:16px}
.tips{display:grid;gap:12px;font-size:14px}
.tips li{margin:0;padding-left:0}
.tips ol{margin:0;padding-left:20px;display:grid;gap:10px}

/* session */
.sess{max-width:720px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.deckline{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:13px;color:var(--muted)}
.deckline::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--sc)}
.flip{perspective:1400px;cursor:pointer}
.flip-in{display:grid;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--sc);border-radius:14px;padding:26px 24px;box-shadow:var(--shadow);min-height:280px;display:flex;flex-direction:column;gap:14px}
.face.back{transform:rotateY(180deg)}
.face .qt{font:600 24px/1.3 var(--cond);text-wrap:balance}
.face .ans{font:600 24px/1.3 var(--cond);color:var(--good)}
.face .why{font-size:15px}
.hintbox{margin-top:auto;font-size:14px;color:var(--muted)}
.hintbox .hint{background:var(--warn-soft);color:var(--fg);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 6px 6px 0}
.alts{display:flex;gap:6px;flex-wrap:wrap}
.alts span{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:3px 8px;text-decoration:line-through;text-decoration-color:var(--bad)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate button{display:grid;gap:3px;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:center}
.rate button b{font-weight:600}
.rate button small{font:500 11.5px var(--mono);color:var(--muted)}
.rate .r0{border-bottom:3px solid var(--bad)} .rate .r1{border-bottom:3px solid var(--warn)} .rate .r2{border-bottom:3px solid var(--good)} .rate .r3{border-bottom:3px solid var(--accent)}
.rate button:hover{background:var(--surface2)}
.keys{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center}
kbd{font:500 11.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface)}
.qbox{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--sc);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qbox .qt{font:600 23px/1.3 var(--cond);text-wrap:balance}
.opts{display:grid;gap:9px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--muted);background:var(--surface2)}
.opt .k{flex:none;font:500 12px var(--mono);width:24px;height:24px;border-radius:5px;background:var(--surface2);display:grid;place-content:center;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .k{background:var(--good);color:var(--bg)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .k{background:var(--bad);color:var(--bg)}
.opt[disabled]{cursor:default;color:inherit}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.fb.ok{border-color:var(--good);background:var(--good-soft)} .fb.no{border-color:var(--bad);background:var(--bad-soft)}
.fb b{font-family:var(--cond);font-size:17px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}

/* results */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font:500 56px/1 var(--mono)}
.pass{color:var(--good)} .fail{color:var(--bad)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) 1fr 52px;gap:10px;align-items:center;font-size:13.5px}
.bar .meter{height:10px} .bar .meter i{background:var(--good)} .bar .meter i.low{background:var(--bad)} .bar .meter i.mid{background:var(--warn)}
.bar span:last-child{text-align:right}
.rv{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
.rv summary{list-style:none;cursor:pointer;display:flex;gap:10px;padding:11px 14px;align-items:flex-start}
.rv summary::-webkit-details-marker{display:none}
.tag{flex:none;font:500 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;margin-top:2px}
.tag.ok{background:var(--good-soft);color:var(--good)} .tag.no{background:var(--bad-soft);color:var(--bad)} .tag.sk{background:var(--warn-soft);color:var(--warn)} .tag.nw{background:var(--surface2);color:var(--muted)}
.rv .in{padding:0 14px 14px 14px;display:grid;gap:8px;font-size:14px}
.rv .in .good{color:var(--good);font-weight:500} .rv .in .bad{color:var(--bad)}

/* exam */
.etop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer{margin-left:auto;font:500 20px var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:18px}
.nav button{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font:500 12px var(--mono);cursor:pointer;padding:0}
.nav .done{background:var(--accent-soft);border-color:var(--accent)}
.nav .flag{box-shadow:inset 0 -4px 0 var(--warn)}
.nav .cur{outline:2px solid var(--fg);outline-offset:1px}
.confirm{margin-top:16px;padding:14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;display:grid;gap:10px}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}

/* browse */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.list{margin-top:14px}
.list .rv summary b{font-weight:500}
.list .rv summary small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.foot{margin-top:34px;display:grid;gap:12px}
.foot details{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.foot summary{cursor:pointer;font-weight:500}
.foot textarea{min-height:90px;font:12px var(--mono);margin-top:10px}
.foot .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.danger{color:var(--bad)}

@media (max-width:680px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr}
  .bar{grid-template-columns:1fr 52px} .bar .meter{grid-column:1/-1;order:3}
  .face,.qbox{padding:20px 16px} .face .qt,.qbox .qt{font-size:21px}
  .rate{grid-template-columns:repeat(2,1fr)}
  .score b{font-size:44px}
  .ring{justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  .flip-in,.meter i,.prog i{transition:none}
}
</style>

<script type="application/json" id="deck-data">[{"id":"laptop-hardware","section":"Mobile and Laptops","title":"Laptop Hardware","blurb":"Batteries, ribbon cables, SO-DIMM, SSDs, antennas, biometrics, NFC","cards":[{"q":"What are the two common battery chemistries used in modern laptops?","a":"Lithium ion and lithium ion polymer","w":["Nickel cadmium and lithium ion","Alkaline and lithium ion polymer","Lead acid and nickel metal hydride"],"e":"Both lithium ion and lithium ion polymer batteries avoid the memory effect seen in older battery technologies, so you can recharge anytime without hurting capacity.","h":"Neither one suffers from the old 'memory effect' problem."},{"q":"A laptop keyboard is most commonly connected to the system board using what?","a":"A ribbon cable","w":["A SATA cable","An M.2 interface","A mini PCIe slot"],"e":"Laptop keyboards typically pop out as a single unit connected to the system board via a ribbon cable with an easy-disconnect connector.","h":"Think of a thin, flat cable rather than a round or pin-based one."},{"q":"What is the small form-factor memory module used in laptops called?","a":"SO-DIMM","w":["DDR-SIMM","M.2 RAM","Micro-DIMM Pro"],"e":"SO-DIMM stands for Small Outline Dual In-line Memory Module, the compact version of desktop DIMMs used in laptops.","h":"It's an acronym starting with 'Small Outline.'"},{"q":"Why is an M.2 SSD generally easier to install than a 2.5 inch drive?","a":"It uses a single screw and one connector instead of separate data and power connections","w":["It doesn't require a driver to be installed","It connects wirelessly to the motherboard","It is hot-swappable while the laptop is running"],"e":"The 2.5 inch form factor needs two separate connections (data and power), while M.2 drives plug directly into a slot and are secured with just one screw.","h":"Think about how many cables/screws each one needs."},{"q":"What is the main advantage of an SSD over a traditional spinning hard drive?","a":"It has no moving parts, giving faster access and more reliability","w":["It uses less physical space but is slower","It requires two power connectors instead of one","It only works with the M.2 interface"],"e":"SSDs are just memory with no moving parts, which makes them faster and more reliable than spinning platter drives that can mechanically fail.","h":"Think about what could physically break in a spinning drive that doesn't exist in an SSD."},{"q":"What software category is used to duplicate an entire old drive onto a new SSD?","a":"Imaging or cloning software","w":["Partition formatting software","Firmware flashing software","Defragmentation software"],"e":"Imaging or cloning software creates an exact duplicate of data from one drive to another, which is much faster than manually reinstalling everything.","h":"The term describes creating an exact copy or 'image' of a drive."},{"q":"In a laptop's wireless card setup, what are the antenna wires typically routed through?","a":"Around the outside of the display","w":["Through the battery compartment","Along the bottom edge of the keyboard tray","Through the cooling fan housing"],"e":"Antenna wires commonly wrap around the outside of the display to get as high as possible when the screen is open, then run down to the system board.","h":"Think about what gets the signal as high up as possible when you open the laptop."},{"q":"Which two Windows Hello biometric authentication methods are mentioned?","a":"Face recognition and fingerprint reader","w":["Voice recognition and iris scan","PIN and fingerprint reader","Face recognition and NFC badge"],"e":"Windows Hello Face uses facial recognition and Windows Hello Fingerprint uses a fingerprint reader, both requiring the matching hardware to be present.","h":"One uses a camera, the other uses a physical sensor on your finger."},{"q":"NFC (Near Field Communication) is characterized by what kind of range?","a":"Very short range, typically 4 centimeters or less","w":["Up to 10 meters, similar to Bluetooth","Up to 100 meters, similar to Wi-Fi","Unlimited range over the internet"],"e":"NFC requires devices to be very close together, usually within about 4 centimeters, which is why it's used for things like point-of-sale payments and badge taps.","h":"Think about how close your phone has to be to a payment terminal to tap and pay."},{"q":"Where is a laptop's built-in microphone typically located relative to the camera?","a":"To the left and right of the camera","w":["Directly behind the camera","Inside the keyboard deck","Built into the trackpad"],"e":"Most laptops place microphones on either side of the centrally located camera, so both video and audio are captured together.","h":"The camera sits in the middle at the top of the screen; the mics flank it."}]},{"id":"mobile-connectivity","section":"Mobile and Laptops","title":"Mobile Connectivity","blurb":"USB-C, Lightning, NFC, Bluetooth PAN, hotspot vs tethering","cards":[{"q":"How many pins does a USB-C connector have?","a":"24 pins","w":["8 pins","12 pins","30 pins"],"e":"USB-C uses a 24-pin design that's reversible, so it can be plugged in either orientation.","h":"Count relates to the newer, reversible connector."},{"q":"Besides standard data, what other types of signals can be transmitted over a USB-C connector?","a":"DisplayPort, HDMI, and Thunderbolt","w":["VGA, DVI, and Ethernet","Only USB 2.0 signals","SATA and PCIe signals"],"e":"A single USB-C connector can carry DisplayPort, HDMI, and Thunderbolt signals in addition to standard USB data, all through the same physical interface.","h":"Video standards, not just data transfer."},{"q":"How many pins does Apple's Lightning connector have?","a":"8 pins","w":["24 pins","4 pins","16 pins"],"e":"Apple's Lightning connector has 8 pins and was commonly used on older iPhone and iPad devices.","h":"It's a smaller number than USB-C's pin count."},{"q":"What two problems did the Lightning connector solve compared to older USB standards?","a":"Higher power output for faster charging, and it can be inserted either way","w":["Lower cost and longer cable length","Wireless charging support and waterproofing","Compatibility with all Android devices"],"e":"Lightning was designed to support higher power output for faster charging and could be inserted in either orientation, unlike older USB connectors.","h":"Two improvements: charging speed and how you plug it in."},{"q":"What are common uses for NFC on mobile devices?","a":"Point-of-sale payments, access control, and transferring data between phones","w":["Streaming video to a TV","Connecting to a home Wi-Fi router","Long-range GPS tracking"],"e":"NFC is commonly used for point-of-sale payments, access control (like unlocking doors), and transferring information between phones over a very short range.","h":"Think about tapping your phone to pay or to open a door."},{"q":"What is the term used for the type of network created by Bluetooth connections like wireless headsets and keyboards?","a":"PAN (Personal Area Network)","w":["LAN (Local Area Network)","WAN (Wide Area Network)","MAN (Metropolitan Area Network)"],"e":"Bluetooth connections for things like wireless headsets, keyboards, and mice are commonly referred to as a Personal Area Network, or PAN.","h":"It's a short-range network type named after the individual person using it."},{"q":"What is the key difference between using your phone as a hotspot versus tethering?","a":"Hotspot supports multiple connecting devices; tethering is limited to one device","w":["Hotspot uses Bluetooth; tethering uses USB only","Hotspot requires Wi-Fi; tethering requires NFC","There is no difference; the terms are interchangeable"],"e":"A hotspot is when multiple people connect to your mobile phone for internet access, while tethering refers to just one device connecting.","h":"Think about the number of devices connecting, not the technology itself."},{"q":"What older USB connector types were commonly used on mobile devices before USB-C became widespread?","a":"Mini and micro USB","w":["USB-A and USB-C","Lightning and USB-C","FireWire and USB-A"],"e":"Older mobile devices commonly used mini and micro USB plugs before manufacturers moved toward USB-C.","h":"These are the smaller, older USB connector styles."},{"q":"What is a key physical design advantage of the USB-C connector?","a":"It can be plugged in either orientation","w":["It only works with Apple devices","It requires a special adapter for charging","It cannot transmit video signals"],"e":"USB-C's reversible design means it can be plugged in either orientation without needing to flip it to find the right way.","h":"One of the key convenience features mentioned about USB-C's physical design."},{"q":"How might an organization use NFC on employees' phones or smartwatches?","a":"As an access control method instead of carrying a separate ID card","w":["As a way to extend Wi-Fi range across a building","As a backup power source for the phone","As a replacement for Bluetooth headsets"],"e":"Organizations can use NFC on a phone or smartwatch as an access control method instead of a separate ID card, using a sensor mounted on the wall.","h":"This replaces something you'd normally carry, like a badge."}]},{"id":"mobile-accessories","section":"Mobile and Laptops","title":"Mobile Accessories","blurb":"Stylus, TRRS, docks, port replicators, trackpads","cards":[{"q":"How does a digital stylus typically connect to a mobile device?","a":"Bluetooth","w":["USB-C","NFC","Lightning"],"e":"A digital stylus typically connects to a mobile device over Bluetooth, offering wireless pressure-sensitive input.","h":"Same wireless tech used for wireless headsets and speakers."},{"q":"What does TRRS stand for in the context of the analog audio jack?","a":"Tip-ring-ring-sleeve","w":["Tip-ring-return-signal","Terminal-ring-relay-sleeve","Tip-resistor-ring-sleeve"],"e":"TRRS stands for tip-ring-ring-sleeve, describing the four contact points on that analog audio connector.","h":"Four parts of the connector, starting with the pointy end."},{"q":"What is the common size of the TRRS analog audio jack connector?","a":"3.5 millimeters","w":["2.5 millimeters","6.5 millimeters","1 millimeter"],"e":"The TRRS analog audio connector is commonly a 3.5 millimeter connector.","h":"A very common headphone jack size."},{"q":"What connector might an older Apple iPhone use for a wired headset instead of USB or TRRS?","a":"Lightning","w":["USB-C","Mini USB","HDMI"],"e":"Older Apple iPhones without USB used a Lightning connector for wired headsets instead of the standard TRRS or USB.","h":"Apple's proprietary connector mentioned in the previous video too."},{"q":"What is the main advantage of using a docking station with a laptop?","a":"It lets you connect or disconnect a laptop from all peripherals at once, and can support adapter cards","w":["It charges the laptop battery faster than a normal charger","It only works with Bluetooth-enabled laptops","It replaces the need for a keyboard entirely"],"e":"A docking station lets you connect and disconnect a laptop from all its peripherals at once without touching individual cables, and can also support full-size adapter cards.","h":"Think about the convenience of not unplugging multiple wires individually."},{"q":"How does a port replicator differ from a docking station?","a":"It connects via USB and works across almost any laptop or desktop, rather than being model-specific","w":["It requires a dedicated power outlet not needed by docking stations","It only supports audio connections, not video","It can only be used with Apple devices"],"e":"Unlike a docking station made for a specific laptop, a port replicator typically connects over USB, making it usable across almost any laptop or desktop.","h":"One is model-specific, the other is more universal."},{"q":"How can you typically disable a laptop's built-in trackpad?","a":"A function key (like F10)","w":["A BIOS setting only","Removing the battery","A dedicated physical switch on the side"],"e":"Many laptops use a function key, like F10 in the example given, to enable or disable the trackpad.","h":"It's one of the special function keys along the top row."},{"q":"What is a drawing pad in the context of desktop/laptop accessories?","a":"An external digitizer with its own stylus for precise input","w":["A type of docking station for tablets","A built-in trackpad feature","A wireless charging mat"],"e":"A drawing pad is an external digitizer with its own stylus, giving precise artistic input similar to a tablet stylus but on a desktop or laptop.","h":"Think of the device artists use for precise digital drawing."},{"q":"How do external third-party cameras typically connect to a laptop or desktop that lacks a built-in webcam?","a":"USB","w":["TRRS","Lightning only","NFC"],"e":"External cameras or webcams that are added to a device typically connect over USB.","h":"The same connection type commonly used for other peripherals like keyboards and mice."},{"q":"What wireless technology do wireless speakers typically use to connect to a mobile device?","a":"Bluetooth","w":["TRRS","USB-C only","NFC"],"e":"Wireless speakers connect to a mobile device over Bluetooth, allowing better sound quality and portability compared to a phone's built-in speakers.","h":"Same short-range wireless standard used for headsets and styluses."}]},{"id":"mobile-networks","section":"Mobile and Laptops","title":"Mobile Networks","blurb":"3G to 5G, SIM and eSIM, pairing, GPS","cards":[{"q":"In what year did 3G cellular technology start taking off?","a":"1998","w":["2005","1990","2010"],"e":"3G technology started taking off in 1998 and allowed larger amounts of data to be sent and received, enabling things like GPS and video conferencing.","h":"Late 1990s."},{"q":"What underlying technology is 4G/LTE based on?","a":"GSM (Global System for Mobile communications)","w":["CDMA (Code Division Multiple Access)","TDMA (Time Division Multiple Access)","WCDMA (Wideband CDMA)"],"e":"4G is based on GSM, the Global System for Mobile communications, and supported bandwidths up to 150 megabits per second.","h":"An acronym involving 'Global System.'"},{"q":"What throughput did LTE Advanced (LTE-A) support?","a":"300 megabits per second","w":["150 megabits per second","10 gigabits per second","50 megabits per second"],"e":"LTE Advanced allowed throughputs of up to 300 megabits per second, an increase over standard LTE's 150 Mbps.","h":"Double the speed of standard LTE."},{"q":"In what year was 5G introduced?","a":"2020","w":["2015","2018","2022"],"e":"5G was introduced in 2020 and can support up to 10 gigabits per second over higher frequencies.","h":"Introduced right around the start of this decade."},{"q":"What information does a physical SIM card typically contain?","a":"SIM ID, phone number, carrier info, and storage for contacts/messages","w":["Only the phone's GPS location history","The phone's Wi-Fi password","Bluetooth pairing keys only"],"e":"A physical SIM card contains information identifying the phone on the mobile network, including a SIM ID, phone number, and storage for contacts and messages that can be moved between phones.","h":"Think of the small removable card that identifies your account."},{"q":"How does an eSIM differ from a traditional physical SIM card?","a":"It's embedded and can't be physically removed, but can be transferred via software or QR code","w":["It can only be used with 3G networks","It requires a special tool to unplug and move like a physical SIM","It has no phone number associated with it"],"e":"Unlike a physical SIM, an eSIM is embedded in the phone and can't be physically removed, but it can be transferred to another device using software, a transfer option, or a QR code.","h":"Think about what you can't do with an eSIM that you can do with a regular SIM card."},{"q":"When using your phone as a hotspot, how does the connection typically work?","a":"The phone connects to cellular (like 5G), and other devices connect to the phone over 802.11","w":["The phone connects to Wi-Fi, and other devices connect over Bluetooth only","All devices connect directly to the cellular tower","It requires a physical USB cable between all devices"],"e":"Hotspot functionality works by having your phone connect to the cellular network (e.g. 5G) while other devices connect to your phone over 802.11 Wi-Fi.","h":"One connection type going to the cell tower, a different one to the other devices."},{"q":"What is commonly used to verify a Bluetooth device during the initial pairing process?","a":"A personal identification number (PIN)","w":["A fingerprint scan","A QR code only","An eSIM profile"],"e":"Bluetooth pairing commonly uses a personal identification number (PIN) to verify connectivity, and once paired, devices can reconnect automatically without repeating the process.","h":"A short numeric code used to verify the connection."},{"q":"How many GPS satellites does your phone typically need to see for accurate location readings?","a":"Four satellites","w":["One satellite","Ten satellites","Two satellites"],"e":"GPS determines your location by using differences in signals received from multiple satellites, requiring visibility of at least four satellites for accurate readings.","h":"A specific number of satellites needed for accuracy."},{"q":"Besides GPS satellites, what other technologies can help determine a phone's location?","a":"Wi-Fi networks and cellular tower triangulation","w":["Bluetooth pairing history","SIM card serial number","NFC tags only"],"e":"When GPS isn't available, some apps use nearby Wi-Fi networks or cellular tower triangulation to estimate location instead.","h":"Two alternative methods mentioned besides satellites."}]},{"id":"mobile-device-management","section":"Mobile and Laptops","title":"Mobile Device Management","blurb":"MDM, BYOD, COPE, CYOD, policies","cards":[{"q":"What does MDM stand for?","a":"Mobile Device Manager","w":["Managed Data Module","Multi-Device Monitor","Mobile Data Migration"],"e":"MDM (Mobile Device Manager) allows a system administrator to centrally manage all mobile devices in an organization, whether company-owned or personally owned.","h":"The acronym for the centralized management software itself."},{"q":"What does BYOD stand for?","a":"Bring Your Own Device","w":["Buy Your Own Device","Backup Your Own Data","Business Yields Own Devices"],"e":"BYOD stands for Bring Your Own Device, where the employee owns the phone and uses it for both personal and work purposes.","h":"The employee already owns the hardware."},{"q":"What does COPE stand for?","a":"Corporate Owned, Personally Enabled","w":["Company Operated Phone Environment","Centralized Ownership, Personal Encryption","Corporate Owned, Privately Encrypted"],"e":"COPE stands for Corporate Owned, Personally Enabled, where the company purchases and manages the phone but may still allow personal use.","h":"The company buys it, but the user can still use it personally."},{"q":"What does CYOD stand for?","a":"Choose Your Own Device","w":["Configure Your Own Data","Custom Your Own Device","Centralize Your Own Devices"],"e":"CYOD stands for Choose Your Own Device, where the organization lets the employee pick from a selection of company-approved devices.","h":"It's about selecting from a company-approved list."},{"q":"What is a key challenge that BYOD presents to organizations?","a":"Protecting company data while keeping the user's personal data private, often via partitioning","w":["Ensuring the device only supports one carrier","Preventing the device from connecting to Wi-Fi","Making sure the device can only make voice calls"],"e":"With BYOD, the organization needs to protect company data on a personal device while keeping the user's personal information private, often through partitioning.","h":"Think about the tension between company data and personal privacy on the same device."},{"q":"What unique identifier is listed for a device in the MDM console?","a":"IMEI (a unique device identifier)","w":["SIM ID","MAC address only","Serial number of the SIM card"],"e":"The IMEI is a unique identifier for a mobile device that is listed in the MDM console alongside device name, platform, and user information.","h":"A unique hardware identifier for the device itself."},{"q":"In the MDM console example, which section allows an administrator to enable or disable device features like the camera and Siri?","a":"The Restrictions tab","w":["The Synchronization tab only","The Billing tab","The Network Summary tab"],"e":"From the Restrictions tab in an MDM, an administrator can enable or disable features like the camera, FaceTime, voice dialing, and Siri.","h":"This section controls device features, not synchronization."},{"q":"What synchronization options can an MDM administrator configure regarding network usage?","a":"Wi-Fi only, or Wi-Fi plus cellular","w":["Bluetooth only","NFC only","USB tethering only"],"e":"Administrators can configure whether data synchronizes over Wi-Fi only or also over the cellular network, which matters for controlling data costs and usage.","h":"Two network types mentioned for syncing data."},{"q":"What granular synchronization settings can be configured for business applications like email accounts?","a":"Specific data types like calendar, contacts, and mail, which can differ by service","w":["Only whether the phone is turned on or off","Only the phone's screen brightness","Only the device's physical location"],"e":"MDM allows administrators to specify granular sync settings for data types like calendar, contacts, and mail, and these settings can differ between services such as Microsoft Exchange and Google Mail.","h":"Think about specific categories of data, not just on/off syncing."},{"q":"What security policies can an MDM enforce on managed devices?","a":"Screen locks with a PIN and two-factor authentication","w":["Disabling all internet access","Requiring devices to be jailbroken","Removing the SIM card"],"e":"MDM lets administrators require security measures such as screen locks with a PIN or other access method, and can also mandate two-factor authentication.","h":"Two security-related policies mentioned in the material."}]},{"id":"introduction-to-ip","section":"Networking Basics","title":"Introduction to IP","blurb":"Encapsulation, TCP vs UDP, port ranges","cards":[{"q":"What is the term for nesting protocol data inside other protocol data, such as HTTP inside TCP inside IP inside Ethernet?","a":"Encapsulation","w":["Multiplexing","Flow control","Tunneling"],"e":"Encapsulation is the process of nesting protocol information inside other protocol information, like an ethernet payload containing an IP payload containing a TCP payload containing HTTP data.","h":"Think about boxes nested inside other boxes."},{"q":"Which protocol is described as 'connection-oriented' with a formal setup and teardown process?","a":"TCP","w":["UDP","IP","DHCP"],"e":"TCP is connection-oriented, meaning it has a formal setup process and a formal teardown process for the conversation, similar to making a phone call.","h":"Think of the phone call analogy used in the transcript."},{"q":"What mechanism allows TCP to provide 'reliable delivery'?","a":"Acknowledgments from the receiving device","w":["A fixed port number range","Encryption of all packets","Random source ports"],"e":"TCP provides reliable delivery through an acknowledgment process, where the receiver confirms data was received and can request retransmission if something was lost or corrupted.","h":"This is the mechanism that confirms data arrived successfully."},{"q":"Why is UDP referred to as providing 'unreliable delivery'?","a":"It's connectionless with no acknowledgments, so delivery isn't guaranteed","w":["It requires a formal handshake before sending any data","It always retransmits lost data automatically","It uses flow control to slow down the sender"],"e":"UDP is connectionless with no formal setup or teardown, and it's called unreliable delivery because there are no acknowledgments confirming data was received.","h":"The opposite of TCP's formal handshake and acknowledgment process."},{"q":"Why do real-time applications like voice over IP typically prefer UDP over TCP?","a":"Because retransmitting lost real-time data serves no purpose, and UDP has low overhead","w":["Because UDP guarantees no data will ever be lost","Because voice over IP requires a formal connection setup","Because UDP is faster only over wireless networks"],"e":"Real-time applications like voice over IP prefer UDP because it has minimal overhead and there's no benefit to retransmitting lost data since the moment has already passed.","h":"Think about why replaying a lost word in a live phone call doesn't make sense."},{"q":"Which two protocols are given as examples that commonly use UDP?","a":"DHCP and TFTP","w":["HTTPS and SSH","FTP and SMTP","DNS and HTTP"],"e":"DHCP (Dynamic Host Configuration Protocol) and TFTP (Trivial File Transfer Protocol) are both given as examples of protocols that use UDP due to their low overhead needs.","h":"One assigns IP addresses automatically, the other transfers small files."},{"q":"What is the typical range for nonephemeral (well-known/permanent) port numbers?","a":"0 to 1,023","w":["1,024 to 65,535","0 to 65,535","1 to 100"],"e":"Nonephemeral (well-known) ports typically range from 0 to 1,023 and are consistently used by specific server applications.","h":"This is the lower range used by servers."},{"q":"What is the typical range for ephemeral (client) port numbers?","a":"1,024 to 65,535","w":["0 to 1,023","0 to 100","1 to 1,024"],"e":"Ephemeral ports, used temporarily by the client, typically range from 1,024 to 65,535 and are chosen randomly for each new communication.","h":"This is the higher range used temporarily by the client."},{"q":"Why is TCP port 80 not the same as UDP port 80, even though they share the same number?","a":"They are different and unrelated, since TCP and UDP have separate port numbering schemes","w":["They always refer to the exact same connection","TCP port 80 is always reserved for UDP as well","Port numbers are shared globally across all protocols"],"e":"TCP port 80 and UDP port 80 are distinct and unrelated port spaces, even though they share the same number, since TCP and UDP each have their own independent port numbering scheme from 0 to 65,535.","h":"Think about whether the two protocols share the same numbering pool."},{"q":"In a protocol decode of client-server traffic, what's typically true about the destination port versus the source port?","a":"The destination port is the well-known port; the source port is a random ephemeral port","w":["Both the source and destination ports are always well-known ports","Both the source and destination ports are randomly chosen ephemeral ports","The source port is fixed and the destination port changes randomly"],"e":"In client-server communication, the destination port on incoming traffic to the server is typically the well-known port, while the source port on that same traffic is a random ephemeral port chosen by the client.","h":"One side is fixed and well-known, the other side is randomly chosen for that one conversation."}]},{"id":"common-ports","section":"Networking Basics","title":"Common Ports","blurb":"FTP, SSH, SMTP, DNS, DHCP, HTTP/S, RDP and friends","cards":[{"q":"What port numbers does FTP commonly use for data transfer and control?","a":"TCP 20 and TCP 21","w":["TCP 22 and TCP 23","UDP 20 and UDP 21","TCP 21 and TCP 25"],"e":"FTP uses TCP port 20 for active data transfer and TCP port 21 for administration or control.","h":"Two consecutive port numbers just under port 22."},{"q":"What port does SSH use for encrypted remote command-line access?","a":"TCP 22","w":["TCP 23","TCP 21","UDP 22"],"e":"SSH provides encrypted remote command-line access over TCP port 22, and is recommended over Telnet because Telnet sends everything in the clear.","h":"One port number higher than FTP's control port."},{"q":"What port does Telnet use, and why is it generally avoided compared to SSH?","a":"TCP 23","w":["TCP 22","TCP 25","UDP 23"],"e":"Telnet uses TCP port 23 and, unlike SSH, sends all communication unencrypted, which is why most organizations avoid it.","h":"One port number higher than SSH."},{"q":"What port does SMTP use for sending email between servers?","a":"TCP 25","w":["TCP 110","TCP 143","UDP 25"],"e":"SMTP, used to send email between servers, commonly uses TCP port 25.","h":"A port number in the mid-20s, used for sending mail."},{"q":"What port and protocol does DNS commonly use to resolve domain names to IP addresses?","a":"UDP 53","w":["TCP 53","UDP 67","TCP 80"],"e":"DNS, which translates domain names into IP addresses, commonly uses UDP port 53.","h":"UDP-based, since it's typically a quick lookup rather than a sustained connection."},{"q":"What ports does DHCP use to automatically assign IP address configurations?","a":"UDP 67 and UDP 68","w":["TCP 67 and TCP 68","UDP 53 and UDP 54","TCP 80 and TCP 443"],"e":"DHCP, which automatically assigns IP addresses and configuration to devices, uses UDP ports 67 and 68.","h":"Two consecutive UDP ports just after DNS's port."},{"q":"What ports do HTTP and HTTPS use respectively?","a":"HTTP uses TCP 80; HTTPS uses TCP 443","w":["HTTP uses TCP 443; HTTPS uses TCP 80","HTTP uses UDP 80; HTTPS uses UDP 443","Both use TCP 8080"],"e":"Standard unencrypted HTTP uses TCP port 80, while encrypted HTTPS uses TCP port 443.","h":"One is a two-digit port, the other is a three-digit port."},{"q":"What ports do POP3 and IMAP use for receiving email?","a":"POP3 uses TCP 110; IMAP uses TCP 143","w":["POP3 uses TCP 143; IMAP uses TCP 110","POP3 uses UDP 110; IMAP uses UDP 143","Both use TCP 25"],"e":"POP3 uses TCP port 110, while IMAP4 uses TCP port 143 and offers more features like multi-client inbox synchronization.","h":"POP3's port number is lower than IMAP's."},{"q":"What port does LDAP commonly use to access directory services like Active Directory?","a":"TCP 389","w":["TCP 443","UDP 389","TCP 445"],"e":"LDAP, used to query directory services like Microsoft Active Directory, commonly uses TCP port 389.","h":"A three-digit port number used for directory lookups."},{"q":"What port does RDP (Remote Desktop Protocol) use to access and control Windows devices remotely?","a":"TCP 3389","w":["TCP 443","UDP 3389","TCP 445"],"e":"RDP, used for remote desktop access to Windows devices, uses TCP port 3389.","h":"A four-digit port number for remote desktop access."}]},{"id":"wireless-technologies","section":"Networking Basics","title":"Wireless Technologies","blurb":"802.11 generations, channels, Bluetooth, RFID, NFC","cards":[{"q":"What simplified name is given to the 802.11ax wireless standard?","a":"Wi-Fi 6","w":["Wi-Fi 5","Wi-Fi 7","Wi-Fi 4"],"e":"The 802.11ax standard is also referred to as Wi-Fi 6 (and Wi-Fi 6E for extended), a simpler naming convention introduced by the 802.11 Committee.","h":"One number higher than Wi-Fi 5."},{"q":"Which Wi-Fi generation names correspond to 802.11ac and 802.11be?","a":"802.11ac = Wi-Fi 5; 802.11be = Wi-Fi 7","w":["802.11ac = Wi-Fi 7; 802.11be = Wi-Fi 5","802.11ac = Wi-Fi 6; 802.11be = Wi-Fi 5","802.11ac = Wi-Fi 4; 802.11be = Wi-Fi 6"],"e":"The 802.11ac standard is referred to as Wi-Fi 5, while 802.11be is called Wi-Fi 7.","h":"One is older (5), one is the newest mentioned (7)."},{"q":"What are the three main frequency ranges used by Wi-Fi networks?","a":"2.4 GHz, 5 GHz, and 6 GHz","w":["1 GHz, 2 GHz, and 3 GHz","900 MHz, 2.4 GHz, and 5 GHz only","5 GHz and 10 GHz only"],"e":"Most Wi-Fi networks operate in the 2.4 gigahertz, 5 gigahertz, and 6 gigahertz frequency ranges.","h":"Three ranges, each higher than the last."},{"q":"Why does the 802.11 Committee group frequencies into channels?","a":"To make it easier to reference frequencies without memorizing exact values","w":["To physically separate different Wi-Fi manufacturers","To eliminate the need for any frequency licensing","To allow devices to skip the 2.4 GHz band entirely"],"e":"Channels group specific frequencies together so users can refer to a channel number instead of memorizing exact frequency values like 2.437 GHz.","h":"Think about why 'channel 6' is easier to say than a precise frequency number."},{"q":"How many non-overlapping 20 megahertz channels are available in the 2.4 gigahertz spectrum?","a":"Three","w":["Ten","Twenty","One"],"e":"The 2.4 gigahertz spectrum has only three non-overlapping 20 megahertz channels available, which limits capacity in crowded environments.","h":"A small number, since 2.4 GHz spectrum is limited."},{"q":"How do the 5 GHz and 6 GHz Wi-Fi bands compare to 2.4 GHz in terms of available spectrum?","a":"5 GHz and 6 GHz offer far more frequencies and wider bandwidth options than 2.4 GHz","w":["2.4 GHz offers more frequencies than 5 GHz or 6 GHz","All three bands offer identical bandwidth options","6 GHz cannot support bandwidths above 20 MHz"],"e":"The 5 gigahertz and 6 gigahertz ranges offer significantly more available frequencies and support wider bandwidths like 40, 80, and 160 megahertz, unlike the more limited 2.4 gigahertz range.","h":"Think about which bands offer more room to spread out."},{"q":"What frequency range does Bluetooth use?","a":"2.4 gigahertz (unlicensed ISM band)","w":["5 gigahertz","6 gigahertz","900 megahertz"],"e":"Bluetooth operates in the 2.4 gigahertz range, which is part of the unlicensed ISM (industrial, scientific, and medical) band.","h":"The same frequency range as one of the Wi-Fi bands."},{"q":"What is the typical maximum range for consumer Bluetooth devices?","a":"About 10 meters","w":["About 100 meters","About 1 kilometer","Unlimited range indoors"],"e":"Consumer Bluetooth devices typically have a maximum range of about 10 meters, which is much shorter than typical 802.11 Wi-Fi coverage.","h":"A short range, measured in single-digit meters times ten."},{"q":"How does a passive (battery-less) RFID tag get the power it needs to respond to a scanner?","a":"It draws power from the radio frequency signal sent by the scanner","w":["It has its own internal battery that never needs charging","It connects to Wi-Fi to receive power remotely","It uses solar power built into the tag"],"e":"A passive RFID tag has no battery and is powered by the radio frequency energy transmitted by a nearby scanner, which then reads the tag's ID code.","h":"Think about how a tag with no power source can still respond to a scanner."},{"q":"How does NFC differ from and build on RFID technology?","a":"NFC supports two-way communication, while RFID is generally one-way","w":["RFID requires a battery, while NFC never does","NFC has a much longer range than RFID","RFID is used only for payments, while NFC is used only for pet tracking"],"e":"NFC builds on RFID technology but extends it to support two-way communication, unlike RFID which is generally one-way.","h":"Think about the direction of communication each technology supports."}]},{"id":"network-services","section":"Networking Basics","title":"Network Services","blurb":"DNS, DHCP, file and print, syslog, AAA, proxies, IoT","cards":[{"q":"What is the primary function of a DNS server?","a":"Resolving domain names to IP addresses (and the reverse)","w":["Assigning IP addresses to new devices","Storing print job queues","Synchronizing time across the network"],"e":"DNS resolves fully qualified domain names to IP addresses, and it can also perform the reverse lookup, converting an IP address back to a domain name.","h":"Think about what happens behind the scenes when you type a website name into your browser."},{"q":"Why do enterprises typically run multiple DHCP servers?","a":"Redundancy, in case one DHCP server becomes unavailable","w":["To allow different departments to use different IP address formats","Because DHCP servers can only assign 100 addresses each","To separate voice and video traffic"],"e":"Enterprises commonly run multiple DHCP servers for redundancy, so IP address assignment continues even if one server becomes unavailable.","h":"Think about what happens if a single DHCP server fails."},{"q":"What file-sharing protocols are commonly used by Windows and Mac OS respectively?","a":"SMB (Windows) and AFP (Mac OS)","w":["FTP (Windows) and HTTP (Mac OS)","NTP (Windows) and DNS (Mac OS)","SCADA (Windows) and IoT (Mac OS)"],"e":"Windows file sharing commonly uses SMB (Server Message Block), while Mac OS traditionally uses Apple Filing Protocol (AFP).","h":"Think back to the earlier ports video where SMB was discussed for Windows."},{"q":"What protocols are commonly supported by network print services?","a":"SMB, IPP, and LPD","w":["DNS, DHCP, and NTP","HTTP, HTTPS, and FTP","SQL, LDAP, and RDP"],"e":"Print servers commonly support protocols like SMB, IPP (Internet Printing Protocol), and LPD (Line Printer Daemon) for managing print jobs across the network.","h":"Three protocol acronyms mentioned specifically for printing."},{"q":"What protocol is used to consolidate log files from many network devices into a central database?","a":"Syslog","w":["SQL","SCADA","AAA"],"e":"Syslog is the protocol used to consolidate log files from many devices into a central database, often managed by a SIEM (Security Information and Event Manager).","h":"This protocol centralizes logs from switches, routers, servers, and firewalls."},{"q":"What does SIEM stand for?","a":"Security Information and Event Manager","w":["System Integration and Encryption Module","Server Identity and Endpoint Monitor","Secure Internet Email Manager"],"e":"SIEM stands for Security Information and Event Manager, the central server that consolidates and correlates log data from diverse systems.","h":"The central consolidation point for syslog data."},{"q":"What does AAA stand for in the context of an authentication server?","a":"Authentication, Authorization, and Accounting","w":["Access, Availability, and Auditing","Authorization, Analysis, and Archiving","Automation, Analytics, and Alerts"],"e":"An AAA server (Authentication, Authorization, and Accounting) checks usernames and passwords and provides access to needed services from a centralized database.","h":"Three A's describing what this server does."},{"q":"What protocol keeps computer clocks synchronized and accurate across the network?","a":"NTP (Network Time Protocol)","w":["SCADA","Syslog","SMB"],"e":"NTP (Network Time Protocol) keeps computer clocks accurate, which matters for comparing log files across systems and for encryption technologies that require correct date and time.","h":"This ensures your computer's clock stays accurate."},{"q":"What is the primary function of a load balancer?","a":"Distributing requests evenly across servers and removing failed servers from rotation automatically","w":["Encrypting all traffic between the client and server","Assigning IP addresses to new devices on the network","Filtering spam email before it reaches the inbox"],"e":"A load balancer distributes incoming requests evenly across multiple servers and automatically removes a failed server from rotation, then adds it back once it's healthy again.","h":"Think about how traffic is spread across a web server farm."},{"q":"What system is used to remotely view, manage, and control large-scale industrial equipment like power or manufacturing systems?","a":"SCADA / ICS","w":["UTM","SIEM","AAA server"],"e":"SCADA (Supervisory Control and Data Acquisition), also called ICS (Industrial Control System), is used to remotely view, manage, and control large-scale industrial equipment, and is typically kept on a segmented, tightly controlled network.","h":"Used in industries like oil and gas, power, and manufacturing."}]},{"id":"dns-configuration","section":"Networking Basics","title":"DNS Configuration","blurb":"Record types, DKIM, SPF, DMARC, TTL, dig","cards":[{"q":"How many root server clusters make up the DNS root infrastructure?","a":"13","w":["275","1,000","50"],"e":"The DNS root server infrastructure consists of 13 separate root server clusters, which in total are made up of over 1,000 individual servers.","h":"A number you'd associate with 'bad luck' colloquially."},{"q":"What is the difference between an A record and a AAAA record?","a":"A = IPv4 address; AAAA = IPv6 address","w":["A = IPv6 address; AAAA = IPv4 address","A = mail server; AAAA = web server","A and AAAA are identical and interchangeable"],"e":"An A record maps a hostname to an IPv4 address, while a AAAA (quad A) record maps a hostname to an IPv6 address.","h":"One handles the older, shorter address format; the other the newer, longer one."},{"q":"What does the 'time to live' (TTL) value on a DNS record control?","a":"How long a DNS record is cached before it must be re-requested","w":["How many servers can share the same IP address","How long an email can stay in a spam folder","The maximum number of records allowed in a zone file"],"e":"Time to live (TTL) determines how long a resolved record is cached by a user's workstation before it needs to be requested again.","h":"This value dictates how long a DNS answer is remembered before it needs refreshing."},{"q":"What is the purpose of a CNAME record?","a":"It lets multiple aliases point to one server's existing A record, simplifying IP address changes","w":["It encrypts DNS traffic between servers","It stores the mail server's public key for verification","It defines how spam should be handled for a domain"],"e":"A CNAME (canonical name) record lets multiple names, like chat, ftp, and www, all point to the same underlying server such as mail.example.com, so only the A record needs updating if the IP changes.","h":"Think about giving a server multiple aliases instead of separate IP records."},{"q":"Which DNS record type specifies the mail server responsible for receiving email for a domain?","a":"MX (mail exchanger) record","w":["TXT record","CNAME record","AAAA record"],"e":"An MX (mail exchanger) record specifies the mail server responsible for handling email for a domain, so other mail servers know where to deliver messages.","h":"This record type is specifically about email delivery."},{"q":"How does DKIM (Domain Keys Identified Mail) verify that an email really came from the claimed domain?","a":"A digital signature verified using a public key published in DNS, matched to a private key on the mail server","w":["A list of every mail server allowed to send on the domain's behalf","A policy telling receivers whether to quarantine or reject failed messages","The IPv6 address of the mail server"],"e":"DKIM uses a public/private key pair: outgoing messages are signed with a private key on the mail server, and the public key published in DNS lets recipients verify the digital signature.","h":"Think about the two halves of an asymmetric key pair."},{"q":"Which record type lists the mail servers authorized to send email on behalf of a domain?","a":"SPF (Sender Policy Framework)","w":["DKIM","DMARC","CNAME"],"e":"An SPF record lists the mail servers authorized to send email on behalf of a domain, so receivers can check whether the sending server is legitimate.","h":"This record answers 'which servers are allowed to send mail for this domain?'"},{"q":"Which DNS record type lets a domain owner specify what should happen to email that fails SPF or DKIM checks?","a":"DMARC","w":["SPF","DKIM","A record"],"e":"A DMARC record lets a domain owner specify what receiving mail servers should do with messages that fail SPF or DKIM checks, such as accepting, quarantining, or rejecting them, and can also request reporting.","h":"This record type sets the enforcement policy for failed authentication checks."},{"q":"How can a domain owner receive reports on how their outgoing email messages are being handled by recipients?","a":"Including an email address in the DMARC record for aggregated disposition reports","w":["Manually checking each recipient's spam folder","Using the dig command to query the SOA record","Reviewing the TTL value on the A record"],"e":"A DMARC record can include an email address so that reports on message disposition (accepted, quarantined, or rejected) are sent to a central reporting tool.","h":"Think about how the domain owner learns how their mail is being treated by receivers."},{"q":"What two commands can be used to query and view a domain's DNS text (TXT) records?","a":"dig and nslookup","w":["ping and traceroute","netstat and ipconfig","ssh and telnet"],"e":"The dig and nslookup commands can both query DNS text records, useful for viewing verification codes or SPF/DKIM/DMARC entries stored as TXT records.","h":"One is common on Linux/macOS, the other is used on Windows."}]},{"id":"dhcp","section":"Networking Basics","title":"DHCP","blurb":"DORA, scopes, exclusions, reservations","cards":[{"q":"What does DORA stand for in the DHCP process?","a":"Discover, Offer, Request, Acknowledge","w":["Detect, Obtain, Renew, Assign","Discover, Open, Request, Authenticate","Deploy, Offer, Register, Acknowledge"],"e":"DORA stands for Discover, Offer, Request, and Acknowledge, the four-step process used to assign an IP address via DHCP.","h":"Each letter stands for one step in the four-part handshake."},{"q":"What source IP address does a client use when sending the initial DHCP Discover message?","a":"0.0.0.0","w":["255.255.255.255","10.10.10.99","127.0.0.1"],"e":"In the discover step, a device with no IP address yet sends a broadcast from 0.0.0.0 over UDP port 68 to find available DHCP servers.","h":"The device has no address yet, so it uses a placeholder source address."},{"q":"How does the DHCP server send its Offer message back during the DORA process?","a":"As a broadcast to 255.255.255.255","w":["Directly to the client's MAC address only","As a broadcast to 0.0.0.0","Only over TCP port 67"],"e":"The DHCP server sends its offer as a broadcast to 255.255.255.255 since the client doesn't yet have an IP address to send it to directly.","h":"Since the client has no address yet, the response can't be sent to it directly."},{"q":"Which step in the DORA process finalizes and locks in the IP address for the client?","a":"Acknowledge — confirms and locks in the IP address assignment","w":["Discover — finds available DHCP servers","Offer — proposes possible IP addresses","Request — asks for a chosen address"],"e":"The Acknowledge step locks in the IP address assignment, confirming to the client that the address is now theirs for the duration of the lease.","h":"This is the final step that finalizes and confirms the address."},{"q":"What is a DHCP scope?","a":"A predefined list of IP addresses and configuration settings for a network","w":["A single reserved IP address for one device","The MAC address table on a switch","A backup DNS server list"],"e":"A DHCP scope is the predefined list of IP addresses and configuration settings (subnet mask, lease duration, DNS servers, etc.) configured on a DHCP server for a given network.","h":"Think of this as the overall configuration container for a subnet's DHCP settings."},{"q":"Why would a DHCP scope include excluded IP addresses?","a":"To prevent conflicts with devices that already have static IP addresses","w":["To speed up the DORA process","To reserve addresses exclusively for DNS servers","To limit the total number of devices allowed on the network"],"e":"Excluded addresses within a scope are addresses that should not be handed out, typically because they're statically assigned to devices like switches or routers.","h":"Think about why you wouldn't want to accidentally give this address to a random device."},{"q":"What identifier does a DHCP server use to always assign the same IP address to a specific device through a reservation?","a":"The device's MAC address","w":["The device's hostname only","The device's DNS record","The device's default gateway"],"e":"A DHCP reservation associates a specific device's MAC address with a fixed IP address, so that device always receives the same address without needing manual static configuration on the device itself.","h":"This ties a specific IP to a specific piece of hardware."},{"q":"What is the main advantage of using a DHCP reservation instead of manually configuring a static IP on a device?","a":"Changes can be made centrally on the DHCP server instead of updating each device manually","w":["It eliminates the need for a subnet mask entirely","It allows the device to use multiple IP addresses simultaneously","It removes the need for DNS on that device"],"e":"The main advantage of a DHCP reservation over manually configuring a static IP on the device is that changes can be made centrally on the DHCP server without needing to revisit every individual device.","h":"Think about the administrative burden of updating many devices individually versus one central location."},{"q":"In what year was DHCP created?","a":"1997","w":["1990","2001","1985"],"e":"DHCP was created in 1997 as a protocol to automate the process of assigning IP addresses and other configuration settings to devices.","h":"Late 1990s, a couple years shy of the millennium."},{"q":"What is the relationship between a DHCP scope and a DHCP pool?","a":"Pools are the groups of IP addresses within a scope that the server draws from to assign addresses","w":["Pools are lists of MAC addresses banned from the network","Pools are backup DHCP servers used for redundancy","Pools are the DNS records associated with a scope"],"e":"Within a DHCP scope, pools are the actual groups of IP addresses (often large contiguous ranges) that the server draws from to dynamically assign addresses to connecting devices.","h":"This is the actual set of addresses the server hands out from, nested within the broader scope configuration."}]},{"id":"vlans-and-vpns","section":"Networking Basics","title":"VLANs and VPNs","blurb":"Broadcast domains, concentrators, site-to-site","cards":[{"q":"What defines a LAN (Local Area Network)?","a":"A group of devices connected into a single broadcast domain","w":["A network that spans multiple physical buildings","A network that only supports encrypted traffic","A network with no switches, only routers"],"e":"A LAN is a group of devices connected into a single broadcast domain, meaning a broadcast sent by one device is seen by all others in that same domain.","h":"This is the basic definition given for a local area network."},{"q":"What problem do VLANs solve regarding switch efficiency?","a":"Combining multiple broadcast domains onto one physical switch using logical separation","w":["Encrypting all traffic on a single switch","Increasing the number of physical ports on a switch","Eliminating the need for IP addresses on a network"],"e":"VLANs allow a single physical switch to be logically divided into multiple separate broadcast domains, so you don't need a separate physical switch for each network segment.","h":"Think about the cost and rack space savings mentioned in the video."},{"q":"What device is needed to allow communication between two separate VLANs?","a":"A router (or a switch with routing functionality)","w":["A VPN concentrator","A DHCP server","A DNS server"],"e":"Devices on separate VLANs are in separate broadcast domains and cannot communicate directly; a router (or a switch with routing functionality) is needed to route traffic between them.","h":"Think about what device operates at a layer that can move traffic between separate networks."},{"q":"What is the specialized device that encrypts and decrypts VPN traffic in real time called?","a":"A VPN concentrator","w":["A DHCP relay agent","A DNS resolver","A load balancer"],"e":"A VPN concentrator is the specialized device, often built into a firewall, responsible for encrypting and decrypting VPN traffic in real time.","h":"This device handles the encryption/decryption workload for VPN connections."},{"q":"What does a client-to-site VPN typically connect?","a":"A remote individual user connecting to a central concentrator at a corporate network","w":["Two entire corporate offices connecting to each other","Two VLANs on the same switch communicating","A DHCP server communicating with a DNS server"],"e":"A client-to-site VPN connects an individual remote user (like someone working from home) to a central concentrator, typically at the edge of a corporate network.","h":"Think of the classic 'working from home' VPN scenario."},{"q":"What does an 'always-on' client-to-site VPN configuration mean for the end user?","a":"The VPN connection is automatically established as soon as the device is turned on and logged into","w":["The user must manually reconnect every hour","The connection only activates when accessing email","It disables all local network traffic on the device"],"e":"An always-on client-to-site VPN automatically establishes the encrypted connection to the concentrator the moment the user turns on and logs into their device, without requiring manual setup.","h":"Think about what happens automatically without the user needing to start any software."},{"q":"What does a site-to-site VPN typically connect, and what commonly serves as the concentrators?","a":"Two entire networks at different physical locations, usually via firewalls acting as concentrators","w":["A single remote user connecting to a corporate office","Two VLANs on a single switch","A DNS server and a DHCP server exchanging updates"],"e":"A site-to-site VPN connects two entire networks at different physical locations, commonly implemented using firewalls that act as the VPN concentrators on each end.","h":"Think of an organization linking a branch office network to headquarters."},{"q":"In a site-to-site VPN, which traffic is encrypted and which stays in the clear?","a":"Traffic inside each local network is in the clear; traffic crossing the internet between sites is encrypted","w":["All traffic everywhere, including inside each local network, is always encrypted","No traffic is ever encrypted in a site-to-site VPN","Only DNS traffic is encrypted between sites"],"e":"In a site-to-site VPN setup, traffic inside each local network stays unencrypted, while any traffic crossing the internet between the two sites is encrypted via the VPN tunnel.","h":"Think about where the boundary between 'internal' and 'internet-facing' traffic falls."},{"q":"What happens if someone captures VPN traffic using a packet capture tool?","a":"Captured traffic would be unreadable/unintelligible to anyone viewing it","w":["Captured traffic would show the sender's password in plain text","Captured traffic would automatically be deleted","Captured traffic would be immediately blocked by the ISP"],"e":"One of the main security benefits of VPN encryption is that if someone captures the traffic in a packet capture tool, they would not be able to understand the encrypted contents.","h":"Think about what happens if an attacker intercepts the traffic in transit."},{"q":"How can VPN concentrator functionality be implemented?","a":"As dedicated hardware or as software running on an existing server","w":["Only as a standalone hardware appliance, never as software","Only built directly into the operating system kernel","Only through a cloud-based DNS provider"],"e":"VPN concentrator functionality can be implemented as dedicated hardware appliances or as software running on an existing server, and VPN client software may be built into an OS or installed as third-party software.","h":"Think about whether it always has to be a dedicated physical device."}]},{"id":"network-devices","section":"Networking Basics","title":"Network Devices","blurb":"Routers, switches, firewalls, PoE, DSL, ONT","cards":[{"q":"What does a router use to make its forwarding decisions?","a":"The destination IP address","w":["The destination MAC address","The destination port number only","The source MAC address"],"e":"Routers make forwarding decisions based on the destination IP address in a packet, unlike switches which use MAC addresses.","h":"Think about the layer 3 addressing scheme used for forwarding decisions."},{"q":"What is a device that combines both switching and routing functionality commonly called?","a":"Layer 3 switch","w":["Layer 1 hub","Access point","Patch panel"],"e":"A switch that also has routing functionality is commonly referred to as a layer 3 switch, since routing operates at OSI layer 3.","h":"Named after the OSI layer where routing operates."},{"q":"What characterizes an unmanaged switch?","a":"No configuration options, no VLAN support, and no SNMP or logging, but lower cost","w":["Full VLAN configuration and remote SNMP management","Built-in routing between IP subnets","Automatic firewall rule generation"],"e":"Unmanaged switches are essentially plug-and-play devices with no configuration options, no VLAN support, and no SNMP or logging capability, but they're typically cheaper.","h":"Think about the simplest, most basic type of switch with no configuration options."},{"q":"What features does a managed switch typically offer that an unmanaged switch does not?","a":"VLAN configuration, traffic prioritization, redundancy, and remote management (SNMP)","w":["Zero configuration options and the lowest price point","Only wireless connectivity, no wired ports","Built-in fiber-to-copper conversion"],"e":"Managed switches support VLAN configuration, traffic prioritization, redundancy, remote management via SNMP, and port mirroring for monitoring traffic.","h":"Think about the features an enterprise network administrator would need for remote configuration."},{"q":"How does an access point forward traffic between wireless and wired networks?","a":"It bridges wireless and wired networks based on destination MAC address, without routing IP addresses","w":["It routes traffic between IP subnets","It terminates fiber connections into copper","It only functions as a firewall"],"e":"An access point performs bridged communication, forwarding frames based on destination MAC address between a wireless network and a wired network, without doing any IP routing.","h":"Think about how it forwards traffic without translating IP addresses."},{"q":"What is the main benefit of using a patch panel in a wiring closet?","a":"It keeps the permanent desk-to-closet cable run in place while allowing easy rewiring to different switches/VLANs inside the closet","w":["It encrypts all data passing between the desk and the closet","It eliminates the need for any switch in the closet","It provides power over Ethernet to every desk"],"e":"A patch panel allows the permanent cable run between a desk and the closet to stay in place, while short cables on the patch panel's other side can be easily rearranged to connect to different switches or VLANs.","h":"Think about why you'd want a fixed run to the desk but flexibility inside the closet."},{"q":"How does a next-generation firewall differ from a traditional port-based firewall?","a":"Making decisions based on the specific application in use, not just the port number","w":["Only filtering traffic based on MAC address","Assigning IP addresses automatically like DHCP","Converting fiber signals into copper signals"],"e":"A next-generation firewall makes forwarding decisions based on the application in use, rather than solely relying on port numbers like a traditional firewall.","h":"Think about what a next-generation firewall examines beyond just port numbers."},{"q":"What power and current does the original PoE specification provide?","a":"15.4 watts at 350 milliamps","w":["25.5 watts at 600 milliamps","51 watts at 600 milliamps","71.3 watts at 960 milliamps"],"e":"The original PoE specification provides 15.4 watts of DC power with a maximum current of 350 milliamps.","h":"The lowest wattage tier among the PoE standards mentioned."},{"q":"What are the terms for PoE power coming from the switch itself versus from a separate injector device?","a":"Endspan (from the switch) and midspan (from an injector)","w":["Uplink and downlink","Primary and secondary span","Ingress and egress span"],"e":"When PoE power comes directly from the switch, it's called an endspan; when a separate injector device is used to add power to the connection, it's called a midspan.","h":"One term describes power coming from the switch itself, the other from an added device."},{"q":"What does an ONT (Optical Network Terminal) do, and what point does it typically mark?","a":"It converts fiber into copper connections and typically marks the demarcation point","w":["It encrypts data traveling over a DSL connection","It assigns dynamic IP addresses to devices on the network","It filters spam email at the network edge"],"e":"An ONT (Optical Network Terminal) converts an incoming fiber connection into copper connections usable by traditional network equipment, and it typically marks the demarcation point between customer and provider responsibility.","h":"This device converts the type of connection coming into your home or business."}]},{"id":"ipv4-and-ipv6","section":"Addressing","title":"IPv4 and IPv6","blurb":"Address formats, NAT, private ranges","cards":[{"q":"How many bits make up an IPv4 address?","a":"32 bits","w":["64 bits","128 bits","16 bits"],"e":"An IPv4 address is 32 bits in length, represented as four decimal octets (e.g., 192.168.1.131).","h":"Four octets of 8 bits each."},{"q":"What is the maximum possible value of a single octet in an IPv4 address?","a":"255","w":["256","128","999"],"e":"Each octet in an IPv4 address is made up of 8 bits, and since 8 bits can represent values from 0 to 255, no octet will ever exceed 255.","h":"This is the maximum value representable by 8 bits."},{"q":"What technology allows many private IP addresses inside a network to share a single public IP address for internet communication?","a":"NAT (Network Address Translation)","w":["DHCP","DNS","VLAN tagging"],"e":"NAT (Network Address Translation)
