sson.","h":"This is the very top of the IPv4 address range, set aside rather than assigned to devices."},{"q":"Since 1993, has classful addressing (Class A/B/C) been actively used to assign subnet masks on real networks?","a":"No, classless addressing (CIDR) has been used instead since 1993, though classes still serve as a conceptual starting point for subnetting","w":["Yes, classful addressing is still the exclusive method used on all modern networks","No, but only because IPv4 has been fully replaced by IPv6 since 1993","Yes, but only for Class A addresses; B and C have been deprecated"],"e":"Classful addressing hasn't been the actual method used since 1993, replaced by classless (CIDR) addressing, but understanding classful ranges still provides a useful starting point for subnetting calculations.","h":"The lesson explains that we don't actually use this method anymore, but we still reference it as a foundational starting point."},{"q":"How do you calculate the network address for a given IP address and subnet mask?","a":"Set all host bits to 0","w":["Set all host bits to 1","Set all network bits to 0","Add 1 to the broadcast address"],"e":"To find the network address, you set every host bit (the bits not covered by the subnet mask) to 0, leaving the network portion unchanged.","h":"This is the opposite operation from calculating the broadcast address."},{"q":"How do you calculate the broadcast address for a given IP address and subnet mask?","a":"Set all host bits to 1","w":["Set all host bits to 0","Set all network bits to 1","Subtract 1 from the network address"],"e":"The broadcast address is found by setting every host bit to 1 (which is the same as 255 decimal for a full octet), representing the very last address in that subnet.","h":"This is the opposite operation from calculating the network address."},{"q":"If the network address for a subnet is 192.168.4.0 and the broadcast address is 192.168.4.255, what are the first and last usable host addresses?","a":"First usable: 192.168.4.1; Last usable: 192.168.4.254","w":["First usable: 192.168.4.0; Last usable: 192.168.4.255","First usable: 192.168.4.2; Last usable: 192.168.4.253","First usable: 192.168.4.1; Last usable: 192.168.4.255"],"e":"The first usable host address is always one more than the network address, and the last usable host address is always one less than the broadcast address, giving 192.168.4.1 through 192.168.4.254 here.","h":"Add 1 to the network address for the first usable host, and subtract 1 from the broadcast address for the last usable host."},{"q":"What class is the IP address 220.10.77.40, and what is its default subnet mask?","a":"Class C, with a default subnet mask of 255.255.255.0","w":["Class B, with a default subnet mask of 255.255.0.0","Class A, with a default subnet mask of 255.0.0.0","Class D, with no assignable subnet mask"],"e":"Since the first octet, 220, falls within the 192-223 range, this is a Class C address, giving it a default subnet mask of 255.255.255.0 (/24).","h":"Check the first octet, 220, against the classful ranges given earlier in this deck."}]},{"id":"ipv4-subnet-masks","section":"IPv4 Addressing & Subnetting","title":"IPv4 Subnet Masks","blurb":"CIDR notation, converting between binary, decimal, and CIDR block masks","cards":[{"q":"What does CIDR stand for, and what does it allow that classful addressing didn't?","a":"Classless Inter-Domain Routing; it allows subnet masks that don't align to the fixed Class A/B/C boundaries","w":["Classful Internet Device Routing; it requires strict adherence to Class A/B/C boundaries","Core Internet Domain Registry; it manages IP address allocation globally","Classless Internal Data Routing; it only applies to private IP address ranges"],"e":"CIDR (Classless Inter-Domain Routing) replaced classful addressing in 1993, allowing subnet masks of any bit length rather than being locked into the fixed class-based boundaries.","h":"The 'classless' part of this name is the key distinction from the older classful system."},{"q":"What does the CIDR notation /24 represent in decimal?","a":"255.255.255.0","w":["255.255.0.0","255.0.0.0","255.255.255.192"],"e":"CIDR notation counts the number of contiguous 1 bits in the subnet mask. A /24 means 24 ones, which is 255.255.255.0 in decimal (three full octets of 1s, one octet of 0s).","h":"Count out 24 ones across the four octets, filling full octets first."},{"q":"If a subnet mask has 16 total 1 bits (8 in the first octet, 8 in the second, 0 in the third and fourth), what is both its CIDR notation and decimal form?","a":"/16, which is 255.255.0.0","w":["/24, which is 255.255.255.0","/8, which is 255.0.0.0","/12, which is 255.240.0.0"],"e":"Counting 8 ones in the first octet and 8 in the second gives 16 total ones, so the CIDR notation is /16, equivalent to 255.255.0.0 in decimal.","h":"Simply add up the 1 bits across all four octets to get the CIDR number."},{"q":"What decimal subnet mask corresponds to a /26 CIDR notation?","a":"255.255.255.192","w":["255.255.255.128","255.255.255.224","255.255.255.240"],"e":"A /26 means 26 total 1 bits: 8 in each of the first three octets (24 total) plus 2 more in the fourth octet. Two 1 bits in an octet corresponds to 192 in decimal, giving 255.255.255.192.","h":"The first three octets are full (255 each); only the fourth octet needs calculating for the remaining 2 bits."},{"q":"What decimal subnet mask corresponds to a /12 CIDR notation?","a":"255.240.0.0","w":["255.255.0.0","255.192.0.0","255.224.0.0"],"e":"A /12 means 12 total 1 bits: 8 in the first octet (full 255) plus 4 more in the second octet. Four 1 bits in an octet corresponds to 240 in decimal, giving 255.240.0.0.","h":"The first octet is full; the second octet needs exactly 4 of its 8 bits set to 1."},{"q":"What decimal subnet mask corresponds to a /19 CIDR notation?","a":"255.255.224.0","w":["255.255.240.0","255.255.192.0","255.255.248.0"],"e":"A /19 means 19 total 1 bits: 8 in the first octet, 8 in the second (16 total), plus 3 more in the third octet. Three 1 bits in an octet corresponds to 224 in decimal, giving 255.255.224.0.","h":"The first two octets are full; the third octet needs exactly 3 of its 8 bits set to 1."},{"q":"What decimal subnet mask corresponds to a /20 CIDR notation, and how many host bits does that leave?","a":"255.255.240.0, leaving 12 host bits","w":["255.255.224.0, leaving 13 host bits","255.255.192.0, leaving 14 host bits","255.255.248.0, leaving 11 host bits"],"e":"A /20 means 20 network bits: 8 in each of the first two octets (16 total) plus 4 more in the third octet (240 in decimal), giving 255.255.240.0 and leaving 32 - 20 = 12 bits for hosts.","h":"Subtract the CIDR number from the total 32 bits in an IPv4 address to find the host bits."},{"q":"How many total 1 bits does the subnet mask 255.255.255.0 contain, and what is its CIDR notation?","a":"24 total 1 bits, written as /24","w":["16 total 1 bits, written as /16","32 total 1 bits, written as /32","20 total 1 bits, written as /20"],"e":"255.255.255.0 has three full octets of 1s (8+8+8=24) and one octet of all 0s, making the CIDR notation /24.","h":"Three of the four octets are entirely 255; the fourth is entirely 0."},{"q":"Why might a device's operating system expect a subnet mask in decimal form (like 255.255.255.0), while a router or switch might expect CIDR notation (like /24)?","a":"Different devices and interfaces simply have different conventions for how they expect the subnet mask to be entered; you need to check each device's documentation","w":["Decimal notation and CIDR notation always represent fundamentally different subnet masks","Routers and switches cannot technically process decimal subnet masks at all","Operating systems cannot technically process CIDR notation at all"],"e":"Both notations describe the exact same underlying subnet mask; it's simply a difference in input convention between devices, so checking each device's documentation tells you which form it expects.","h":"The underlying mask is identical either way; this is purely a difference in how it's typically entered on different equipment."},{"q":"In subnet mask binary notation, what pattern do the 1s and 0s always follow?","a":"A contiguous block of 1s on the left, followed by a contiguous block of 0s on the right, with no mixing","w":["1s and 0s can appear in any random order throughout the mask","0s always appear first on the left, followed by 1s on the right","Exactly half of the bits must always be 1s and half must be 0s"],"e":"A valid subnet mask always consists of a contiguous run of 1 bits (marking the network portion) followed by a contiguous run of 0 bits (marking the host portion), never interleaved.","h":"The mask's structure is always 1s on the left, 0s on the right, with a single clean break between them."}]},{"id":"calculating-ipv4-subnets-hosts","section":"IPv4 Addressing & Subnetting","title":"Calculating IPv4 Subnets and Hosts","blurb":"VLSM, and the formulas for number of subnets and hosts per subnet","cards":[{"q":"What does VLSM stand for, and what does it allow a network administrator to do?","a":"Variable-Length Subnet Masks; it allows creating subnets of different, customized sizes rather than being locked into one fixed classful size","w":["Virtual LAN Subnet Mapping; it allows mapping VLANs directly to physical ports","Vendor-Length Subnet Modeling; it allows vendors to define proprietary mask lengths","Very Large Subnet Masking; it only applies to Class A address ranges"],"e":"VLSM (Variable-Length Subnet Masks) lets administrators create subnets of varying sizes tailored to actual need, rather than being restricted to the fixed network/host boundary of classful addressing.","h":"The word 'Variable' in the name is the key: subnet sizes aren't fixed like they were under classful addressing."},{"q":"Why do networks need to be broken into smaller subnets in the first place, rather than one giant flat network?","a":"Because it's functionally impossible for a single device to know the location of every other device in the world; smaller networks and routers make this manageable","w":["Because IPv4 addresses physically cannot exceed 254 devices per network under any circumstances","Because subnetting is required by law in every country for network operators","Because larger networks always run at significantly slower speeds than smaller ones"],"e":"Breaking the overall address space into smaller subnets, connected by routers, lets traffic be forwarded step by step to its destination without any single device needing to know the location of every device worldwide.","h":"Think about the practical impossibility of one device maintaining a map of every device on Earth."},{"q":"What is the formula for calculating the number of subnets available, given a certain number of subnet bits?","a":"2 raised to the power of the number of subnet bits (2^subnet bits)","w":["2 multiplied by the number of subnet bits","The number of subnet bits minus 2","256 divided by the number of subnet bits"],"e":"The number of possible subnets is calculated as 2 raised to the power of however many bits have been borrowed for subnetting, following the same binary doubling pattern covered in binary math.","h":"This follows the same 2^n pattern used to calculate possible binary outcomes in general."},{"q":"What is the formula for calculating the number of usable hosts per subnet, given a certain number of host bits?","a":"2 raised to the power of the number of host bits, minus 2 (2^host bits - 2)","w":["2 raised to the power of the number of host bits, with no subtraction","The number of host bits multiplied by 2","256 minus the number of host bits"],"e":"The usable hosts per subnet formula subtracts 2 from 2^host bits, because one address in that range is reserved for the network address and one for the broadcast address, leaving the remainder as usable host addresses.","h":"Two addresses in every subnet are always reserved and not usable by an actual host device."},{"q":"For the IP address 10.1.1.0/24 (a Class A address using a /24 mask), how many total subnets and hosts per subnet are possible?","a":"65,536 subnets, with 254 hosts per subnet","w":["256 subnets, with 65,534 hosts per subnet","254 subnets, with 65,536 hosts per subnet","16 subnets, with 4,094 hosts per subnet"],"e":"A Class A address defaults to 8 network bits, so a /24 mask borrows 16 additional subnet bits (2^16 = 65,536 subnets), leaving 8 host bits (2^8 - 2 = 254 hosts per subnet).","h":"Class A defaults to 8 network bits; subtract that from 24 to find how many bits were borrowed for subnetting."},{"q":"For the IP address 192.168.11.0/26 (a Class C address using a /26 mask), how many total subnets and hosts per subnet are possible?","a":"4 subnets, with 62 hosts per subnet","w":["2 subnets, with 126 hosts per subnet","8 subnets, with 30 hosts per subnet","64 subnets, with 2 hosts per subnet"],"e":"A Class C address defaults to 24 network bits, so a /26 mask borrows 2 additional subnet bits (2^2 = 4 subnets), leaving 6 host bits (2^6 - 2 = 62 hosts per subnet).","h":"Class C defaults to 24 network bits; the /26 only borrows 2 extra bits beyond that default."},{"q":"For the IP address 172.16.55.0/21 (a Class B address using a /21 mask), how many total subnets and hosts per subnet are possible?","a":"32 subnets, with 2,046 hosts per subnet","w":["16 subnets, with 4,094 hosts per subnet","64 subnets, with 1,022 hosts per subnet","8 subnets, with 8,190 hosts per subnet"],"e":"A Class B address defaults to 16 network bits, so a /21 mask borrows 5 additional subnet bits (2^5 = 32 subnets), leaving 11 host bits (2^11 - 2 = 2,046 hosts per subnet).","h":"Class B defaults to 16 network bits; the /21 borrows 5 extra bits beyond that default."},{"q":"Using the \"cutting a pizza\" analogy from the lesson, what does VLSM let a network administrator effectively decide?","a":"How many pieces (subnets) to cut the overall network (pizza) into, and how large or small each piece should be","w":["Which single fixed size every subnet on every network must always be","Whether the network uses IPv4 or IPv6 exclusively","How many total devices can ever exist across the entire internet"],"e":"Just as you can choose to cut a pizza into 2, 4, 8, or more pieces, VLSM lets an administrator choose exactly how many subnets to create and how large each one is, tailored to actual network needs.","h":"The size and number of 'slices' (subnets) is entirely up to the person doing the cutting (subnetting)."},{"q":"If a Class A network's default mask is /8, and an administrator applies a /24 mask instead, how many bits have been \"borrowed\" for subnetting?","a":"16 bits (24 minus the default 8)","w":["24 bits, the full value of the new mask","8 bits, the value of the original default mask","32 bits, the total length of an IPv4 address"],"e":"The number of borrowed subnet bits is the difference between the new mask length and the classful default: 24 - 8 = 16 bits borrowed from what would have been host bits.","h":"Subtract the original classful default mask length from the new mask length."},{"q":"Why is the \"-2\" subtracted when calculating usable hosts per subnet, but not when calculating the number of subnets?","a":"Because every subnet reserves one address for the network ID and one for the broadcast address, which aren't usable by hosts, but these reservations don't apply when simply counting the number of subnets themselves","w":["Because subnets are also reduced by 2 using the exact same logic","Because the -2 is simply a rounding convention with no real technical meaning","Because only Class A networks require subtracting 2 from the host count"],"e":"Each individual subnet has a network address and broadcast address that can't be assigned to hosts, so -2 applies specifically to the host count, not to the separate count of how many subnets exist overall.","h":"The -2 reservation is about addresses reserved inside each subnet, not about the subnets themselves."},{"q":"Before using shortcut methods like the magic number method, what foundational calculation must you already understand to use VLSM correctly?","a":"How to determine the number of subnet bits and host bits based on the classful default and the new subnet mask being applied","w":["How to calculate satellite signal latency over long distances","How to determine which fiber connector type is appropriate for a given distance","How to calculate the magic number before knowing the subnet mask at all"],"e":"VLSM calculations depend on first knowing how many bits are subnet bits versus host bits (based on the classful default and chosen mask), which is the foundation that faster shortcut methods, like magic number subnetting, build upon.","h":"Shortcut methods still rely on this same underlying subnet-bits versus host-bits breakdown."}]},{"id":"magic-number-subnetting","section":"IPv4 Addressing & Subnetting","title":"Magic Number Subnetting","blurb":"A fast shortcut for calculating subnet ID, broadcast address, and host ranges","cards":[{"q":"In the magic number method, how do you calculate the \"magic number\" for a given subnet mask?","a":"Subtract the value of the interesting octet's subnet mask from 256","w":["Add the value of the interesting octet's subnet mask to 256","Divide 256 by the value of the interesting octet's subnet mask","Multiply the value of the interesting octet's subnet mask by 2"],"e":"The magic number is calculated as 256 minus the subnet mask value in the \"interesting octet,\" and it represents the size of each subnet block in that octet.","h":"This calculation always starts from 256 and subtracts the mask value in one specific octet."},{"q":"What is the \"interesting octet\" in the magic number method?","a":"The one octet in the subnet mask that is neither 0 nor 255","w":["Always the very first octet of the subnet mask, regardless of its value","Always the very last octet of the IP address, regardless of its value","The octet with the highest numeric value in the IP address itself"],"e":"Every other octet in the mask is either 255 (fully network) or 0 (fully host), but the interesting octet is the one in between, where the actual subnet boundary falls, making it the one you perform the magic number calculation on.","h":"Look for the one octet in the mask that doesn't fit neatly into either 0 or 255."},{"q":"Using the magic number method, if the subnet mask is 255.255.240.0, what is the magic number, and which octet is the \"interesting octet\"?","a":"Magic number is 16 (256 - 240); the third octet is the interesting octet","w":["Magic number is 240; the first octet is the interesting octet","Magic number is 16; the fourth octet is the interesting octet","Magic number is 240; the second octet is the interesting octet"],"e":"In 255.255.240.0, the first two octets are 255 and the last is 0, leaving the third octet (240) as the interesting one. The magic number is 256 - 240 = 16.","h":"Scan the mask's four octets for the one value that isn't 0 or 255: that's the third octet here."},{"q":"For the IP address 165.245.77.14 with subnet mask 255.255.240.0 (magic number 16), what is the subnet ID?","a":"165.245.64.0","w":["165.245.77.0","165.245.80.0","165.245.0.0"],"e":"With a magic number of 16, the interesting octet's blocks are 0-15, 16-31, 32-47, 48-63, 64-79, and so on. Since 77 falls in the 64-79 block, the subnet ID uses 64 in that octet, giving 165.245.64.0.","h":"Find which block of size 16 the number 77 falls into, then use that block's starting number."},{"q":"For the IP address 165.245.77.14 with subnet mask 255.255.240.0 (magic number 16, subnet ID 165.245.64.0), what is the broadcast address?","a":"165.245.79.255","w":["165.245.95.255","165.245.64.255","165.245.127.255"],"e":"The broadcast address formula is: subnet ID's interesting octet value + magic number - 1. Here that's 64 + 16 - 1 = 79, with the remaining octet filled with 255, giving 165.245.79.255.","h":"Take the subnet ID's interesting-octet value, add the magic number, then subtract 1."},{"q":"Using the magic number method rules, what do you do with an octet in the subnet mask that equals 255, when calculating the subnet ID?","a":"Copy that same octet's value directly from the IP address down into the subnet ID","w":["Always write a 0 into that octet of the subnet ID, regardless of the IP address","Always write a 255 into that octet of the subnet ID, regardless of the IP address","Skip that octet entirely and leave it blank"],"e":"When a subnet mask octet is 255, that octet is fully part of the network portion, so you simply copy the IP address's value for that octet straight down into the subnet ID.","h":"A mask value of 255 means that octet is fully network, with nothing to calculate: just copy it over."},{"q":"Using the magic number method rules, what do you do with an octet in the subnet mask that equals 0, when calculating the broadcast address?","a":"Write 255 into that octet of the broadcast address","w":["Copy that octet's value directly from the IP address","Write 0 into that octet of the broadcast address","Leave that octet blank since it doesn't affect the broadcast address"],"e":"When a subnet mask octet is 0, that octet is fully host, so for the broadcast address calculation specifically, you fill that octet with 255 (the maximum host value), representing the last address in that block.","h":"For the broadcast address, a mask value of 0 becomes the maximum possible value, 255, in that same octet."},{"q":"For the IP address 10.180.122.244 with subnet mask 255.248.0.0, what is the magic number, and in which octet does the subnetting actually happen?","a":"Magic number is 8 (256 - 248); the second octet is the interesting octet","w":["Magic number is 248; the first octet is the interesting octet","Magic number is 8; the third octet is the interesting octet","Magic number is 248; the fourth octet is the interesting octet"],"e":"In 255.248.0.0, the first octet is 255 and the last two are 0, leaving the second octet (248) as the interesting one. The magic number is 256 - 248 = 8.","h":"Only one octet in this mask isn't a clean 0 or 255; that's your interesting octet."},{"q":"Once you know the subnet ID and broadcast address for a subnet, how do you find the first and last usable host addresses?","a":"First usable host = subnet ID + 1; last usable host = broadcast address - 1","w":["First usable host = subnet ID - 1; last usable host = broadcast address + 1","First usable host = broadcast address + 1; last usable host = subnet ID - 1","First and last usable hosts are the same as the subnet ID and broadcast address themselves"],"e":"Just as in classful subnetting, the first usable host address is always one more than the subnet (network) ID, and the last usable host address is always one less than the broadcast address.","h":"This relationship between subnet ID/broadcast and the first/last usable hosts is the same across every subnetting method covered."},{"q":"What is the main advantage of the magic number method compared to doing a full binary conversion for every subnet calculation?","a":"It's significantly faster, relying only on simple addition, subtraction, and knowledge of powers of 2, rather than converting every address to binary and back","w":["It eliminates the need to know the subnet mask at all","It only works for Class C addresses, making it simpler by restricting its scope","It requires no knowledge of the IP address itself, only the subnet mask"],"e":"The magic number method avoids repeated binary-to-decimal conversions by using simple arithmetic (256 minus the interesting octet, plus basic addition/subtraction) to quickly find the subnet ID, broadcast address, and usable host range.","h":"The speed benefit comes from skipping binary conversion in favor of a few quick arithmetic steps."}]},{"id":"seven-second-subnetting","section":"IPv4 Addressing & Subnetting","title":"Seven Second Subnetting","blurb":"A chart-based shortcut for calculating subnets without binary math","cards":[{"q":"What is the main advantage of the seven second subnetting method over other subnetting shortcuts?","a":"There is no math involved in calculating a magic number; everything needed is predefined in a chart you build beforehand","w":["It works only when using the online exam whiteboard","It eliminates the need to know CIDR notation at all","It only applies to classful subnet masks"],"e":"Unlike the magic number method, seven second subnetting requires no calculation of a magic number at all. You build a reference chart once, and from there the only math is adding or subtracting 1.","h":"Think about what step is removed compared to the magic number method."},{"q":"What three columns make up the core seven second subnetting chart?","a":"CIDR/subnet mask, number of networks, and number of addresses (hosts) per subnet","w":["Network ID, broadcast address, and default gateway","Class A, Class B, and Class C ranges","Public IP range, private IP range, and loopback range"],"e":"The chart maps CIDR notation to decimal subnet mask values, alongside the number of networks (doubling from 2 to 256) and number of addresses (halving from 128 down to 1).","h":"This is the lookup table you build once at the start of the process."},{"q":"In the seven second subnetting chart, how is the 'Networks' column generated?","a":"Starting at 2 and doubling the value repeatedly up to 256","w":["Starting at 256 and dividing by 2 down to 1","Starting at 1 and adding 1 repeatedly up to 256","Starting at 128 and doubling up to 4096"],"e":"The Networks column begins at 2 and doubles (2, 4, 8, 16...256), representing how many subnets result from borrowing each additional bit.","h":"This column grows as you borrow more bits for subnetting."},{"q":"In the seven second subnetting chart, how is the 'Addresses' column generated?","a":"Starting at 128 and dividing by 2 repeatedly down to 1","w":["Starting at 1 and doubling up to 256","Starting at 256 and subtracting 2 repeatedly","Starting at 64 and adding 64 repeatedly"],"e":"The Addresses column starts at 128 and is halved each row (128, 64, 32...1), representing the number of host addresses in each subnet size.","h":"This column shrinks as subnets get smaller and more numerous."},{"q":"Using seven second subnetting for 165.245.12.88/24, what is the subnet mask in decimal?","a":"255.255.255.0","w":["255.255.0.0","255.255.255.128","255.255.255.192"],"e":"A /24 means the mask value in the chart for the third octet is 255, and the fourth octet mask is 0, giving 255.255.255.0.","h":"A /24 boundary falls exactly on a whole octet."},{"q":"For 165.245.12.88/26, what is the network (subnet) address?","a":"165.245.12.64","w":["165.245.12.0","165.245.12.128","165.245.12.88"],"e":"A /26 gives blocks of 64 addresses in the fourth octet (0, 64, 128, 192). Since .88 falls in the 64-127 range, the network address is 165.245.12.64.","h":"Find which 64-address block contains .88 using your boundary chart."},{"q":"For 165.245.12.88/26, what is the broadcast address?","a":"165.245.12.127","w":["165.245.12.63","165.245.12.191","165.245.12.255"],"e":"Since the block starting at 64 ends right before the next block (128), the broadcast address is 128 minus 1, or 165.245.12.127.","h":"The broadcast address is always one less than the start of the next block."},{"q":"For 18.172.200.77/11, what is the network address?","a":"18.160.0.0","w":["18.172.0.0","18.192.0.0","18.0.0.0"],"e":"A /11 falls in the second octet with a mask value of 224, giving blocks of 32 in that octet. The value 172 falls in the 160-191 block, so the network address is 18.160.0.0.","h":"Find which 32-wide block in the second octet contains 172."},{"q":"For 18.172.200.77/17, what is the broadcast address?","a":"18.172.255.255","w":["18.172.127.255","18.172.128.0","18.255.255.255"],"e":"A /17 creates blocks of 128 in the third octet. The value 200 falls in the 128-255 block, so the broadcast address uses 255 for the third octet, and 255 for the fourth (since its mask bit is 0): 18.172.255.255.","h":"The /17 boundary splits the third octet into two 128-sized halves."},{"q":"Once you know the network address and broadcast address of a subnet, how do you find the first and last usable IP addresses?","a":"Add 1 to the network address for the first usable IP, and subtract 1 from the broadcast address for the last usable IP","w":["Add 2 to the network address and subtract 2 from the broadcast address","The network address itself is the first usable IP and the broadcast address is the last usable IP","Add 1 to the broadcast address and subtract 1 from the network address"],"e":"The network address and broadcast address themselves aren't assignable to hosts, so the first usable address is network+1 and the last usable is broadcast-1.","h":"This is the only arithmetic step in the whole seven second subnetting process."}]},{"id":"software-defined-networking","section":"Network Environments","title":"Software Defined Networking","blurb":"Data, control, and management planes, plus SD-WAN for cloud-based connectivity","cards":[{"q":"What are the three functional planes that software defined networking separates out of a traditional networking device?","a":"The data plane, the control plane, and the management plane","w":["The physical plane, the virtual plane, and the cloud plane","The access plane, the distribution plane, and the core plane","The ingress plane, the egress plane, and the forwarding plane"],"e":"SDN breaks device functionality into the data plane (forwarding traffic), control plane (deciding where data goes), and management plane (administrative access), allowing each to be virtualized independently.","h":"Think about forwarding, decision-making, and administration as three separate jobs."},{"q":"Which SDN plane is responsible for actually forwarding, trunking, encrypting, and performing NAT on traffic?","a":"The data plane (also called the infrastructure layer)","w":["The control plane","The management plane","The application plane"],"e":"The data plane does the heavy lifting of physically moving traffic from one interface to another, including encryption and NAT.","h":"This is the plane that touches every packet as it passes through."},{"q":"Which SDN plane holds routing tables, switching tables, and NAT tables that determine how traffic should be forwarded?","a":"The control plane","w":["The data plane","The management plane","The transport plane"],"e":"The control plane maintains the reference information (routing/switching/NAT tables) that the data plane consults to make forwarding decisions.","h":"This plane stores the 'knowledge' the device uses to make decisions."},{"q":"Which SDN plane is used when an administrator SSHes into a device or logs into its web-based console?","a":"The management plane (also called the application layer)","w":["The data plane","The control plane","The forwarding plane"],"e":"Any time you're administratively accessing and configuring the device itself, you're using the management plane.","h":"This plane is about administrator access, not traffic forwarding."},{"q":"What does SD-WAN stand for?","a":"Software-Defined Wide Area Network","w":["Secure Data Wide Area Network","Software-Defined Web Access Node","Static Data Wide Area Network"],"e":"SD-WAN is a wide area network technology specifically built to manage the complexities of connecting to cloud-based resources.","h":"It's a WAN technology, named for the same 'software-defined' concept as SDN."},{"q":"Why was SD-WAN created instead of relying on traditional WAN links to a centralized data center?","a":"Because applications and services have moved to the cloud and may exist anywhere, requiring an application-aware WAN that can adapt to changing locations","w":["Because traditional WAN links can't support any encryption","Because SD-WAN is required for IPv6 compatibility","Because traditional routers cannot run routing protocols"],"e":"With resources scattered across multiple cloud providers rather than one central data center, SD-WAN needed to be application-aware and able to find the closest instance of a service automatically.","h":"Think about what changed when companies moved services out of a single data center and into the cloud."},{"q":"What SD-WAN feature allows remote routers to automatically update their configuration any time there's a change to the network or service locations, without manual intervention?","a":"Zero-touch provisioning","w":["Dynamic Frequency Selection","Link Aggregation Control Protocol","Transmit Power Control"],"e":"Zero-touch provisioning lets SD-WAN routers automatically reconfigure themselves whenever cloud service locations or network conditions change.","h":"The name implies the administrator doesn't have to 'touch' the device to update it."},{"q":"Why is SD-WAN described as being 'agnostic to the transport type'?","a":"Because remote sites may connect via fiber, 5G, DSL, or other very different connection types, and SD-WAN can work over any of them","w":["Because it only works over fiber connections","Because it requires a dedicated MPLS circuit","Because it cannot function over wireless links"],"e":"Since different sites and cloud providers may be reached through very different connectivity types, SD-WAN is designed to function regardless of the underlying transport.","h":"Consider the variety of connection types a remote site might have to the internet."},{"q":"How are policy changes typically applied across an SD-WAN deployment?","a":"Through central policy management, where changes are made once on a management console and pushed out automatically to all SD-WAN routers","w":["Each router must be individually reconfigured by an administrator","Policies are hard-coded into firmware and cannot be changed","Changes require a full network outage window to apply"],"e":"SD-WAN uses centralized policy management so administrators don't need to touch every router individually; changes are pushed out automatically.","h":"Think about how SD-WAN avoids manual, router-by-router configuration."},{"q":"In an SD-WAN deployment, how does traffic destined for the central data center differ from traffic destined for a cloud application?","a":"Traffic to the data center can go directly there, while traffic to a cloud-based application or database can go directly to that cloud service rather than routing through the data center","w":["All traffic, regardless of destination, must route through the data center first","Cloud traffic is always blocked by SD-WAN for security reasons","Data center traffic always requires an application-aware route, unlike cloud traffic"],"e":"SD-WAN allows remote sites to reach cloud resources directly rather than forcing all traffic back through a central hub, improving efficiency.","h":"SD-WAN's application awareness lets it choose the most direct path for each type of destination."}]},{"id":"virtual-extensible-lan","section":"Network Environments","title":"Virtual Extensible LAN","blurb":"VXLAN tunnel endpoints, VNIs, and scaling virtual networks across data centers","cards":[{"q":"What problem does VXLAN primarily solve for large service providers and data centers?","a":"It seamlessly connects data centers with different IP addressing schemes and underlying infrastructure, without applications needing to know the difference","w":["It replaces the need for any IP addressing entirely","It provides encryption for data at rest","It eliminates the need for routers between data centers"],"e":"VXLAN was designed to support thousands of customers across multiple data centers, abstracting away differences in IP addressing and underlying connectivity.","h":"Think about what changes when an application can run in any data center without anyone noticing."},{"q":"How many virtual networks can VXLAN support, compared to traditional VLANs?","a":"Up to 16 million, compared to around 4,000 for VLANs","w":["Up to 4,000, the same as VLANs","Up to 1 million, half as many as VLANs","Up to 65,000, matching VLAN tag limits"],"e":"VLANs are limited to roughly 4,094 usable IDs because of their 12-bit tag, while VXLAN's larger identifier space supports up to 16 million virtual networks.","h":"VXLAN was designed specifically to scale far beyond the VLAN tag's bit-length limitation."},{"q":"Unlike VLANs, which operate at layer 2 only, what layer can VXLAN operate at, making it routable across existing networks?","a":"Layer 3, which makes it possible to route VXLAN traffic over the existing public internet","w":["Layer 1, making it purely a physical-layer technology","Layer 4, limiting it to TCP/UDP-based applications only","Layer 7, making it an application-layer protocol"],"e":"Because VXLAN virtual networks are connected over a layer 3 network, they can be routed just like any other IP traffic, including over the internet.","h":"This is the key difference that lets VXLAN scale across geographically distant data centers."},{"q":"What is a VXLAN Tunnel Endpoint (VTEP)?","a":"A device, often a top-of-rack switch, that encapsulates and decapsulates VXLAN traffic and is identified by its own IP address","w":["A cloud-based DNS server used only for VXLAN name resolution","A physical cable type used to connect data centers","A software license required to enable VLAN tagging"],"e":"VTEPs sit at the edge of each data center's VXLAN deployment, each with its own IP address, and are responsible for encapsulating/decapsulating traffic as it enters or leaves the VXLAN tunnel.","h":"This is the device on each side of the tunnel, identified by an IP address like 1.1.1.1 or 2.2.2.2."},{"q":"What does VNI stand for in a VXLAN deployment?","a":"VXLAN Network Identifier","w":["Virtual Network Interconnect","VLAN Numbering Index","Virtual Node Identifier"],"e":"The VNI identifies a specific virtual network within VXLAN, similar conceptually to a VLAN ID but with a much larger address space.","h":"It's the VXLAN equivalent of a VLAN tag number."},{"q":"When a frame is sent across a VXLAN tunnel, what headers are added to the original ethernet frame?","a":"The original frame is encapsulated within a VXLAN header, inside a UDP header, inside an IP header, inside an ethernet frame","w":["Only a VXLAN header is added, with no other encapsulation","The frame is encapsulated in a TCP header only","The frame is converted entirely into an IPv6 packet"],"e":"VXLAN encapsulation wraps the original ethernet frame inside VXLAN/UDP/IP/ethernet headers so it can be transported across the layer 3 network between VTEPs.","h":"VXLAN rides inside UDP, which rides inside a normal IP packet."},{"q":"In the VXLAN example with two data centers, what happens to VNI 2000 traffic from one data center that needs to reach VNI 2000 in the other data center?","a":"It is encapsulated by the local VTEP, transported through the VXLAN tunnel to the remote VTEP, and decapsulated there to be delivered as a normal ethernet frame","w":["It is converted into a VLAN 2000 tag and sent over a dedicated fiber link","It is dropped because VNIs cannot span multiple data centers","It is translated into an entirely new VNI number at the destination"],"e":"The tunnel transports the encapsulated frame between VTEPs; the remote VTEP decapsulates it and delivers the original frame to its destination VM, preserving the matching VNI.","h":"The VNI number stays the same on both ends of the tunnel \u2014 only the encapsulation is added and removed."},{"q":"Why can't a standard VLAN provide the same seamless connectivity between virtual machines in two separate data centers that VXLAN can?","a":"VLANs operate only at layer 2 and are limited to about 4,000 IDs, making them non-routable across a layer 3 network between distant data centers","w":["VLANs require physical fiber connections between every switch","VLANs cannot be configured on virtual switches","VLANs only support IPv6 traffic"],"e":"Because VLANs are a layer 2, non-routable technology with a limited ID space, they can't easily scale or route across a wide, multi-datacenter layer 3 network the way VXLAN can.","h":"Think about the layer limitation that was mentioned as VXLAN's key improvement over VLANs."},{"q":"What is Data Center Interconnection (DCI) in the context of VXLAN?","a":"The general concept of seamlessly connecting multiple data centers together so they function as a unified resource pool","w":["A specific brand of fiber optic cable used only between data centers","A protocol for synchronizing clock time between data centers","A security certification required for VXLAN deployment"],"e":"DCI describes the broader goal of linking data centers together, and VXLAN is one of the key technologies used to achieve it.","h":"This term was introduced as the motivating goal before VXLAN was described as the solution."},{"q":"In the VXLAN example, what made it possible for virtual machine A1 in one data center to communicate with virtual machine A2 in another data center as if they were directly connected?","a":"Both VTEPs supported the same VNI, allowing the VXLAN tunnel to connect that specific virtual network across both data centers","w":["Both virtual machines were assigned identical public IP addresses","The data centers were physically connected via the same switch","Both virtual machines used the same hostname"],"e":"Because both VTEPs are configured with matching VNIs (e.g., VNI 2000 in both locations), traffic tagged with that VNI is tunneled and delivered appropriately, making the connection feel direct.","h":"The key is that the same VNI exists and is recognized on both ends of the tunnel."}]},{"id":"zero-trust","section":"Network Environments","title":"Zero Trust","blurb":"Policy-based authentication, least privilege, and Secure Access Service Edge","cards":[{"q":"What is the core principle of a zero trust security approach?","a":"Every user, device, and application is inherently untrusted and must be continuously verified, rather than trusting anything simply because it's inside the network perimeter","w":["Only traffic entering the network from outside needs to be verified","Trust is granted permanently after a single successful login","Internal network traffic never needs to be encrypted"],"e":"Zero trust replaces the traditional model of a 'trusted inside, untrusted outside' network with continuous verification of every user, device, and application, regardless of location.","h":"The name itself describes the core assumption: nothing is trusted by default."},{"q":"What is an 'adaptive identity' in the context of policy-based authentication?","a":"An authentication process that evaluates contextual factors like who is authenticating, their location, IP address, and connection type to determine risk","w":["A username that changes automatically every 24 hours","A biometric identifier that cannot be revoked","A static list of pre-approved IP addresses"],"e":"Adaptive identity considers context \u2014 tenure with the company, geographic location, IP reputation, and connection type \u2014 to assess how risky a given authentication attempt might be.","h":"Think about the examples given: employee vs. new vendor, local vs. different country."},{"q":"According to zero trust principles, what should determine the level of access a user is granted after authentication?","a":"Least privilege \u2014 matching access strictly to the requirements of their job role","w":["Seniority alone, regardless of job function","Whichever access level is fastest to configure","Universal administrator access for simplicity"],"e":"Least privilege means users are only given the access they need to do their job \u2014 for example, read-only access to a database rather than full administrative rights.","h":"The video specifically warns against giving administrator rights 'just to be able to access a certain type of data.'"},{"q":"Why is granting unnecessary administrative access to users considered a security risk under zero trust?","a":"If a device with an administrative user is infected with malware, the malware effectively gains administrative access to all systems that user can reach","w":["Administrative accounts use more bandwidth than standard accounts","Administrative access always requires a VPN connection","Administrative accounts cannot be monitored for activity"],"e":"Over-provisioned access amplifies the blast radius of any compromise \u2014 malware on an admin's device inherits that same broad access.","h":"Consider what happens to the malware's reach if the compromised account has broad privileges."},{"q":"What does SASE stand for?","a":"Secure Access Service Edge","w":["Static Authentication Service Engine","Secure Application Server Edge","Scalable Access Security Encryption"],"e":"SASE is described as a next-generation VPN that moves security technologies into the cloud, close to where application data resides.","h":"Think of it as cloud-delivered network security, close to the data."},{"q":"How is SASE different from a traditional VPN?","a":"SASE moves security technologies into the cloud itself, near the application data, rather than routing all traffic back through a central corporate network","w":["SASE only works for mobile devices, never for desktops","SASE requires no client software on user devices","SASE eliminates the need for any authentication"],"e":"Rather than funneling traffic back to a central site, SASE places security services in the cloud near where applications actually live, improving performance and consistency regardless of user location.","h":"The video calls SASE a 'next generation' VPN \u2014 think about what's modernized."},{"q":"What security capabilities can be delivered as part of a SASE deployment?","a":"Zero trust network access, firewall as a service, and DNS security, among others","w":["Only basic password authentication","Only physical security camera monitoring","Only email spam filtering"],"e":"SASE combines network-as-a-service functionality (routing, QoS) with security services like zero trust network access, firewall as a service, and DNS security.","h":"SASE bundles both networking and security functions delivered from the cloud."},{"q":"Why is a SASE client installed on every user's device?","a":"So that security and connectivity are applied automatically and consistently, no matter what device or location the user is in, without requiring the user to manually turn anything on or off","w":["To track the user's personal browsing habits for marketing purposes","Because SASE clients replace the need for an operating system","To disable all other network connections on that device"],"e":"The SASE client ensures users get secure, consistent access to resources transparently, regardless of location \u2014 they simply use their device as normal.","h":"The goal is a seamless experience where the user doesn't have to think about security being 'on.'"},{"q":"In the traditional network security model described before zero trust, where was most of the security effort focused?","a":"On protecting the edges (perimeter) of the network, while the inside remained relatively open and accessible","w":["Entirely on securing individual user passwords","Exclusively on securing cloud-based applications","On physical security of the building only"],"e":"Traditional security concentrated on perimeter defenses, which left the interior of the network much more open once someone (or something) got past the edge.","h":"This is explicitly contrasted with zero trust's 'untrusted everywhere' approach."},{"q":"Under zero trust, besides the user's identity, what other factor about the device itself might influence the rights and permissions granted?","a":"Whether the device is company-provided and its certificate can be verified","w":["The color or physical size of the device","The device's battery level at the time of login","Whether the device has ever been rebooted"],"e":"A verified company-issued laptop with a valid certificate may be granted different (often greater) access than an unmanaged or unknown device.","h":"Think about certificate-based device trust as part of the authorization decision, separate from user identity."}]},{"id":"infrastructure-as-code","section":"Network Environments","title":"Infrastructure as Code","blurb":"Playbooks, automation use cases, and source code control for network infrastructure","cards":[{"q":"What is Infrastructure as Code (IaC)?","a":"Describing network and infrastructure configuration as code in a file, so systems can be built, versioned, and deployed automatically from that definition","w":["A programming language used exclusively for firewall rules","A physical rack labeling standard for data centers","A certification program for network engineers"],"e":"IaC lets administrators define servers, network devices, firewalls, and applications in a configuration file, then have the cloud build out that infrastructure automatically to match.","h":"The key idea is replacing manual builds with a reusable configuration definition."},{"q":"What is one major benefit of using Infrastructure as Code when deploying an identical environment to a different data center?","a":"You can simply take the same code and apply it in the new location to build an identical infrastructure, rather than manually rebuilding everything","w":["IaC automatically migrates existing data without any configuration","IaC eliminates the need for a data center entirely","IaC requires rewriting the configuration from scratch for each new location"],"e":"Because the configuration is defined as code, duplicating an environment elsewhere is as simple as applying that same code in the new location.","h":"Think about reusability \u2014 the same file can be deployed wherever needed."},{"q":"What is a playbook in the context of network and security automation?","a":"A predefined series of steps to follow in order to resolve or respond to a specific issue, which can be automated","w":["A physical binder of printed network diagrams","A list of approved vendors for hardware purchases","A schedule of scheduled maintenance windows only"],"e":"A playbook documents the well-defined steps needed to address a recurring issue (like a data breach or ransomware recovery), allowing that response to be automated and reused.","h":"Think of it as a documented, repeatable response procedure, similar to a runbook."},{"q":"What does SOAR stand for, and how does it relate to playbooks?","a":"Security, Orchestration, Automation, and Response \u2014 a platform used to centrally deploy and monitor playbooks","w":["Software Orchestration and Automated Reconfiguration \u2014 a backup tool","Secure Operations and Access Registry \u2014 a user directory service","System Operations Audit Report \u2014 a compliance logging tool"],"e":"SOAR platforms give organizations a centralized console for implementing, deploying, and monitoring automated playbooks across their security operations.","h":"This is the management console type specifically associated with playbook deployment."},{"q":"What is 'configuration drift,' and how does Infrastructure as Code help prevent it?","a":"Configuration drift is when minor differences accumulate between systems that should be identical; IaC prevents it by deploying every system from the same code definition","w":["Configuration drift refers to physical movement of servers within a rack; IaC prevents it with better cable management","It's a term for IP address changes over time; IaC prevents it using static IP assignments only","It's data loss during a cloud migration; IaC prevents it through backups"],"e":"Because every deployed instance comes from the same IaC definition, systems stay consistent rather than slowly diverging through ad hoc manual changes.","h":"Think about what happens when multiple 'identical' systems are configured by hand over time."},{"q":"How can Infrastructure as Code be useful for maintaining compliance across many systems?","a":"By ensuring every system is created using the same IaC definition, guaranteeing identical, compliant configurations everywhere","w":["By automatically generating compliance certificates without any verification","By removing the need for any compliance audits","By physically isolating noncompliant systems from the network"],"e":"Since IaC-defined systems are all built from the same source, compliance with a required standard is easier to guarantee across the entire fleet.","h":"Consistency from a single source definition is the key compliance benefit."},{"q":"Why is source control (version control) important when managing Infrastructure as Code definition files?","a":"It provides a central repository to track, test, and manage changes to configuration files, preventing conflicting or untracked changes by multiple people","w":["It automatically fixes any syntax errors in the code","It physically backs up hardware components","It replaces the need for any testing environment"],"e":"With many people potentially editing IaC files, source/version control systems like Git track changes, manage merges, and help resolve conflicts in a controlled way.","h":"Think about what happens when multiple administrators try to edit the same configuration file."},{"q":"What is a widely used version control system mentioned for managing Infrastructure as Code files?","a":"Git","w":["FTP","SNMP","RADIUS"],"e":"Git is a popular version control system used to track and merge changes to code and configuration files, including IaC definitions, among multiple contributors.","h":"This is one of the most common tools used across the software industry for tracking code changes."},{"q":"What happens when two people make conflicting changes to the same line of an Infrastructure as Code file and try to merge them?","a":"The version control software detects the conflict and either resolves it automatically or requires manual intervention by an administrator to choose the correct version","w":["The system automatically deletes both changes","The most recently saved change always silently overwrites the other with no notification","Version control systems cannot detect this kind of conflict at all"],"e":"Version control software is specifically designed to flag these conflicts, letting a person decide which change should be kept in the final merged file.","h":"This is a known challenge of collaborative editing that version control tools are built to handle."},{"q":"What is the purpose of creating a 'branch' in a version control system when working with IaC definitions?","a":"To create a separate copy of the code for testing or changes, which can later be merged back into the original/production code once validated","w":["To permanently split the production environment into two unrelated systems","To delete old, unused configuration files","To encrypt the configuration file for security"],"e":"Branching lets administrators test changes or new configurations in isolation, then merge validated changes back into production once ready.","h":"Think about how you'd safely test changes without immediately affecting the live production configuration."}]},{"id":"ipv6-addressing","section":"Network Environments","title":"IPv6 Addressing","blurb":"IPv6 address format, compression rules, and IPv4/IPv6 transition mechanisms","cards":[{"q":"How long is an IPv6 address, and how does that compare to IPv4?","a":"128 bits, compared to IPv4's 32 bits","w":["64 bits, double the length of IPv4","32 bits, the same length as IPv4","256 bits, eight times the length of IPv4"],"e":"IPv6's much larger 128-bit address space solves the exhaustion problem inherent in IPv4's 32-bit (4.29 billion address) limit.","h":"IPv6 was designed specifically to massively expand on IPv4's address space."},{"q":"What numbering system and separator does an IPv6 address use?","a":"Hexadecimal values separated by colons","w":["Decimal values separated by periods","Binary values separated by dashes","Octal values separated by colons"],"e":"Unlike IPv4's dotted decimal notation, IPv6 addresses are written in hexadecimal, with colons separating each 16-bit group.","h":"Compare the format fe80::5d18:652:6ffd:8f52 to a typical IPv4 address."},{"q":"How many bits make up each colon-separated section of an IPv6 address?","a":"16 bits (2 bytes)","w":["8 bits (1 byte)","32 bits (4 bytes)","4 bits (half a byte)"],"e":"Each section between colons represents 16 bits, and with 8 sections total, that comes to the full 128-bit address.","h":"There are 8 sections total in a full IPv6 address, each contributing to the 128-bit total."},{"q":"When compressing an IPv6 address, what is the rule about using a double colon (::) to replace groups of zeros?","a":"A double colon can replace one or more consecutive groups of all-zero sections, but can only be used once per address","w":["A double colon can be used as many times as needed in a single address","A double colon can only replace a single zero within one group, not an entire group","Double colons may only appear at the very end of an address"],"e":"Because the double colon represents an unspecified number of zero groups, it can only appear once per address \u2014 otherwise the address would be ambiguous.","h":"If you used it twice, there would be no way to know how many zero groups each one represented."},{"q":"When compressing an IPv6 address, what happens to leading zeros within each 16-bit group?","a":"Leading zeros within each group can be removed","w":["Leading zeros must always be kept for accuracy","Leading zeros are converted to trailing zeros","Leading zeros can only be removed from the final group"],"e":"Within any given group, leading zeros can be dropped \u2014 for example, 0001 becomes 1 \u2014 in addition to any double-colon compression of all-zero groups.","h":"This rule applies independently to each group's own zeros, separate from the double-colon rule for whole zero groups."},{"q":"What is the compressed form of the IPv6 address 2601:04C3:4002:BE00:0000:0000:0000:0066?","a":"2601:4C3:4002:BE00::66","w":["2601:4C3:4002:BE00:0:0:0:66","2601::4C3:4002:BE00:66","2601:4C3:4002::BE00:66"],"e":"Leading zeros are dropped from each group (04C3 to 4C3), and the three consecutive all-zero groups are replaced with a single double colon, giving 2601:4C3:4002:BE00::66.","h":"Look for the run of all-zero groups in the middle/end of the address to collapse with ::."},{"q":"Why can't IPv4 and IPv6 devices communicate directly with each other?","a":"They use fundamentally different addressing formats and protocols, so legacy IPv4-only systems cannot natively understand IPv6 traffic and vice versa","w":["IPv6 uses a completely different physical cabling standard","IPv4 addresses are encrypted while IPv6 addresses are not","IPv6 only works over wireless connections"],"e":"Because the two protocols are structurally incompatible, bridging technologies like tunneling, dual-stack, or translation are needed to let the two communicate.","h":"This is about protocol incompatibility at the addressing/header level, not physical media."},{"q":"What is dual-stack routing, and why is it considered a good middle-ground transition method?","a":"Running both IPv4 and IPv6 simultaneously on the same system/interface, letting applications use whichever protocol they prefer","w":["Running two separate physical network cards, one for each protocol","Converting all IPv4 traffic into IPv6 before transmission","Using a single IP address that works for both protocols interchangeably"],"e":"Dual-stack lets a device maintain independent IPv4 and IPv6 configurations and routing tables at the same time, so applications can use either protocol as needed without one replacing the other.","h":"The key feature is having both protocols fully functional at once, rather than choosing one or tunneling through the other."},{"q":"What is NAT64, and what specialized DNS service does it rely on?","a":"NAT64 translates between IPv6 and IPv4 addresses, relying on a specialized DNS64 server to handle the DNS translation between the two protocols","w":["NAT64 only works for IPv4-to-IPv4 translation and requires no special DNS service","NAT64 is a VPN protocol that requires DNSSEC","NAT64 converts MAC addresses and relies on a DHCP64 server"],"e":"NAT64 allows an IPv6-only client to communicate with an IPv4-only server by translating addresses at a specialized router, with DNS64 handling the necessary DNS resolution translation.","h":"The '64' naming pattern mirrors regular NAT, but for bridging between the two IP versions instead of public/private IPv4."},{"q":"Why is 6to4 addressing considered largely obsolete today, to the point of being removed from Windows?","a":"It doesn't support network address translation and requires a specialized relay router, and most devices now natively support IPv6","w":["It was replaced because it used too much bandwidth compared to native IPv6","It was discontinued because it only worked with IPv4 private addresses","It was removed because it conflicts with DNS64"],"e":"6to4's lack of NAT support and reliance on specialized relay routers made it impractical as more infrastructure gained native IPv6 support, leading to its removal from modern operating systems.","h":"Consider both its technical limitations and the broader shift toward native IPv6 adoption."}]},{"id":"static-routing","section":"Routing Technologies","title":"Static Routing","blurb":"Manually configuring routes in a router's routing table","cards":[{"q":"What happens when a router receives a packet whose destination IP address has no matching entry in its routing table?","a":"The router discards the packet","w":["The router broadcasts it to every connected interface","The router automatically creates a static route for it","The router forwards it to the default gateway of the destination network"],"e":"If there's no matching route (and no default route) for the destination, the router simply drops the packet because it has no way to know where to send it.","h":"Without a valid entry, the router has no information at all about where that traffic should go."},{"q":"What is static routing?","a":"The administrative, manual configuration of routes directly into a router's routing table","w":["A routing method that automatically updates itself using multicast updates","A routing protocol that only works with IPv6 networks","A method where routes expire automatically after 24 hours"],"e":"With static routing, the network administrator manually enters each route into every router that needs it, rather than relying on automatic discovery.","h":"The 'static' in the name reflects that these routes don't change without manual intervention."},{"q":"What is a key advantage of static routing in terms of router resource usage?","a":"There's no overhead from a dynamic routing protocol, so no extra CPU cycles or memory usage are required for route discovery and updates","w":["Static routes use more memory but less CPU than dynamic routes","Static routing requires specialized hardware not needed for dynamic routing","Static routing automatically balances CPU load across multiple routers"],"e":"Because static routes are simply entered manually and never recalculated, there's no ongoing processing overhead like there is with dynamic routing protocols.","h":"Compare this to a dynamic routing protocol, which has to continuously process updates."},{"q":"What type of remote network location is commonly well-suited for static routing, due to having only one path in and out?","a":"A stub network \u2014 a site with a single internet/WAN connection","w":["A network with dozens of redundant internet connections","A data center with multiple ISPs for failover","A network using BGP for internet peering"],"e":"Stub networks have only one way in or out, so there's no need for dynamic route discovery \u2014 a simple static route handles all traffic efficiently and securely.","h":"Think about a remote branch office with just one connection back to headquarters."},{"q":"What is a major disadvantage of static routing on a large network with many routers?","a":"Manually configuring and maintaining routes on hundreds or thousands of routers individually can take a significant amount of time and is prone to misconfiguration","w":["Static routes cannot be configured via SSH, only through a console cable","Static routing requires a license fee per router","Static routes consume significantly more bandwidth than dynamic routes"],"e":"At scale, manually entering and maintaining consistent static routes across many devices becomes time-consuming and increases the risk of errors like routing loops.","h":"Think about the practicality of manually touching every single router as your network grows."},{"q":"What happens to a static route if the network topology changes, such as a link going down?","a":"Nothing automatically updates \u2014 an administrator must manually log in and reconfigure the affected routes","w":["The static route automatically reroutes traffic via the next best path","The router automatically disables itself until the route is fixed","Static routes automatically convert to dynamic routes during an outage"],"e":"Because static routes don't adapt on their own, any topology change requires manual administrator intervention to update the routing tables.","h":"This is the trade-off for the simplicity and low overhead of static routing \u2014 no automatic failover."},{"q":"In the example network with routers 1, 2, and 3, why couldn't Sam (connected to router 1) initially reach Jack (behind router 2)?","a":"Router 1 only knew about its own directly connected subnets and had no route to the subnet behind router 2 in its routing table","w":["Sam's device was using the wrong subnet mask","Router 2 had a firewall blocking all traffic from router 1","The physical cable between the routers was faulty"],"e":"Router 1's routing table only contained its three directly connected networks; without a route to the subnet behind router 2, any packet to that destination would be discarded.","h":"Recall what happens when there's no matching routing table entry."},{"q":"How would an administrator manually fix router 1's inability to reach the network behind router 2 using static routing?","a":"Configure a static route on router 1 specifying that traffic for that destination subnet should be sent to router 2's IP address as the next hop","w":["Install a firewall rule allowing all traffic through router 1","Change router 1's own IP address to match router 2's subnet","Enable DHCP relay on router 1"],"e":"A static route tells router 1 explicitly: for this destination subnet, send traffic to this next-hop IP address (router 2), so it no longer discards that traffic.","h":"The fix is adding the missing routing table entry manually, specifying the correct next hop."},{"q":"Once router 1 forwards traffic to router 2 as the next hop for a remote subnet, what does router 2 do with that traffic?","a":"Router 2 checks its own routing table, recognizes the destination subnet as directly connected, and forwards the packet onto that local subnet","w":["Router 2 automatically forwards it back to router 1","Router 2 drops the packet since it wasn't the original sender","Router 2 requires its own separate static route pointing back to router 1 before it can forward anything"],"e":"Since the destination subnet is directly connected to router 2, router 2 can deliver the packet locally without needing any additional routing decisions.","h":"Router 2 only needs to recognize that the destination is one of its own directly connected networks."},{"q":"Based on a past misconfiguration example mentioned, what risk exists when manually configuring static routes?","a":"An administrator can accidentally create a routing loop through a misconfiguration","w":["Static routes can never cause any kind of network problem","Static routes automatically self-correct any misconfiguration","Static routing always requires factory resetting the router if misconfigured"],"e":"Because static routes are manually entered with no automatic validation of logical consistency, it's possible to inadvertently create a loop or other misconfiguration.","h":"Manual configuration always carries some risk of human error, including creating unintended loops."}]},{"id":"dynamic-routing","section":"Routing Technologies","title":"Dynamic Routing","blurb":"How dynamic routing protocols automatically discover and update routes, and comparing EIGRP, OSPF, and BGP","cards":[{"q":"What is the main advantage of dynamic routing over static routing?","a":"Routers automatically discover routes and update each other, eliminating the need for an administrator to manually configure or update every route","w":["Dynamic routing requires no CPU or memory resources at all","Dynamic routing is always faster to initially configure than static routing","Dynamic routing eliminates the need for IP addressing entirely"],"e":"Dynamic routing protocols let routers automatically learn about the network and update their tables as changes occur, removing the manual administrative burden of static routing.","h":"Think about what tasks the administrator no longer has to do manually."},{"q":"What is a key trade-off or cost of using dynamic routing compared to static routing?","a":"Dynamic routing requires additional CPU and memory overhead on the router to discover and maintain routes automatically","w":["Dynamic routing cannot work with more than two routers","Dynamic routing requires manual configuration of every single route, just like static routing","Dynamic routing protocols cannot detect network outages"],"e":"The automation dynamic routing provides comes at the cost of ongoing CPU and memory usage to continuously discover, calculate, and update routes.","h":"Automatic discovery and updating isn't free \u2014 it requires ongoing router resources."},{"q":"In general terms, how do routers using a dynamic routing protocol learn about routes from their neighbors?","a":"They listen for routing updates sent directly or via multicast from neighboring routers, then build and share their own routing table accordingly","w":["They physically request a printed routing table from the network administrator","They only learn routes when manually rebooted","They use ARP broadcasts exclusively to learn about remote networks"],"e":"Routers exchange routing information with neighbors (directly or via multicast), incorporate useful updates into their own tables, and then advertise their known routes to others.","h":"This mirrors how EIGRP updates were described moving between router 1, 2, and 3 in the example."},{"q":"EIGRP is most strongly associated with which vendor's hardware, even though it's available elsewhere?","a":"Cisco","w":["Juniper","HP","Dell"],"e":"EIGRP tends to be used mostly in Cisco-centric environments, with some proprietary aspects that are specific to Cisco, even though EIGRP has been made available on other platforms too.","h":"The video describes it as being used 'mostly in Cisco-related configurations.'"},{"q":"What is one key advantage of EIGRP mentioned in terms of configuration and convergence?","a":"It's relatively easy to set up and converges (adapts to changes) quickly while also preventing routing loops","w":["It requires no configuration at all and works immediately out of the box with zero setup","It is the only routing protocol that supports IPv6","It eliminates the need for any routing table"],"e":"EIGRP is praised for being simple to enable, converging quickly after network changes, and having built-in loop prevention.","h":"Think about ease of setup combined with how fast it reacts to topology changes."},{"q":"What does OSPF stand for?","a":"Open Shortest Path First","w":["Optimal Switching Path Framework","Open Source Path Finder","Ordered Shortest Packet Flow"],"e":"OSPF is the Open Shortest Path First protocol, a widely-supported, vendor-neutral link-state routing protocol.","h":"This is one of the most common vendor-neutral routing protocols used across many manufacturers' devices."},{"q":"What type of routing protocol is OSPF, and what does that mean for how it determines the best route?","a":"OSPF is a link-state protocol that determines the best route based on the uptime, availability, and assigned cost of links between routers","w":["OSPF is a distance-vector protocol that only counts hops","OSPF is a path-vector protocol used primarily for internet-wide routing","OSPF makes routing decisions purely at random to balance load"],"e":"As a link-state protocol, OSPF evaluates the actual state and cost of links, favoring the lowest-cost, fastest path to a destination, rather than simply counting hops.","h":"OSPF considers link cost/availability, not just a simple hop count like RIP."},{"q":"What term describes a network where an organization has complete administrative control over a group of OSPF routers, such as a 50-router WAN?","a":"An Autonomous System (AS)","w":["A Collapsed Core","A Stub Network","A Broadcast Domain"],"e":"An Autonomous System refers to a group of routers under single administrative control, a concept OSPF is often implemented within.","h":"This term is also used in the context of BGP for routing between organizations."},{"q":"What does BGP stand for, and what is it primarily used for?","a":"Border Gateway Protocol \u2014 used to route traffic between autonomous systems, such as across the internet","w":["Basic Gateway Protocol \u2014 used only within a single LAN","Bridge Gateway Protocol \u2014 used to connect VLANs on a single switch","Backup Gateway Protocol \u2014 used only as a failover for OSPF"],"e":"BGP is an external gateway protocol specifically designed to route traffic between different autonomous systems, making it the backbone protocol of internet routing.","h":"BGP connects separate organizations' networks together, unlike interior protocols like OSPF or EIGRP."},{"q":"Why is BGP sometimes nicknamed the 'three-napkins protocol'?","a":"Because it was originally sketched out on napkins to solve the problem of dynamically routing traffic across the growing internet","w":["Because it requires exactly three routers to function at minimum","Because it has three separate configuration modes","Because its documentation was originally only three pages long"],"e":"This nickname references BGP's informal origin story \u2014 it was reportedly first drafted on napkins by its creators to address internet-scale routing challenges.","h":"This is a bit of protocol trivia about BGP's informal design origins."}]},{"id":"routing-technologies","section":"Routing Technologies","title":"Routing Technologies","blurb":"Routing table details, administrative distance, metrics, FHRP, and subinterfaces","cards":[{"q":"In a Cisco-style routing table entry, what does the route code letter (such as 'C' or 'R') at the start of a line indicate?","a":"How that route was learned \u2014 for example, 'C' for directly connected or 'R' for RIP","w":["The administrative distance of the route","The physical port number used by that route","The encryption type applied to that route's traffic"],"e":"The route code is a shorthand identifying the source of the route, referenced against a legend at the top of the routing table output.","h":"This single letter tells you the origin of the route entry \u2014 directly connected, learned via RIP, OSPF, etc."},{"q":"When multiple routes exist to the same destination with different prefix lengths (such as /16, /24, and /32), which route does the router prefer?","a":"The most specific route \u2014 the one with the longest prefix length (closest to /32)","w":["The least specific route, to reduce processing overhead","Whichever route was added to the table first, regardless of prefix length","The route with the lowest administrative distance only, regardless of prefix length"],"e":"Routers use the most specific matching route available; a /32 is more specific than a /24, which is more specific than a /16, for the same destination address.","h":"Think about which route pinpoints the destination most precisely."},{"q":"What does administrative distance represent in a router's decision-making process?","a":"A value assigned to different route sources/protocols indicating how trustworthy or preferred that source is, with lower values preferred","w":["The physical distance in meters to the destination network","The number of routers a packet must pass through to reach its destination","The speed of the link in megabits per second"],"e":"Administrative distance ranks different route sources against each other \u2014 e.g., directly connected routes (AD 0) are more trusted than RIP (AD 120) or OSPF (AD 110) routes.","h":"Lower is better \u2014 directly connected routes have the lowest (most trusted) administrative distance."},{"q":"What administrative distance is typically assigned to a manually configured static route on a Cisco router?","a":"1","w":["0","90","120"],"e":"Static routes get an administrative distance of 1, reflecting that the administrator who configured it is assumed to know the network well, just below directly connected routes at 0.","h":"This is just one step above the administrative distance given to directly connected networks."},{"q":"What is a routing metric, and why can't metrics be compared across different routing protocols?","a":"A metric is an internal value a specific routing protocol uses to choose the best route among multiple options to the same destination, and each protocol calculates its metric differently, making cross-protocol comparison meaningless","w":["A metric is a universal numeric standard that works identically across all routing protocols","Metrics are only used by static routing, never by dynamic protocols","A metric measures the physical cable length only"],"e":"RIP uses hop count, EIGRP uses its own bandwidth/delay-based formula, and BGP uses yet another method \u2014 none of these values can be meaningfully compared to each other.","h":"Each protocol has its own internal 'yardstick,' so you can't mix and match metric values across protocols."},{"q":"What metric does RIP version 2 use to determine the best route?","a":"The number of hops to the destination","w":["Link bandwidth in megabits per second","Administrative distance","Round-trip latency in milliseconds"],"e":"RIP is a simple distance-vector protocol that uses hop count as its metric \u2014 fewer hops is considered a better route.","h":"RIP is known for being one of the simplest routing protocols in terms of its metric calculation."},{"q":"What problem does a First Hop Redundancy Protocol (FHRP) solve for end-user devices that can only configure a single default gateway?","a":"It provides router redundancy by creating a virtual IP address that can move between physical routers, so end-user devices never need to change their configured gateway","w":["It allows a device to configure multiple default gateways simultaneously","It eliminates the need for a default gateway entirely","It automatically load-balances traffic across every router on the subnet regardless of configuration"],"e":"FHRP lets a virtual IP represent the active router; if that router fails, the backup router takes over the virtual IP so devices experience no disruption despite only having one gateway configured.","h":"The key insight is that end devices still only ever see one gateway IP \u2014 the virtual IP \u2014 regardless of which physical router is actually active."},{"q":"In an FHRP setup with an active and standby router, what happens if the active router fails?","a":"The standby router detects the failure, takes over the virtual IP address, and becomes the active router so traffic continues flowing without any changes needed on end devices","w":["All end-user devices must be manually reconfigured with a new g
